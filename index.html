<html lang="en">

<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--soft:#f9fafb;--acc:#ea580c;--acc-ink:#fff;--acc-soft:#fff3eb;--ok:#15803d;--ok-soft:#ecfdf3;--bad:#dc2626;--bad-soft:#fef2f2;--warn:#b45309;--warn-soft:#fffbeb;--nav:#111827;--nav-ink:#9ca3af;--r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--ink:#e5e7eb;--mute:#9ca3af;--line:#243041;--soft:#1b2230;--acc-soft:#2a1a10;--ok-soft:#0f2418;--bad-soft:#2a1414;--warn-soft:#2a2210;--nav:#070a10;--sh:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:0 0 10px}
label>input,label>select,label>div{margin-top:4px}
h2{margin:0;font-size:22px;letter-spacing:-.02em}h3{margin:0 0 14px;font-size:18px}
.mute{color:var(--mute)}.small,small{font-size:12px}.grow{flex:1}.c{text-align:center}.b{font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-weight:600;min-height:42px;white-space:nowrap}
.btn:hover{border-color:var(--mute)}.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}.btn.icon{padding:0;width:42px}
.link{background:none;border:0;padding:0;color:var(--acc);font-weight:600;cursor:pointer}.link.danger{color:var(--bad)}
.row{display:flex;align-items:center;gap:8px}.row.end{justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.inrow{display:flex;gap:6px}.inrow input{margin:0}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}.chk input{width:auto;min-height:0}
#app{display:flex;height:100%;height:100dvh}
/* nav */
.nav{width:230px;background:var(--nav);color:#fff;display:flex;flex-direction:column;padding:16px 12px;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 16px}.brand b{display:block;font-size:14px;line-height:1.2}.brand span{font-size:12px;color:var(--nav-ink)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex-shrink:0;font-weight:800;color:#fff}
.navlist{display:flex;flex-direction:column;gap:2px;flex:1}
.navlist button,.navfoot button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:10px;background:none;color:var(--nav-ink);cursor:pointer;font-weight:600;text-align:left;width:100%}
.navlist button:hover{background:#1f2937;color:#fff}.navlist button.on{background:#1f2937;color:#fff}.navlist button.on svg{color:var(--acc)}
.navfoot{border-top:1px solid #1f2937;padding-top:10px}
.brsel{background:#1f2937;border-color:#1f2937;color:#fff;margin:0 0 12px;min-height:38px;padding:8px 10px}
.sync{font-size:12px;color:var(--nav-ink);padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#6b7280;display:inline-block}.dot.ok{background:#22c55e}.dot.pend{background:#f59e0b}.dot.err{background:#ef4444}
main{flex:1;overflow:auto;min-width:0;display:flex;flex-direction:column}
#view{flex:1;min-height:0}
.mtop{display:none}
.page{padding:22px;max-width:1200px;margin:0 auto}
.ph-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:14px}.card h4{margin:0 0 12px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.kpi small{color:var(--mute);font-weight:600}.kpi b{display:block;font-size:22px;letter-spacing:-.02em;margin-top:2px}
.tb{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;position:relative}.search svg{position:absolute;left:12px;top:11px;color:var(--mute)}.search input{padding-left:40px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;scrollbar-width:none}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
/* sell */
.sell{display:grid;grid-template-columns:1fr 390px;height:100%;min-height:0}
.catalog{padding:18px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform .08s}
.tile:active{transform:scale(.97)}.tile:hover{border-color:var(--acc)}.tile.out{opacity:.6}
.slsec{grid-column:1/-1;font-weight:700;font-size:13px;color:var(--mute);margin:10px 2px 0;border-top:1px dashed var(--line);padding-top:10px}
.tile.sl{border-style:dashed}.tile.sl .tname{min-height:0}
.cchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;line-height:1.5;border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:4px;vertical-align:middle;color:var(--ink);background:var(--card);white-space:nowrap}.cchip i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.3);display:inline-block}
.dpg.off{opacity:.55}.dpi{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);margin:0;font-weight:400}.dpi small{display:block}.dpi input[type=radio]{width:20px;height:20px;flex:none;margin:2px 0 0;padding:0}.dpi .grow{flex:1;min-width:0;color:var(--ink)}.dpi .grow b{font-weight:700}.dpi .r{text-align:right;white-space:nowrap}
.rl label.need input{border-color:var(--bad)}.lo-add{display:flex;align-items:flex-end;padding-bottom:10px}
button:disabled,.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.slr{border-bottom:1px solid var(--line);padding:8px 0}.slr .row{gap:8px;align-items:center}.slr .row+.row{margin-top:6px}.slr input{min-width:0;padding:8px}.slr label.sm{margin:0;font-size:11px;width:92px;flex:none}
.ph{aspect-ratio:4/3;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff}
.ph.ini{background:hsl(var(--h),40%,92%);color:hsl(var(--h),45%,32%)}
@media (prefers-color-scheme:dark){.ph.ini{background:hsl(var(--h),25%,20%);color:hsl(var(--h),55%,75%)}}
.tname{padding:8px 10px 2px;font-weight:600;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.tfoot{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 10px;gap:4px}.tfoot b{font-size:14px}
.stk{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--ok-soft);color:var(--ok)}.stk.warn{background:var(--warn-soft);color:var(--warn)}.stk.bad{background:var(--bad-soft);color:var(--bad)}
.cart{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.cart-h b{font-size:16px}
#cartclose{display:none;margin-left:auto}
.cancelsale{margin-left:auto;color:var(--bad);border-color:var(--bad);padding:4px 10px}#cartclose+.cancelsale,.cancelsale+#cartclose{margin-left:0}
.lrm{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center}.lrm:hover,.lrm:active{background:var(--soft);color:var(--bad)}
.tile2{cursor:default}.tile2 .t2top{cursor:pointer;display:flex;flex-direction:column;flex:1}
.tchoice{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 8px 8px}.tchoice button{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15;color:var(--ink)}.tchoice button b{font-size:14px}.tchoice button small{font-size:10.5px}.tchoice .lo{border-color:var(--acc)}.tchoice button:active{transform:scale(.97)}
.lines{flex:1;overflow:auto;padding:6px 10px}
.line{display:grid;grid-template-columns:1fr auto 76px 30px;gap:6px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line)}
.ln div{font-weight:600;font-size:14px;line-height:1.25}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:32px;height:34px;border:0;background:var(--soft);cursor:pointer;font-size:18px}
.qty input{width:52px;border:0;border-radius:0;text-align:center;padding:0;min-height:34px;box-shadow:none}
.lt{text-align:right;font-weight:700;cursor:pointer}
.cart-f{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--soft)}
.cart-f .row{justify-content:space-between;padding:3px 0}.cart-f .total{font-size:22px;font-weight:800;padding:8px 0}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.btn.pay{min-height:52px;font-size:15px}.btn.pay:first-child{background:var(--acc);color:#fff;border-color:var(--acc);grid-column:1/-1;font-size:17px}
.rl{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--soft)}.rl .g6{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:6px}.rl label{margin:0;font-size:11px}.rl input{min-height:38px;padding:7px 9px}.rinfo{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:13px;margin-top:8px}.tagl{margin-top:5px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.np{min-height:36px;padding:6px 8px}
.tbr{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--acc)}
.den td{padding:4px 6px;border:0}.den input{min-height:36px;padding:6px 8px}.resrow{display:flex;justify-content:space-between;padding:4px 0}.resrow.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:800;font-size:17px}.exrow{display:grid;grid-template-columns:1fr 100px 34px;gap:6px;margin-bottom:6px}.exrow input{min-height:36px;padding:6px 8px}.pform .row .btn.sm{padding:6px 2px;min-width:0;font-size:12px}
.lt small{display:block;font-size:11px;color:var(--ok);font-weight:600}.ln{cursor:pointer}.capwarn{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:8px;margin:4px 0}.skuprev{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--mute)}textarea{min-height:200px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.empty{text-align:center;color:var(--mute);padding:40px 20px}.empty svg{opacity:.4}
.cartfab{display:none}
/* lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}.li:last-child{border-bottom:0}.li:hover{background:var(--soft)}
.li .ph{width:46px;height:46px;aspect-ratio:auto;border-radius:10px;font-size:15px;flex-shrink:0}
.li b{display:block;font-size:14px}.li .r{text-align:right}.li .r small,.li small{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}.tw{overflow-x:auto}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mute)}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.acc{background:var(--acc-soft);color:var(--acc)}
/* modal */
.mwrap{position:fixed;inset:0;background:rgba(10,12,18,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fade .15s}
.modal{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:720px}.modal.full{max-width:980px}
@keyframes fade{from{opacity:0}}
.big-total{font-size:34px;font-weight:800;text-align:center;margin:4px 0 16px;letter-spacing:-.02em}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}.change{font-size:20px;font-weight:700;text-align:center;padding:10px;background:var(--ok-soft);color:var(--ok);border-radius:10px}
.pform{display:grid;grid-template-columns:130px 1fr;gap:14px}
.photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:14px;aspect-ratio:1;cursor:pointer;overflow:hidden;color:var(--mute);margin:0}.photo img{width:100%;height:100%;object-fit:cover}
.margin{font-size:13px;padding:8px 12px;background:var(--soft);border-radius:10px;margin-bottom:6px}
.rcptwrap{background:var(--soft);padding:14px;border-radius:12px;max-height:50vh;overflow:auto}
.rcpt{font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;max-width:300px;margin:0 auto;background:#fff;color:#000;padding:12px}
.rcpt .hr{border-top:1px dashed #000;margin:6px 0}.rcpt .rr{display:flex;justify-content:space-between;gap:8px}
.pline{display:grid;grid-template-columns:2.4fr .8fr 1fr 1fr 1fr 34px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pline input{min-height:38px;padding:7px 9px}.pline .tag{font-size:10px;font-weight:700}
.phead{font-size:11px;color:var(--mute);font-weight:700}
.rthumb{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--soft)}
.upl{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;cursor:pointer;color:var(--mute);display:block}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px}
.bars div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;position:relative}.bars div:hover{opacity:.8}
.blbl{display:flex;gap:3px;font-size:10px;color:var(--mute)}.blbl span{flex:1;text-align:center;overflow:hidden}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:12px;font-weight:600;z-index:200;box-shadow:var(--sh);max-width:90vw;animation:fade .2s}
.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:#b45309;color:#fff}.toast.ok{background:var(--ok);color:#fff}
/* login */
.login{flex:1;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 20% 0%,#1f2937,var(--nav))}
.login-card{background:var(--card);border-radius:22px;padding:26px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login-card .brand{padding:0 0 18px}.login-card .brand span{color:var(--mute)}.login-card .brand b{font-size:17px}
.users{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ubtn{flex:1;min-width:90px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-weight:600}
.ubtn.on{border-color:var(--acc);background:var(--acc-soft)}.ubtn small{color:var(--mute);font-weight:500}
.av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:700}
.pin{display:flex;justify-content:center;gap:14px;margin:6px 0 16px}.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute)}.pin i.f{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-size:22px;font-weight:600;cursor:pointer}.pad button:active{background:var(--acc-soft)}
#print-area{display:none}
@media print{
 body *{visibility:hidden!important}
 #print-area,#print-area *{visibility:visible!important}
 #print-area{display:block!important;position:absolute;left:0;top:0;width:100%}
 #print-area.r58 .rcpt{width:58mm;max-width:none;padding:0;font-size:11px}
 #print-area.r80 .rcpt{width:76mm;max-width:none;padding:0}
 .labels{display:flex;flex-wrap:wrap;gap:2mm}
 .lbl{width:50mm;height:30mm;border:1px dashed #999;padding:1.5mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;page-break-inside:avoid;font:9px/1.1 Arial,sans-serif;color:#000}
 .lbl .nm{font-weight:700;text-align:center;max-height:7mm;overflow:hidden}.lbl .pr{font-size:12px;font-weight:800}.lbl svg{max-width:46mm;height:13mm}.lbl .qr{width:16mm;height:16mm}.lbl .qr img,.lbl .qr canvas{width:16mm!important;height:16mm!important}
 @page{margin:4mm}
}
/* tablet */
@media (max-width:1100px){.sell{grid-template-columns:1fr 340px}}
@media (max-width:980px) and (min-width:761px){.nav{width:74px;padding:14px 8px}.nav .brand div,.navlist span,.navfoot span,.sync span,.brsel{display:none}.navlist button,.navfoot button{justify-content:center}.brand{justify-content:center}}
/* phone */
@media (max-width:760px){
 #app{flex-direction:column}
 .nav{position:fixed;left:0;right:0;bottom:0;width:auto;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:50;border-top:1px solid #1f2937}
 .nav .brand,.navfoot,.brsel{display:none}
 .navlist{flex-direction:row;justify-content:space-around}
 .navlist button{flex-direction:column;gap:2px;font-size:10px;padding:6px 4px;align-items:center;flex:1}
 .mtop{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--nav);color:#fff;position:sticky;top:0;z-index:30}
 .mtop .logo{width:30px;height:30px;font-size:13px}.mtop select{flex:1;background:#1f2937;border-color:#1f2937;color:#fff;min-height:36px;padding:6px 10px}
 .mtop button{background:none;border:0;color:#cbd5e1;padding:6px}
 main{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
 .page{padding:14px}
 .sell{grid-template-columns:1fr;height:auto}#view{flex:none}main{display:block}.catalog{padding:12px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}.tname{font-size:12px;min-height:34px;padding:6px 8px 0}.tfoot{padding:2px 8px 8px}.tfoot b{font-size:13px}

function parseCSV(t){const rows=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src+' (offline?)'));document.head.appendChild(s)})}

async function compressImage(file,max=600,q=.72){const src=await readFile(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);return c.toDataURL('image/jpeg',q)}
async function hashPin(pin,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+pin}}

/* ========= storage (IndexedDB) ========= */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('tindero_pos',1);r.onupgradeneeded=()=>{const d=r.result;const s=d.createObjectStore('rec',{keyPath:'id'});s.createIndex('kind','kind');s.createIndex('dirty','dirty')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 st(m){return this.db.transaction('rec',m).objectStore('rec')},
 rq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 get(id){return this.rq(this.st('readonly').get(id))},
 put(rec){return this.rq(this.st('readwrite').put(rec))},
 putMany(recs){return new Promise((res,rej)=>{const t=this.db.transaction('rec','readwrite');const s=t.objectStore('rec');recs.forEach(r=>s.put(r));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
 boot(){return new Promise((res,rej)=>{const out=[];const c=this.st('readonly').openCursor();c.onsuccess=()=>{const k=c.result;if(!k)return res(out);if(k.value.kind!=='receipt')out.push(k.value);k.continue()};c.onerror=()=>rej(c.error)})},
 all(){return this.rq(this.st('readonly').getAll())},
 dirty(){return this.rq(this.st('readonly').index('dirty').getAll(1))},

const DEF_CATS=[['CM','Cement & Masonry'],['ST','Steel'],['LP','Lumber & Plywood'],['PT','Paint'],['PL','Plumbing'],['EL','Electrical'],['FS','Fasteners'],['TL','Tools'],['RF','Roofing'],['AD','Adhesives & Sealants'],['GN','Uncategorized']];

const SKU_TYPES=[[/pvc solvent|solvent cement|\bsolvent\b/,'SOL'],[/contact cement|rugby/,'CC'],[/epoxy/,'EPX'],[/wood glue|white glue|elmer/,'WG'],[/super ?glue|instant glue|mighty ?bond/,'CA'],[/silicone/,'SIL'],[/vulcaseal|sealant|waterproof/,'SEA'],[/tile adhesive|\bgrout\b/,'TA'],[/construction adhesive|adhesive/,'CON'],[/lacquer thinner/,'LTH'],[/thinner/,'PTH'],

const SKU_COLORS={white:'WHT',clear:'CLR',transparent:'CLR',black:'BLK',blue:'BLU',red:'RED',green:'GRN',yellow:'YEL',gray:'GRY',grey:'GRY',brown:'BRN',orange:'ORG',cream:'CRM',silver:'SLV',gold:'GLD'};

const SKU_UNIT=u=>{u=u.replace(/\s/g,'');if(/^(mm²|mm2|sq\.?mm)$/.test(u)||/^(in|inch|inches|")$/.test(u))return '';if(/^kgs?$/.test(u))return 'KG';if(/^(l|ltrs?|liters?|litres?)$/.test(u))return 'L';if(/^gal/.test(u))return 'GAL';if(/^w(atts?)?$/.test(u))return 'W';return u.toUpperCase()};
function skuSizes(name,cc){let s=String(name).toLowerCase().replace(/×/g,'x').replace(/[”″]|''/g,'"');const out=[];
 const dm=s.match(/\b(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)(?![\d.])(?:\s*x\s*(\d+(?:\.\d+)?)(?![\d.]))?(?!\s*(?:mm|cm|m\b|kg|"|in|ft))/);if(dm){out.push(dm.slice(1).filter(Boolean).join('X'));s=s.replace(dm[0],' ')}
 const re=/(\d+(?:\.\d+)?(?:\/\d+)?)\s*(mm²|mm2|sq\.?\s?mm|mm|cm|kgs?|ml|cc|ltrs?|liters?|litres?|gallons?|gal|oz|watts?|inch(?:es)?|in|ft|"|kg|g|l|w|m|v|a)(?![a-z0-9²])/g;let m;
 while((m=re.exec(s))&&out.length<2){let v=m[1],u=m[2];if(/^kgs?$/.test(u)&&v.includes('/')){const [a,b]=v.split('/').map(Number);if(b){out.push(Math.round(a/b*1000)+'G');continue}}if(cc==='LP'&&(u==='"'||/^in/.test(u))&&PLY_MM[v]){out.push(PLY_MM[v]);continue}out.push(v+SKU_UNIT(u))}
 if(!out.length){const f=s.match(/\b(\d+\/\d+)\b/);if(f)out.push(cc==='LP'&&PLY_MM[f[1]]?PLY_MM[f[1]]:f[1])}

function renderCart(){const c=S.cart,t=totals(),el=$('#cart');if(!el)return;
 el.innerHTML=`<div class="cart-h"><b>Current sale</b><span class="mute small">${c.length} line${c.length===1?'':'s'}</span>${c.length?`<button class="btn sm cancelsale" onclick="cancelSale()">${ic('x',14)} Cancel sale</button>`:''}<button class="btn ghost sm" id="cartclose" onclick="toggleCart(false)">${ic('x')}</button></div>
 <div class="lines">${c.length?c.map((l,i)=>`<div class="line"><div class="ln" onclick="editLine(${i})"><div>${esc(l.name)}</div><small class="mute">${peso(l.price)} / ${esc(l.unit)}${l.bulk?` (${fmtQty(l.mult)} ${esc(S.products.get(l.pid)?.unit||'')})`:''}${(()=>{const pp=S.products.get(l.pid);return pp&&+pp.bulkPrice>0?` · <button class="link" style="font-size:12px" onclick="event.stopPropagation();setBulk(${i},${!l.bulk})">${l.bulk?'by '+esc(pp.unit||'pc'):'by '+esc(pp.buyUnit||'bulk')+' '+peso(bulkPriceOf(pp,l.from))}</button>`:''})()}${(()=>{const pp=S.products.get(l.pid);if(!pp||!hasLoose(pp)||(l.loose&&!hasPrice(pp)))return '';return ` · <button class="link" style="font-size:12px" onclick="event.stopPropagation();setLoose(${i},${!l.loose})">${l.loose?'by '+esc(pp.unit||'pc')+' '+peso(priceOf(pp,l.from)):'by '+esc(pp.looseUnit||'pc')+' '+peso(loosePriceOf(pp,l.from))}</button>`})()}${l.from!==S.branch?' · from '+esc(brName(l.from)):''}${l.order?` · <b style="color:var(--acc)">ORDER</b>${isOwner()&&l.sup?' <span class="mute">'+esc(l.sup)+'</span>':''}`:''}</small></div><div class="qty"><button onclick="qtyStep(${i},-1)">−</button><input inputmode="decimal" value="${fmtQty(l.qty)}" onchange="qtySet(${i},this.value)" onfocus="this.select()"><button onclick="qtyStep(${i},1)">+</button></div><div class="lt" onclick="editLine(${i})" title="Tap for price / discount">${peso(lineGross(l)-lineDisc(l))}${lineDisc(l)?`<small>−${discLbl(l)} off</small>`:''}</div><button class="lrm" title="Remove item" aria-label="Remove ${esc(l.name)}" onclick="removeLine(${i})">${ic('x',16)}</button></div>`).join(''):`<div class="empty">${ic('scan',40)}<p>Tap items or scan a barcode</p></div>`}</div>
 <div class="cart-f"><div class="row"><span>Subtotal</span><span>${peso(t.sub)}</span></div>${t.ldisc?`<div class="row"><span>Item discounts</span><span>−${peso(t.ldisc)}</span></div>`:''}<div class="row"><button class="link" onclick="setDiscount()">${S.disc?'Sale discount'+(S.discPct?' ('+S.disc+'%)':''):'Sale discount +'}</button><span>${t.odisc?'−'+peso(t.odisc):''}</span></div>${overCap(t)?`<div class="capwarn">Discount ${t.pct.toFixed(1)}% is over the ${discCap()}% cashier limit — owner PIN needed at payment.</div>`:''}
 <div class="row total"><span>Total</span><span>${peso(t.total)}</span></div><div class="pays">${PAYS.map(p=>`<button class="btn pay" ${c.length?'':'disabled'} onclick="checkout('${p}')">${p==='Cash'?'Cash · '+peso(t.total):p}</button>`).join('')}</div></div>`;
 const f=$('#cartfab');if(f){f.innerHTML=`${ic('sell')}<span>${c.reduce((a,l)=>a+l.qty,0)} items</span><b>${peso(t.total)}</b>`;f.classList.toggle('show',c.length>0)}}
function toggleCart(o){$('#cart')?.classList.toggle('open',o)}
function addToCart(pid){const p=S.products.get(pid);if(!p)return;if(!hasPrice(p)&&hasLoose(p))return addLoose(pid);if(!hasPrice(p)){if(isOwner())return quickPrice(pid,true);return toast('No selling price yet — ask the owner','bad')}let from=S.branch;
 if(p.reserveOnly&&!curBranch().isMain){from=mainBranch().id;toast('Reserve-only item — stock will be deducted from '+mainBranch().name,'warn')}
 const ex=S.cart.find(l=>l.pid===pid&&l.from===from&&!l.bulk&&!l.loose&&!l.order);const used=S.cart.filter(l=>l.pid===pid&&l.from===from&&!l.loose&&!l.order).reduce((a,l)=>a+l.qty*(l.mult||1),0);const want=used+1;const st=stockOf(pid,from);
 if(want>st&&!S.settings.allowNeg){toast(`Only ${fmtQty(st)} in stock`,'bad');return}
 if(ex)ex.qty=r2(ex.qty+1);else S.cart.push({pid,name:p.name,unit:p.unit||'pc',qty:1,price:priceOf(p),cost:+p.cost||0,from,mult:1});
 if(want>st)toast(`Low stock: ${fmtQty(st)} ${p.unit||''} on record`,'warn');beep(1000,.04);renderCart()}
async function scanToCart(){const code=await scanCode();if(!code)return;const p=findByCode(code);if(p)addToCart(p.id);else{toast('Not found: '+code,'bad');if(isOwner()&&await confirmBox('Code '+code+' not found. Add as new product?','Add product'))editProduct(null,{barcode:code})}}
function setBulk(i,on){const l=S.cart[i],p=S.products.get(l.pid);if(!p)return;if(on){if(!hasBulk(p))return toast('Set the pack size (units per '+(p.buyUnit||'bulk unit')+') in the product first','warn');l.bulk=true;l.loose=false;l.mult=PACK(p);l.price=bulkPriceOf(p,l.from);l.unit=p.buyUnit||'bulk';l.cost=r4((+p.cost||0)*l.mult)}else{l.bulk=false;l.mult=1;l.price=priceOf(p,l.from);l.unit=p.unit||'pc';l.cost=+p.cost||0}delete l.dv;delete l.dt;renderCart()}
function askContents(p){return new Promise(res=>{const lu=p.looseUnit||'pc',bu=p.unit||'unit';const m=modal(`<h3>How many ${esc(lu)} in one ${esc(bu)}?</h3><p class="small mute">${esc(p.name)} — asked only once, then remembered. ${+p.looseEst>0?'AI estimate: <b>'+fmtQty(p.looseEst)+' '+esc(lu)+'</b>. ':''}Best: measure or count the first one you open. You can correct it later in the product.</p><label>${esc(lu)} per ${esc(bu)}<input id="ac_q" inputmode="decimal" value="${+p.looseEst||''}"></label><div class="row end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ac_ok">Save</button></div>`);m.onclose=()=>res(0);const i=m.querySelector('#ac_q');setTimeout(()=>{i.focus();i.select()},60);
 m.querySelector('#ac_ok').onclick=async()=>{const q=num(i.value);if(!(q>0))return toast('Enter a number','warn');m.onclose=null;closeModal(m);await save('product',{...S.products.get(p.id),looseQty:q});res(q)}})}
async function setLoose(i,on){const l=S.cart[i],p=S.products.get(l.pid);if(!p)return;
 if(on){if(!hasLoose(p))return toast('Set a loose price in the product first','warn');if(!(looseQ(p)>0)&&!await askContents(p))return;const pp=S.products.get(l.pid);l.loose=true;l.bulk=false;l.mult=1;l.price=loosePriceOf(pp,l.from);l.unit=pp.looseUnit||'pc';l.cost=looseCostOf(pp)}
 else{if(!hasPrice(p))return toast('No price per '+(p.unit||'unit')+' yet','warn');l.loose=false;l.mult=1;l.price=priceOf(p,l.from);l.unit=p.unit||'pc';l.cost=+p.cost||0}delete l.dv;delete l.dt;renderCart()}
async function addLoose(pid){const p=S.products.get(pid);if(!p)return;let from=S.branch;if(p.reserveOnly&&!curBranch().isMain)from=mainBranch().id;if(!(looseQ(p)>0)&&!await askContents(p))return;const pp=S.products.get(pid);
 const ex=S.cart.find(l=>l.pid===pid&&l.from===from&&l.loose);if(ex)ex.qty=r2(ex.qty+1);else S.cart.push({pid,name:pp.name,unit:pp.looseUnit||'pc',qty:1,price:loosePriceOf(pp,from),cost:looseCostOf(pp),from,mult:1,loose:true});beep(1000,.04);renderCart()}
function qtyStep(i,d){const l=S.cart[i];l.qty=r2(l.qty+d);if(l.qty<=0)S.cart.splice(i,1);renderCart()}
function qtySet(i,v){const n=num(v);if(n<=0)S.cart.splice(i,1);else S.cart[i].qty=r2(n);renderCart()}
function clearCart(){S.cart=[];S.disc=0;S.discPct=false;renderCart()}
function removeLine(i){const l=S.cart[i];if(!l)return;S.cart.splice(i,1);renderCart();toast(`Removed ${l.name}${l.loose?' (per '+l.unit+')':''}`,'ok')}
async function cancelSale(){if(!S.cart.length)return;const n=S.cart.length,t=totals().total;if(!await confirmBox(`Clear this sale? ${n} item${n>1?'s':''}, ${peso(t)} — nothing is charged and stock is not changed.`,'Yes, clear sale',true,'Keep selling'))return;clearCart();toast('Sale cancelled','ok')}
function editLine(i){const l=S.cart[i];const m=modal(`<h3>${esc(l.name)}</h3><div class="g2"><label>Quantity<input id="el_q" inputmode="decimal" value="${fmtQty(l.qty)}"></label><label>Unit price<input id="el_p" inputmode="decimal" value="${l.price}" ${isOwner()?'':'disabled'}></label></div>${isOwner()?'':'<p class="mute small">Only the owner can change prices.</p>'}
 <div class="g2"><label>Discount on this item<input id="el_d" inputmode="decimal" value="${l.dv||''}" placeholder="0"></label><label>Type<select id="el_dt"><option value="pct">% off</option><option value="unit" ${l.dt==='unit'?'selected':''}>₱ off each piece</option><option value="amt" ${l.dt==='amt'?'selected':''}>₱ off whole line</option></select></label></div><p class="small b" id="el_pv" style="color:var(--ok);margin:-4px 0 8px"></p>
 <div class="quick">${[5,10,15,20].map(v=>`<button class="btn sm" data-p="${v}">${v}%</button>`).join('')}<button class="btn sm" data-p="0">No discount</button></div>${isOwner()?'':`<p class="mute small">Cashier limit ${discCap()}% of the sale without owner PIN.</p>`}<div class="row end"><button class="btn danger" id="el_rm">Remove</button><span class="grow"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="el_ok">Update</button></div>`);
 const pv=()=>{const t={qty:num(m.querySelector('#el_q').value),price:isOwner()?num(m.querySelector('#el_p').value):l.price,dv:num(m.querySelector('#el_d').value),dt:m.querySelector('#el_dt').value};const d=lineDisc(t);m.querySelector('#el_pv').textContent=d?`Discount ${peso(d)} → line total ${peso(lineGross(t)-d)}`:''};
 ['#el_q','#el_p','#el_d'].forEach(s=>m.querySelector(s).addEventListener('input',pv));m.querySelector('#el_dt').onchange=pv;pv();
 m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{m.querySelector('#el_d').value=b.dataset.p==='0'?'':b.dataset.p;m.querySelector('#el_dt').value='pct';pv()});
 m.querySelector('#el_rm').onclick=()=>{S.cart.splice(i,1);closeModal(m);renderCart()};m.querySelector('#el_ok').onclick=()=>{const q=num(m.querySelector('#el_q').value);if(q<=0)S.cart.splice(i,1);else{l.qty=r2(q);if(isOwner())l.price=r2(num(m.querySelector('#el_p').value));l.dt=m.querySelector('#el_dt').value;l.dv=Math.max(0,num(m.querySelector('#el_d').value));if(l.dt==='pct')l.dv=Math.min(100,l.dv);if(!l.dv){delete l.dv;delete l.dt}}closeModal(m);renderCart()}}
function setDiscount(){const m=modal(`<h3>Sale discount</h3><p class="small mute">Applies to the whole sale, after item discounts.</p><div class="g2"><label>Amount<input id="d_v" inputmode="decimal" value="${S.disc||''}"></label><label>Type<select id="d_t"><option value="amt">₱ amount</option><option value="pct" ${S.discPct?'selected':''}>% percent</option></select></label></div><div class="row end"><button class="btn" id="d_clr">Remove</button><button class="btn primary" id="d_ok">Apply</button></div>`);
 m.querySelector('#d_clr').onclick=()=>{S.disc=0;closeModal(m);renderCart()};m.querySelector('#d_ok').onclick=()=>{S.disc=Math.max(0,num(m.querySelector('#d_v').value));S.discPct=m.querySelector('#d_t').value==='pct';if(S.discPct)S.disc=Math.min(100,S.disc);closeModal(m);renderCart()}}
const customers=()=>[...new Set([...S.sales.values()].map(s=>s.cust).filter(Boolean))].sort();
function quickCash(t){const o=[t];[100,500,1000].forEach(s=>{const v=Math.ceil(t/s)*s;if(v>t&&!o.includes(v))o.push(v)});return o.slice(0,4)}
function dangerGate({title,lines=[],word='',btn='Continue'}){return new Promise(res=>{const m=modal(`<h3 style="color:var(--bad)">${esc(title)}</h3><div class="card small" style="border-color:var(--bad)">${lines.map(l=>`<div>• ${l}</div>`).join('')}</div>${word?`<label>Type <b>${esc(word)}</b> to confirm<input id="dg_w" autocomplete="off" autocapitalize="characters"></label>`:''}<div class="row end"><button class="btn" data-close>Cancel</button><button class="btn danger" id="dg_ok" ${word?'disabled':''}>${esc(btn)}</button></div>`);m.onclose=()=>res(false);
 const w=m.querySelector('#dg_w');if(w)w.oninput=()=>{m.querySelector('#dg_ok').disabled=w.value.trim().toUpperCase()!==word};
 m.querySelector('#dg_ok').onclick=async()=>{m.onclose=null;closeModal(m);const who=await ownerApprove(title+' — enter the owner PIN (a cashier PIN will not work).');res(!!who)}})}
function ownerApprove(reason){return new Promise(res=>{const m=modal(`<h3>Owner approval</h3><p class="small">${esc(reason)}</p><label>Owner PIN<input id="oa_p" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><div class="row end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="oa_ok">Approve</button></div>`);m.onclose=()=>res(null);
 const chk=async()=>{const pin=m.querySelector('#oa_p').value;for(const u of S.users.values()){if(u.role==='owner'&&u.active!==false&&(u.pin===await hashPin(pin,u.id)||u.pin==='p:'+pin)){m.onclose=null;closeModal(m);return res(u.name)}}toast('Wrong owner PIN','bad');m.querySelector('#oa_p').value=''};
 m.querySelector('#oa_ok').onclick=chk;m.querySelector('#oa_p').onkeydown=e=>{if(e.key==='Enter')chk()};setTimeout(()=>m.querySelector('#oa_p')?.focus(),60)})}
async function checkout(pay){if(!S.cart.length||$('.mwrap'))return;const t=totals();let appr='';
 if(overCap(t)){appr=await ownerApprove(`Discount ${peso(t.disc)} (${t.pct.toFixed(1)}% of ${peso(t.sub)}) is over the cashier limit of ${discCap()}%.`);if(!appr)return}
 const m=modal(`<h3>${pay} payment</h3><div class="big-total">${peso(t.total)}</div>
 ${pay==='Cash'?`<label>Cash received<input id="co_t" inputmode="decimal" placeholder="${money(t.total)}"></label><div class="quick">${quickCash(t.total).map(v=>`<button class="btn sm" data-v="${v}">${v===t.total?'Exact':'₱'+money(v)}</button>`).join('')}</div><div class="change" id="co_c">Change ₱0.00</div>`:''}
 ${pay==='GCash'||pay==='Card'?`<label>Reference no.<input id="co_r" inputmode="numeric"></label>`:''}
 <label style="margin-top:10px">Customer ${pay==='Charge'?'(required — charged to account)':'(optional)'}<input id="co_cu" list="co_cl" autocomplete="off"></label><datalist id="co_cl">${customers().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <div class="row end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="co_ok">Complete sale</button></div>`);
 const ti=m.querySelector('#co_t');const calc=()=>{const v=ti.value===''?t.total:num(ti.value);const c=r2(v-t.total);const e=m.querySelector('#co_c');e.textContent=c<0?'Short ₱'+money(-c):'Change ₱'+money(c);e.style.background=c<0?'var(--bad-soft)':'';e.style.color=c<0?'var(--bad)':''};
 if(ti){ti.oninput=calc;m.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{ti.value=b.dataset.v;calc()});if(!isTouch())ti.focus();ti.onkeydown=e=>{if(e.key==='Enter')m.querySelector('#co_ok').click()}}
 m.querySelector('#co_ok').onclick=async()=>{const cust=m.querySelector('#co_cu').value.trim();const tend=ti?(ti.value===''?t.total:num(ti.value)):t.total;if(pay==='Cash'&&tend<t.total)return toast('Cash received is less than total','bad');if(pay==='Charge'&&!cust)return toast('Customer name required for Charge','bad');
  const b=m.querySelector('#co_ok');b.disabled=true;const sale=await completeSale(pay,tend,m.querySelector('#co_r')?.value.trim()||'',cust,appr);closeModal(m);showReceipt(sale,true)}}
function nextSaleNo(){const d=new Date();const pre=`${curBranch().code||'BR'}${CFG.dev}-${String(d.getFullYear()).slice(2)}${pad2(d.getMonth()+1)}${pad2(d.getDate())}-`;let n=0;for(const s of S.sales.values())if(s.no&&s.no.startsWith(pre))n=Math.max(n,parseInt(s.no.slice(pre.length))||0);return pre+String(n+1).padStart(4,'0')}
async function completeSale(pay,tend,ref,cust,appr){const t=totals();const id=uid(),ts=Date.now();
 const sale={id,no:nextSaleNo(),ts,branch:S.branch,cashier:S.user.name,cashierId:S.user.id,lines:S.cart.map(l=>({...l,disc:lineDisc(l)})),sub:t.sub,ldisc:t.ldisc,odisc:t.odisc,disc:t.disc,discBy:t.disc?(appr||S.user.name):'',total:t.total,pay,tend:r2(tend),change:pay==='Cash'?r2(tend-t.total):0,ref,cust,void:false,paid:pay!=='Charge'};
 const mv=[],tally={};S.cart.forEach((l,i)=>{const br=l.from||S.branch;if(l.order)return;
  if(!l.loose){mv.push({kind:'move',data:{id:id+'_'+i,ts,branch:br,pid:l.pid,qty:-r4(l.qty*(l.mult||1)),type:'sale',ref:id,user:S.user.name}});return}
  const p=S.products.get(l.pid)||{},q=looseQ(p),k=br+'|'+l.pid;const t=tally[k]||(tally[k]={open:stockOf(LKEY(l.pid),br)});const need=r4(l.qty-t.open);
  if(need>1e-9&&q>0){const n=Math.ceil(need/q-1e-9);mv.push({kind:'move',data:{id:id+'_o'+i,ts,branch:br,pid:l.pid,qty:-n,type:'open',ref:id,user:S.user.name,note:`Opened ${n} ${p.unit||''} → ${fmtQty(n*q)} ${p.looseUnit||''} loose`}},{kind:'move',data:{id:id+'_O'+i,ts,branch:br,pid:LKEY(l.pid),qty:r4(n*q),type:'open',ref:id,user:S.user.name,note:`From ${n} ${p.unit||''}`}});t.open=r4(t.open+n*q)}
  t.open=r4(t.open-l.qty);mv.push({kind:'move',data:{id:id+'_'+i,ts,branch:br,pid:LKEY(l.pid),qty:-r4(l.qty),type:'sale',ref:id,user:S.user.name}})});
 await saveMany([{kind:'sale',data:sale},...mv]);S.cart=[];S.disc=0;S.discPct=false;toggleCart(false);renderCart();renderGrid();return sale}
function receiptHTML(s){const st=S.settings;return `<div class="rcpt"><div class="c"><b>${esc(st.storeName)}</b><br>${esc(brName(s.branch))}${st.address?'<br>'+esc(st.address):''}${st.tin?'<br>TIN '+esc(st.tin):''}</div><div class="hr"></div>
 <div>No: ${esc(s.no)}<br>${fmtDT(s.ts)}<br>Cashier: ${esc(s.cashier)}${s.cust?'<br>Customer: '+esc(s.cust):''}</div><div class="hr"></div>
 ${s.lines.map(l=>`<div>${esc(l.name)}${l.order?' <b>(ORDER)</b>':''}</div><div class="rr"><span>&nbsp; ${fmtQty(l.qty)} ${esc(l.unit)} × ${money(l.price)}</span><span>${money(l.qty*l.price)}</span></div>${l.disc?`<div class="rr"><span>&nbsp; Less ${l.dv?discLbl(l):''}</span><span>-${money(l.disc)}</span></div>`:''}`).join('')}
 <div class="hr"></div><div class="rr"><span>Subtotal</span><span>${money(s.sub)}</span></div>${s.ldisc?`<div class="rr"><span>Item discounts</span><span>-${money(s.ldisc)}</span></div>`:''}${(s.odisc??(s.ldisc?0:s.disc))?`<div class="rr"><span>Sale discount</span><span>-${money(s.odisc??s.disc)}</span></div>`:''}<div class="rr b"><span>TOTAL</span><span>₱${money(s.total)}</span></div>
 <div class="rr"><span>${esc(s.pay)}${s.ref?' #'+esc(s.ref):''}</span><span>${money(s.pay==='Cash'?s.tend:s.total)}</span></div>${s.pay==='Cash'?`<div class="rr"><span>Change</span><span>${money(s.change)}</span></div>`:''}
 ${s.disc?`<div class="c">You saved ₱${money(s.disc)}</div>`:''}${s.void?'<div class="hr"></div><div class="c b">*** VOIDED ***</div>':''}<div class="hr"></div><div class="c">${esc(st.footer)}<br><small>This is not an official receipt.</small></div></div>`}
function printHTML(html,cls){const a=$('#print-area');a.className=cls||'';a.innerHTML=html;setTimeout(()=>window.print(),350)}
function showReceipt(s,fresh){const m=modal(`<h3>${fresh?'Sale complete ✓':'Receipt'}</h3>${fresh&&s.pay==='Cash'?`<div class="change" style="margin-bottom:12px">Change ₱${money(s.change)}</div>`:''}<div class="rcptwrap">${receiptHTML(s)}</div><div class="row end"><button class="btn" id="rc_sh">Share</button><button class="btn" id="rc_pr">${ic('print',18)} Print</button><button class="btn primary" data-close>${fresh?'New sale':'Close'}</button></div>`);
 m.querySelector('#rc_pr').onclick=()=>printHTML(receiptHTML(s),S.settings.paper);
 m.querySelector('#rc_sh').onclick=async()=>{const txt=`${S.settings.storeName}\n${s.no} ${fmtDT(s.ts)}\n`+s.lines.map(l=>`${l.name}  ${fmtQty(l.qty)} x ${money(l.price)} = ${money(l.qty*l.price)}`).join('\n')+`\nTOTAL ₱${money(s.total)} (${s.pay})`;try{if(navigator.share)await navigator.share({title:'Receipt '+s.no,text:txt});else{await navigator.clipboard.writeText(txt);toast('Receipt copied','ok')}}catch(e){}};
 m.onclose=()=>{if(S.view==='sell'&&!isTouch())$('#q')?.focus()}}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Image could not be read'));i.src=src})}
async function toImg(f){if(typeof f==='string')return loadImg(f);const u=URL.createObjectURL(f);try{return await loadImg(u)}finally{setTimeout(()=>URL.revokeObjectURL(u),2000)}}
function squareFit(c,box,out=500){const[x0,y0,x1,y1]=box,w=x1-x0+1,h=y1-y0+1,side=Math.max(w,h)*1.12,o=document.createElement('canvas');o.width=o.height=out;const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,out,out);const k=out/side;x.imageSmoothingQuality='high';x.drawImage(c,x0,y0,w,h,(out-w*k)/2,(out-h*k)/2,w*k,h*k);return o}
function quickClean(c){const x=c.getContext('2d'),W=c.width,H=c.height,d=x.getImageData(0,0,W,H),p=d.data,N=W*H;
 const bs=[];const sm=(i,j)=>{const k=(j*W+i)*4;bs.push([p[k],p[k+1],p[k+2]])};for(let i=0;i<W;i+=2){sm(i,0);sm(i,H-1)}for(let j=0;j<H;j+=2){sm(0,j);sm(W-1,j)}
 const med=n=>{const a=bs.map(b=>b[n]).sort((a,b)=>a-b);return a[a.length>>1]},bg=[med(0),med(1),med(2)],TOL=40;
 const near=(r,g,b)=>Math.abs(r-bg[0])<TOL&&Math.abs(g-bg[1])<TOL&&Math.abs(b-bg[2])<TOL;
 if(bs.filter(b=>near(b[0],b[1],b[2])).length/bs.length<.8)return null;
 const seen=new Uint8Array(N);let st=new Int32Array(N+8),sp=0;const add=i=>{if(!seen[i]){const k=i*4;if(near(p[k],p[k+1],p[k+2])){seen[i]=1;if(sp>=st.length){const n2=new Int32Array(st.length*2);n2.set(st);st=n2}st[sp++]=i}}};
 for(let i=0;i<W;i++){add(i);add((H-1)*W+i)}for(let j=0;j<H;j++){add(j*W);add(j*W+W-1)}
 while(sp){const i=st[--sp],cx=i%W;if(cx>0)add(i-1);if(cx<W-1)add(i+1);if(i>=W)add(i-W);if(i<N-W)add(i+W)}
 let x0=W,y0=H,x1=-1,y1=-1;for(let i=0;i<N;i++){if(seen[i]){const k=i*4;p[k]=p[k+1]=p[k+2]=255}else{const cx=i%W,cy=(i/W)|0;if(cx<x0)x0=cx;if(cx>x1)x1=cx;if(cy<y0)y0=cy;if(cy>y1)y1=cy}}
 if(x1<0||(x1-x0+1)*(y1-y0+1)<N*.01)return null;x.putImageData(d,0,0);return[x0,y0,x1,y1]}
async function processPhoto(f,clean){const im=await toImg(f);let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,700/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
 if(clean){const box=quickClean(c);if(box)return{url:squareFit(c,box).toDataURL('image/jpeg',.84),cleaned:true}}
 return{url:squareFit(c,[0,0,w-1,h-1]).toDataURL('image/jpeg',.82),cleaned:false}}
let bgLib=null;
async function aiRemoveBg(src,onProg){if(!navigator.onLine)throw new Error('AI needs internet');
 if(!bgLib)bgLib=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');
 const blob=typeof src==='string'?await (await fetch(src)).blob():src;const prog={};
 const out=await bgLib.removeBackground(blob,{model:'isnet_quint8',output:{format:'image/png'},progress:(key,cur,tot)=>{if(tot){prog[key]=[cur,tot];const a=Object.values(prog).reduce((s,v)=>[s[0]+v[0],s[1]+v[1]],[0,0]);onProg&&onProg(Math.round(a[0]/a[1]*100))}}});
 const im=await toImg(out),W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0);
 const d=x.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=-1,y1=-1;for(let j=0;j<H;j++)for(let i=0;i<W;i++)if(d[(j*W+i)*4+3]>24){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
 if(x1<0)throw new Error('No product found in photo');return squareFit(c,[x0,y0,x1,y1]).toDataURL('image/jpeg',.86)}

const isImgUrl=t=>/^(https?:\/\/\S+|data:image\/)/i.test(t||'');
async function blobFromUrl(u){u=String(u||'').trim();try{if(/^data:image\//i.test(u))return await (await fetch(u)).blob()}catch(e){}
 if(!/^https?:\/\//i.test(u))return null;for(const t of [u,'https://wsrv.nl/?url='+encodeURIComponent(u)+'&w=700&output=jpg']){try{const r=await fetch(t,{mode:'cors'});if(r.ok){const b=await r.blob();if(b.type.startsWith('image/'))return b}}catch(e){}}
 toast('Could not load that link — use "Copy image" instead','warn');return null}
document.addEventListener('paste',e=>{if(!pasteTarget)return;const items=[...(e.clipboardData?.items||[])];const it=items.find(x=>x.type.startsWith('image/'));
 if(it){e.preventDefault();const f=it.getAsFile();lastClipSig='b'+f.size;pasteTarget(f);return}
 const tx=(e.clipboardData?.getData('text')||'').trim();if(isImgUrl(tx)&&!e.target.closest?.('input,textarea')){e.preventDefault();lastClipSig='u'+tx.slice(0,300);blobFromUrl(tx).then(b=>b&&pasteTarget(b))}});

async function readClip(silent){try{if(!navigator.clipboard?.read)throw 0;const items=await navigator.clipboard.read();
  for(const it of items){const t=it.types.find(x=>x.startsWith('image/'));if(t){const bl=await it.getType(t);return{blob:bl,sig:'b'+bl.size}}}
  for(const it of items){if(it.types.includes('text/plain')){const tx=(await (await it.getType('text/plain')).text()).trim();if(isImgUrl(tx))return{url:tx,sig:'u'+tx.slice(0,300)}}}
  if(!silent)toast('No image copied — long-press / right-click an image → Copy image','warn')}
 catch(e){if(!silent)toast(isTouch()?'Copy an image first (long-press → Copy), then tap Paste':'Copy an image, then press Cmd/Ctrl+V here','warn')}return null}
async function clipImage(){const c=await readClip(false);if(!c)return null;lastClipSig=c.sig;return c.blob||await blobFromUrl(c.url)}
async function clipGranted(){try{return (await navigator.permissions.query({name:'clipboard-read'})).state==='granted'}catch(e){return false}}
function dropZone(el,cb){el.addEventListener('dragover',e=>{e.preventDefault()});el.addEventListener('drop',e=>{e.preventDefault();const f=[...(e.dataTransfer?.files||[])].find(x=>x.type.startsWith('image/'));if(f)return cb(f);const u=e.dataTransfer?.getData('text/uri-list')||e.dataTransfer?.getData('text/plain');if(isImgUrl(u))blobFromUrl(u).then(b=>b&&cb(b));else toast('Drop an image (or copy + paste it)','warn')})}

const PACK=p=>Math.max(1,+(p&&p.pack)||1);

 for(const l of slAll()){const linked=!!(p.id&&l.pid===p.id);let sc=200;if(!linked){if(l.pid&&l.pid!==p.id&&S.products.has(l.pid)&&S.products.get(l.pid).active!==false&&!dupScore(dupSig(S.products.get(l.pid)),dupSig(p)))continue;sc=relScore(pt,relTok(l));if(sc<REL_MIN)continue}
  const lu=unitKey(l.unit);let cost=null;if(lu===pu)cost=+l.cost;else if(bu&&lu===bu&&pk>1)cost=+l.cost/pk;else{const ci=contentsIn(p,l.unit);if(ci>0)cost=+l.cost*ci}if(cost>0)c.push({cost:r4(cost),supplier:l.supplier,ts:l.ts,unit:l.unit,listCost:+l.cost,linked,score:sc,lname:l.name+(l.color&&!COLOR_RX.test(l.name)?' '+l.color:''),slid:l.slid,k:l.k})}

 for(const p of activeProducts()){const b=norm(p.name);if(b.filter(w=>/\d/.test(w)).sort().join(' ')!==nums)continue;const set=new Set(b);let hit=0;a.forEach(w=>{if(set.has(w))hit++});const sc=hit/Math.max(a.length,b.length);if(sc>bs){bs=sc;best=p}}return bs>=.75?best:null}

async function plParts(files,msg){const parts=[];for(const f of files){const n=(f.name||'').toLowerCase(),ty=f.type||'';

 const ex=[];const drawEx=()=>{$('#cl_ex').innerHTML=ex.map((e,i)=>`<div class="exrow"><input data-i="${i}" data-k="d" value="${esc(e.d)}" placeholder="e.g. Ice, delivery fee"><input data-i="${i}" data-k="a" inputmode="decimal" value="${e.a||''}" placeholder="₱"><button class="btn icon sm" data-x="${i}">${ic('x',14)}</button></div>`).join('')||'<p class="mute small">None</p>';calc()};

 const keys=[];if(single){for(let h=6;h<=21;h++)keys.push(h)}else{for(let t=from;t<to;t+=864e5)keys.push(ymd(t))}const mx=Math.max(1,...keys.map(k=>buck[k]||0));
 const top=Object.values(items).sort((a,b)=>b.amt-a.amt).slice(0,10);const charge=ok.filter(s=>s.pay==='Charge');

 <div class="g3"><label>Max cashier discount %<input id="st_md" inputmode="decimal" value="${st.maxDisc??10}"></label></div><p class="small mute" style="margin-top:-6px">Cashier discounts above this % of a sale need the owner's PIN. Owners have no limit.</p>
 <label class="chk"><input type="checkbox" id="st_ng" ${st.allowNeg?'checked':''}> Allow selling when recorded stock is zero (warn only)</label><div class="row end"><button class="btn primary" data-save onclick="saveStore()">Save</button></div></div>
 <div class="card"><h4>Categories &amp; SKU codes</h4><p class="small mute">One per line: <b>CODE = Category name</b>. Codes are the first part of auto-SKUs. SKU format: CATEGORY-TYPE-SIZE-VARIANT (e.g. PT-LTX-4L-WHT-BOY).</p><textarea id="st_cats">${catList().map(c=>c[0]+' = '+c[1]).join('\n')}</textarea><div class="row end"><button class="btn" onclick="this.closest('.card').querySelector('[data-save]').disabled=false;$('#st_cats').value=DEF_CATS.map(c=>c[0]+' = '+c[1]).join('\n')">Reset defaults</button><button class="btn primary" data-save onclick="saveCats()">Save categories</button></div></div>
 <div class="card"><h4>Branches</h4>${branches().map(b=>`<div class="row" style="margin-bottom:8px"><input value="${esc(b.name)}" onchange="saveBranch('${b.id}','name',this.value)"><input value="${esc(b.code)}" style="width:80px" maxlength="3" onchange="saveBranch('${b.id}','code',this.value)">${b.isMain?'<span class="pill acc">Main</span>':''}</div>`).join('')}<div class="row end"><button class="btn" onclick="addBranch()">${ic('plus',16)} Add branch</button></div>
 <p class="small mute">This device is set to <b>${esc(curBranch().name)}</b> (change with the branch selector). Cashiers can only sell from the device's branch.</p></div>
 <div class="card"><h4>Users & PINs</h4>${users.map(u=>`<div class="li" style="padding:8px 0" onclick="editUser('${u.id}')"><span class="av">${esc(initials(u.name))}</span><div class="grow"><b>${esc(u.name)}</b><small class="mute">${u.role}${u.active===false?' · disabled':''}</small></div><button class="btn sm">Edit</button></div>`).join('')}<div class="row end"><button class="btn" onclick="editUser()">${ic('plus',16)} Add cashier</button></div></div>
 <div class="card"><h4>${ic('sync',16)} Cloud sync (all devices &amp; branches)</h4><p class="small mute">Works fully offline on each device. To share data across phones, tablets and branches, connect a free Supabase project: run <b>setup.sql</b> in its SQL Editor, then paste the Project URL and publishable/anon key.</p><label>Project URL<input id="sy_u" value="${esc(CFG.sbUrl||'')}" placeholder="https://xxxx.supabase.co"></label><label>Publishable / anon key<input id="sy_k" value="${esc(CFG.sbKey||'')}" placeholder="sb_publishable_… or eyJ…"></label>
 <div class="row end"><span class="small mute grow" id="sy_s">${CFG.lastSyncAt?'Last sync '+fmtDT(CFG.lastSyncAt):'Not connected'}</span><button class="btn" onclick="saveSync(false)">Disconnect</button><button class="btn primary" onclick="saveSync(true)">Save &amp; sync now</button></div></div>
 <div class="card"><h4>${ic('spark',16)} Receipt reader (AI)</h4><p class="small mute">${CFG.sbUrl?'<b style="color:var(--ok)">✓ Runs on your cloud server</b> — receipts, supplier price lists and tingi prices are read there. No key is needed on this device, and no AI key is ever stored in the synced data.':'Connect Cloud sync above to use the server reader (no key needed on devices).'}</p>
 <details${CFG.aiKey?' open':''}><summary class="small">Backup: Google Gemini key on <b>this device only</b> (used only if the server reader is not set up)</summary><div class="g2"><label>Gemini API key<input id="ai_k" type="password" value="${esc(aiKey())}" autocomplete="off"></label><label>Model<input id="ai_m" value="${esc(aiModel())}"></label></div><p class="small mute">Stays on this device; never synced. Use a key with a spending limit.</p><div class="row end">${CFG.aiKey?'<button class="btn danger" onclick="saveAiKey(true)">Remove key from this device</button>':''}<button class="btn primary" data-save onclick="saveAiKey()">Save</button></div></details></div>
 <div class="card"><h4>Backup</h4><p class="small mute">Download a full backup (including photos) or restore one on a new device.</p><div class="row end"><label class="btn" style="margin:0;color:var(--ink);font-size:15px">Restore…<input type="file" accept=".json" hidden onchange="restoreBackup(this.files[0])"></label><button class="btn primary" onclick="backup()">Download backup</button></div></div>
 <div class="card"><h4>Danger zone</h4><p class="small mute">Erase all data stored on this device. Cloud data (if connected) is not deleted.</p><div class="row end"><button class="btn danger" onclick="resetDevice()">Erase this device</button></div></div>
 <p class="small mute c">Tindero POS · version ${APP_VER} · device ${esc(CFG.dev)}</p></div>`;armSaves($('#view'))};
function armSaves(root){root.querySelectorAll('[data-save]').forEach(b=>{const card=b.closest('.card')||root;b.disabled=true;b.title='No changes to save';const on=()=>{b.disabled=false;b.title=''};card.addEventListener('input',on);card.addEventListener('change',on)})}
async function saveAiKey(remove){if(remove){delete CFG.aiKey;delete CFG.aiModel;saveCfg();toast('Key removed from this device','ok');return go('settings')}
 const k=$('#ai_k').value.trim(),m=$('#ai_m').value.trim()||AI_DEFAULT;if(k)CFG.aiKey=k;else delete CFG.aiKey;CFG.aiModel=m;saveCfg();toast(k?'Saved on this device only (not synced)':'Saved','ok');go('settings')}
async function saveStore(){const st={...S.settings,storeName:$('#st_n').value.trim()||'My Store',tin:$('#st_t').value.trim(),address:$('#st_a').value.trim(),footer:$('#st_f').value.trim(),markup:num($('#st_mk').value),margin:num($('#st_mg').value),paper:$('#st_p').value,allowNeg:$('#st_ng').checked,maxDisc:Math.max(0,Math.min(100,num($('#st_md').value)))};await save('settings',st);toast('Saved','ok');renderShell();go('settings')}
async function saveCats(){const cats=$('#st_cats').value.split('\n').map(x=>x.split('=')).filter(x=>x.length>=2).map(([c,...n])=>[c.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3),n.join('=').trim()]).filter(c=>c[0]&&c[1]);if(!cats.length)return toast('Enter at least one line like CM = Cement & Masonry','bad');const codes=cats.map(c=>c[0]);const dup=codes.find((c,i)=>codes.indexOf(c)!==i);if(dup)return toast('Duplicate code '+dup,'bad');await save('settings',{...S.settings,cats});toast(cats.length+' categories saved','ok');go('settings')}
async function saveBranch(id,k,v){const b={...S.branches.get(id),[k]:k==='code'?v.trim().toUpperCase():v.trim()};await save('branch',b);toast('Branch saved','ok')}
async function addBranch(){const n=S.branches.size;await save('branch',{id:'br_'+uid(),name:'Branch '+(n+1),code:'B'+(n+1)});go('settings')}
function editUser(id){const u=id?{...S.users.get(id)}:{id:'u_'+uid(),name:'',role:'cashier',active:true};const m=modal(`<h3>${id?'Edit user':'Add cashier'}</h3><label>Name<input id="us_n" value="${esc(u.name)}"></label><div class="g2"><label>Role<select id="us_r"><option value="cashier">Cashier</option><option value="owner" ${u.role==='owner'?'selected':''}>Owner / manager</option></select></label><label>${id?'New PIN (blank = keep)':'4-digit PIN'}<input id="us_p" inputmode="numeric" maxlength="4"></label></div>${id?`<label class="chk"><input type="checkbox" id="us_a" ${u.active!==false?'checked':''}> Active</label>`:''}<p class="small mute">Cashiers can sell, receive stock and do stock counts. Only owners can edit products/prices, adjust or transfer stock, void sales, and see reports.</p><div class="row end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="us_ok">Save</button></div>`);
 m.querySelector('#us_ok').onclick=async()=>{u.name=m.querySelector('#us_n').value.trim();if(!u.name)return toast('Name required','bad');u.role=m.querySelector('#us_r').value;const p=m.querySelector('#us_p').value.trim();if(p){if(!/^\d{4}$/.test(p))return toast('PIN must be 4 digits','bad');u.pin=await hashPin(p,u.id)}else if(!id)return toast('PIN required','bad');if(id)u.active=m.querySelector('#us_a').checked;
  if(u.id===S.user.id&&u.role!=='owner')return toast("Can't remove your own owner role",'bad');if([...S.users.values()].filter(x=>x.role==='owner'&&x.active!==false&&x.id!==u.id).length===0&&(u.role!=='owner'||u.active===false))return toast('Keep at least one active owner','bad');
  await save('user',u);if(u.id===S.user.id)S.user=u;closeModal(m);toast('Saved','ok');go('settings')}}
async function saveSync(on){if(!on){delete CFG.sbUrl;delete CFG.sbKey;saveCfg();renderSyncBadge();go('settings');return}const u=$('#sy_u').value.trim().replace(/\/+$/,''),k=$('#sy_k').value.trim();if(!/^https:\/\//.test(u)||!k)return toast('Enter URL and key','bad');if(CFG.sbUrl!==u){CFG.lastPull=null}CFG.sbUrl=u;CFG.sbKey=k;saveCfg();const ok=await sync(true);if(ok)go('settings')}
async function backup(){const all=await DB.all();download(`tindero_backup_${ymd(Date.now())}.json`,JSON.stringify({app:'tindero-pos',v:1,at:Date.now(),records:all.map(r=>({id:r.id,kind:r.kind,data:r.data,ts:r.ts}))}),'application/json')}
async function restoreBackup(f){if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.records))throw new Error('Not a Tindero backup');const byK={};j.records.forEach(r=>{byK[r.kind]=(byK[r.kind]||0)+1});if(!await dangerGate({title:'Restore backup',btn:'Restore',lines:[`Backup from ${j.at?fmtDT(j.at):'unknown date'}: ${Object.entries(byK).map(([k,n])=>n+' '+k).join(', ')}.`,'Records with the same ID on this device are REPLACED by the backup version and uploaded to the cloud (the cloud keeps the old versions in its history).']}))return;await DB.putMany(j.records.map(r=>({...r,dirty:1})));toast('Restored — reloading','ok');setTimeout(()=>location.reload(),800)}catch(e){toast('Restore failed: '+e.message,'bad')}}
async function resetDevice(){const dirty=(await DB.dirty()).length;const cnt=k=>S[k]?S[k].size:0;
 if(!await dangerGate({title:'Erase this device',word:'DELETE',btn:'Erase this device',lines:[`Deletes from <b>this device</b>: ${cnt('products')} products, ${cnt('sales')} sales, ${cnt('purchases')} deliveries, ${cnt('moves')} stock movements, ${cnt('users')} users, settings and photos.`,dirty?`<b style="color:var(--bad)">${dirty} change${dirty>1?'s':''} on this device are NOT uploaded yet and will be lost.</b>`:(CFG.sbUrl?'Everything on this device is already uploaded; the cloud copy is NOT deleted.':'<b style="color:var(--bad)">Cloud sync is not set up — this is the only copy. Download a backup first.</b>'),'Cloud sync settings on this device are also removed.']}))return;await DB.clear();localStorage.removeItem('tpos_cfg');location.reload()}

/* ========= SYNC (Supabase REST) ========= */
let syncing=false,syncTimer=null,syncErr='';
function queueSync(){renderSyncBadge();if(!CFG.sbUrl)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),3000)}
function sbHeaders(extra={}){const h={apikey:CFG.sbKey,'Content-Type':'application/json',...extra};if(/^eyJ/.test(CFG.sbKey))h.Authorization='Bearer '+CFG.sbKey;return h}
async function renderSyncBadge(){const el=$('#syncb');if(!el)return;let n=0;try{n=(await DB.dirty()).length}catch(e){}const cls=!CFG.sbUrl?'':syncErr?'err':n?'pend':'ok';const txt=!CFG.sbUrl?'Local only':syncing?'Syncing…':syncErr?'Sync error':n?n+' to sync':'Synced';el.innerHTML=`<span class="dot ${cls}"></span><span>${txt}</span>`;el.title=syncErr||'';const mb=$('#syncm');if(mb)mb.style.color=cls==='err'?'#ef4444':cls==='pend'?'#f59e0b':cls==='ok'?'#22c55e':''}
async function sync(manual){if(!CFG.sbUrl||!CFG.sbKey){if(manual)toast('Cloud sync not set up — see Settings','warn');return false}if(syncing)return false;if(!navigator.onLine){if(manual)toast('Offline — will sync later','warn');return false}
 syncing=true;syncErr='';renderSyncBadge();const base=CFG.sbUrl+'/rest/v1/pos_records';let pulled=0,pushed=0;
 try{const dirty=await DB.dirty();for(let i=0;i<dirty.length;i+=150){const ch=dirty.slice(i,i+150);const r=await fetch(base+'?on_conflict=id',{method:'POST',headers:sbHeaders({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(ch.map(x=>({id:x.id,kind:x.kind,data:x.data,client_ts:x.ts||0,deleted:false})))});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));
   const fresh=[];for(const x of ch){const cur=await DB.get(x.id);if(cur&&cur.ts===x.ts&&cur.dirty)fresh.push({...cur,dirty:0})}await DB.putMany(fresh);pushed+=ch.length}
  let since=CFG.lastPull?new Date(Date.parse(CFG.lastPull)-120000).toISOString():'1970-01-01T00:00:00Z';let moved=false;
  for(let guard=0;guard<200;guard++){const r=await fetch(`${base}?select=id,kind,data,client_ts,updated_at&updated_at=gt.${encodeURIComponent(since)}&order=updated_at.asc&limit=500`,{headers:sbHeaders()});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));const rows=await r.json();if(!rows.length)break;
   const put=[];for(const x of rows){const cur=await DB.get(x.id);if(!cur||(!cur.dirty&&cur.ts!==+x.client_ts)||(cur.dirty&&+x.client_ts>cur.ts)){put.push({id:x.id,kind:x.kind,data:x.data,ts:+x.client_ts,dirty:0});if(x.kind==='move')moved=true}}
   if(put.length){await DB.putMany(put);put.forEach(applyRec);pulled+=put.length}since=rows[rows.length-1].updated_at;CFG.lastPull=since;saveCfg();if(rows.length<500)break}
  if(moved)recomputeStock();CFG.lastSyncAt=Date.now();saveCfg();if(manual)toast(`Synced · ↑${pushed} ↓${pulled}`,'ok');if(pulled&&S.user&&!$('.mwrap')&&['sell','inventory','reports','products'].includes(S.view)){if(S.view==='sell'){renderGrid()}else go(S.view)}return true}
 catch(e){syncErr=e.message;if(manual)toast('Sync failed: '+e.message,'bad');return false}
 finally{syncing=false;renderSyncBadge()}}
setInterval(()=>{if(CFG.sbUrl&&S.user)sync(false)},60000);window.addEventListener('online',()=>sync(false));

/* ========= boot ========= */
(async function boot(){try{await DB.open()}catch(e){document.body.innerHTML='<p style="padding:20px">This browser blocks local storage (private mode?). Open in Safari/Chrome normally.</p>';return}
 const recs=await DB.boot();recs.forEach(applyRec);if(!S.branches.size){await seed()}recomputeStock();
 S.branch=S.branches.has(CFG.branch)?CFG.branch:mainBranch().id;showLogin();
 if(CFG.sbUrl)sync(false).then(()=>{if(!S.user)showLogin()});
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})})();
/* tap a box showing 0 -> empty it for typing; leave it empty -> 0 comes back */
document.addEventListener('focusin',e=>{const t=e.target;if(!(t instanceof HTMLInputElement)||t.readOnly||t.disabled)return;if(!(t.type==='number'||/decimal|numeric/.test(t.inputMode||'')))return;if(/^\s*0+(\.0+)?\s*$/.test(t.value)){t.dataset.z=t.value;t.value=''}});
document.addEventListener('focusout',e=>{const t=e.target;if(t instanceof HTMLInputElement&&t.dataset.z!==undefined){if(t.value.trim()===''){t.value=t.dataset.z}delete t.dataset.z}});
</script>
</body>
</html>
