<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--soft:#f9fafb;--acc:#ea580c;--acc-ink:#fff;--acc-soft:#fff3eb;--ok:#15803d;--ok-soft:#ecfdf3;--bad:#dc2626;--bad-soft:#fef2f2;--warn:#b45309;--warn-soft:#fffbeb;--nav:#111827;--nav-ink:#9ca3af;--r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--ink:#e5e7eb;--mute:#9ca3af;--line:#243041;--soft:#1b2230;--acc-soft:#2a1a10;--ok-soft:#0f2418;--bad-soft:#2a1414;--warn-soft:#2a2210;--nav:#070a10;--sh:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:0 0 10px}
label>input,label>select,label>div{margin-top:4px}
h2{margin:0;font-size:22px;letter-spacing:-.02em}h3{margin:0 0 14px;font-size:18px}
.mute{color:var(--mute)}.small,small{font-size:12px}.grow{flex:1}.c{text-align:center}.b{font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-weight:600;min-height:42px;white-space:nowrap}
.btn:hover{border-color:var(--mute)}.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}.btn.icon{padding:0;width:42px}
.link{background:none;border:0;padding:0;color:var(--acc);font-weight:600;cursor:pointer}.link.danger{color:var(--bad)}
.row{display:flex;align-items:center;gap:8px}.row.end{justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.inrow{display:flex;gap:6px}.inrow input{margin:0}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}.chk input{width:auto;min-height:0}
#app{display:flex;height:100%;height:100dvh}
/* nav */
.nav{width:230px;background:var(--nav);color:#fff;display:flex;flex-direction:column;padding:16px 12px;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 16px}.brand b{display:block;font-size:14px;line-height:1.2}.brand span{font-size:12px;color:var(--nav-ink)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex-shrink:0;font-weight:800;color:#fff}
.navlist{display:flex;flex-direction:column;gap:2px;flex:1}
.navlist button,.navfoot button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:10px;background:none;color:var(--nav-ink);cursor:pointer;font-weight:600;text-align:left;width:100%}
.navlist button:hover{background:#1f2937;color:#fff}.navlist button.on{background:#1f2937;color:#fff}.navlist button.on svg{color:var(--acc)}
.navfoot{border-top:1px solid #1f2937;padding-top:10px}
.brsel{background:#1f2937;border-color:#1f2937;color:#fff;margin:0 0 12px;min-height:38px;padding:8px 10px}
.sync{font-size:12px;color:var(--nav-ink);padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#6b7280;display:inline-block}.dot.ok{background:#22c55e}.dot.pend{background:#f59e0b}.dot.err{background:#ef4444}
main{flex:1;overflow:auto;min-width:0;display:flex;flex-direction:column}
#view{flex:1;min-height:0}
.mtop{display:none}
.page{padding:22px;max-width:1200px;margin:0 auto}
.ph-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:14px}.card h4{margin:0 0 12px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.kpi small{color:var(--mute);font-weight:600}.kpi b{display:block;font-size:22px;letter-spacing:-.02em;margin-top:2px}
.tb{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;position:relative}.search svg{position:absolute;left:12px;top:11px;color:var(--mute)}.search input{padding-left:40px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;scrollbar-width:none}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
/* sell */
.sell{display:grid;grid-template-columns:1fr 390px;height:100%;min-height:0}
.catalog{padding:18px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform .08s}
.tile:active{transform:scale(.97)}.tile:hover{border-color:var(--acc)}.tile.out{opacity:.6}
.ph{aspect-ratio:4/3;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff}
.ph.ini{background:hsl(var(--h),40%,92%);color:hsl(var(--h),45%,32%)}
@media (prefers-color-scheme:dark){.ph.ini{background:hsl(var(--h),25%,20%);color:hsl(var(--h),55%,75%)}}
.tname{padding:8px 10px 2px;font-weight:600;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.tfoot{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 10px;gap:4px}.tfoot b{font-size:14px}
.stk{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--ok-soft);color:var(--ok)}.stk.warn{background:var(--warn-soft);color:var(--warn)}.stk.bad{background:var(--bad-soft);color:var(--bad)}
.cart{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cart-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.cart-h b{font-size:16px}
#cartclose{display:none;margin-left:auto}
.lines{flex:1;overflow:auto;padding:6px 10px}
.line{display:grid;grid-template-columns:1fr auto 84px;gap:8px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line)}
.ln div{font-weight:600;font-size:14px;line-height:1.25}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:32px;height:34px;border:0;background:var(--soft);cursor:pointer;font-size:18px}
.qty input{width:52px;border:0;border-radius:0;text-align:center;padding:0;min-height:34px;box-shadow:none}
.lt{text-align:right;font-weight:700;cursor:pointer}
.cart-f{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--soft)}
.cart-f .row{justify-content:space-between;padding:3px 0}.cart-f .total{font-size:22px;font-weight:800;padding:8px 0}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.btn.pay{min-height:52px;font-size:15px}.btn.pay:first-child{background:var(--acc);color:#fff;border-color:var(--acc);grid-column:1/-1;font-size:17px}
.rl{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--soft)}.rl .g6{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:6px}.rl label{margin:0;font-size:11px}.rl input{min-height:38px;padding:7px 9px}.rinfo{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:13px;margin-top:8px}.tagl{margin-top:5px;font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.np{min-height:36px;padding:6px 8px}
.tbr{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--acc)}
.den td{padding:4px 6px;border:0}.den input{min-height:36px;padding:6px 8px}.resrow{display:flex;justify-content:space-between;padding:4px 0}.resrow.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:800;font-size:17px}.exrow{display:grid;grid-template-columns:1fr 100px 34px;gap:6px;margin-bottom:6px}.exrow input{min-height:36px;padding:6px 8px}.pform .row .btn.sm{padding:6px 2px;min-width:0;font-size:12px}
.lt small{display:block;font-size:11px;color:var(--ok);font-weight:600}.ln{cursor:pointer}.capwarn{font-size:12px;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:8px;margin:4px 0}.skuprev{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--mute)}textarea{min-height:200px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.empty{text-align:center;color:var(--mute);padding:40px 20px}.empty svg{opacity:.4}
.cartfab{display:none}
/* lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}.li:last-child{border-bottom:0}.li:hover{background:var(--soft)}
.li .ph{width:46px;height:46px;aspect-ratio:auto;border-radius:10px;font-size:15px;flex-shrink:0}
.li b{display:block;font-size:14px}.li .r{text-align:right}.li .r small,.li small{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}.tw{overflow-x:auto}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mute)}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.acc{background:var(--acc-soft);color:var(--acc)}
/* modal */
.mwrap{position:fixed;inset:0;background:rgba(10,12,18,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fade .15s}
.modal{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:720px}.modal.full{max-width:980px}
@keyframes fade{from{opacity:0}}
.big-total{font-size:34px;font-weight:800;text-align:center;margin:4px 0 16px;letter-spacing:-.02em}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}.change{font-size:20px;font-weight:700;text-align:center;padding:10px;background:var(--ok-soft);color:var(--ok);border-radius:10px}
.pform{display:grid;grid-template-columns:130px 1fr;gap:14px}
.photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:14px;aspect-ratio:1;cursor:pointer;overflow:hidden;color:var(--mute);margin:0}.photo img{width:100%;height:100%;object-fit:cover}
.margin{font-size:13px;padding:8px 12px;background:var(--soft);border-radius:10px;margin-bottom:6px}
.rcptwrap{background:var(--soft);padding:14px;border-radius:12px;max-height:50vh;overflow:auto}
.rcpt{font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;max-width:300px;margin:0 auto;background:#fff;color:#000;padding:12px}
.rcpt .hr{border-top:1px dashed #000;margin:6px 0}.rcpt .rr{display:flex;justify-content:space-between;gap:8px}
.pline{display:grid;grid-template-columns:2.4fr .8fr 1fr 1fr 1fr 34px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pline input{min-height:38px;padding:7px 9px}.pline .tag{font-size:10px;font-weight:700}
.phead{font-size:11px;color:var(--mute);font-weight:700}
.rthumb{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--soft)}
.upl{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;cursor:pointer;color:var(--mute);display:block}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px}
.bars div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;position:relative}.bars div:hover{opacity:.8}
.blbl{display:flex;gap:3px;font-size:10px;color:var(--mute)}.blbl span{flex:1;text-align:center;overflow:hidden}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:12px;font-weight:600;z-index:200;box-shadow:var(--sh);max-width:90vw;animation:fade .2s}
.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:#b45309;color:#fff}.toast.ok{background:var(--ok);color:#fff}
/* login */
.login{flex:1;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 20% 0%,#1f2937,var(--nav))}
.login-card{background:var(--card);border-radius:22px;padding:26px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login-card .brand{padding:0 0 18px}.login-card .brand span{color:var(--mute)}.login-card .brand b{font-size:17px}
.users{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ubtn{flex:1;min-width:90px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-weight:600}
.ubtn.on{border-color:var(--acc);background:var(--acc-soft)}.ubtn small{color:var(--mute);font-weight:500}
.av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:700}
.pin{display:flex;justify-content:center;gap:14px;margin:6px 0 16px}.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mute)}.pin i.f{background:var(--acc);border-color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font-size:22px;font-weight:600;cursor:pointer}.pad button:active{background:var(--acc-soft)}
#print-area{display:none}
@media print{
 body *{visibility:hidden!important}
 #print-area,#print-area *{visibility:visible!important}
 #print-area{display:block!important;position:absolute;left:0;top:0;width:100%}
 #print-area.r58 .rcpt{width:58mm;max-width:none;padding:0;font-size:11px}
 #print-area.r80 .rcpt{width:76mm;max-width:none;padding:0}
 .labels{display:flex;flex-wrap:wrap;gap:2mm}
 .lbl{width:50mm;height:30mm;border:1px dashed #999;padding:1.5mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden;page-break-inside:avoid;font:9px/1.1 Arial,sans-serif;color:#000}
 .lbl .nm{font-weight:700;text-align:center;max-height:7mm;overflow:hidden}.lbl .pr{font-size:12px;font-weight:800}.lbl svg{max-width:46mm;height:13mm}.lbl .qr{width:16mm;height:16mm}.lbl .qr img,.lbl .qr canvas{width:16mm!important;height:16mm!important}
 @page{margin:4mm}
}
/* tablet */
@media (max-width:1100px){.sell{grid-template-columns:1fr 340px}}
@media (max-width:980px) and (min-width:761px){.nav{width:74px;padding:14px 8px}.nav .brand div,.navlist span,.navfoot span,.sync span,.brsel{display:none}.navlist button,.navfoot button{justify-content:center}.brand{justify-content:center}}
/* phone */
@media (max-width:760px){
 #app{flex-direction:column}
 .nav{position:fixed;left:0;right:0;bottom:0;width:auto;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:50;border-top:1px solid #1f2937}
 .nav .brand,.navfoot,.brsel{display:none}
 .navlist{flex-direction:row;justify-content:space-around}
 .navlist button{flex-direction:column;gap:2px;font-size:10px;padding:6px 4px;align-items:center;flex:1}
 .mtop{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--nav);color:#fff;position:sticky;top:0;z-index:30}
 .mtop .logo{width:30px;height:30px;font-size:13px}.mtop select{flex:1;background:#1f2937;border-color:#1f2937;color:#fff;min-height:36px;padding:6px 10px}
 .mtop button{background:none;border:0;color:#cbd5e1;padding:6px}
 main{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
 .page{padding:14px}
 .sell{grid-template-columns:1fr;height:auto}#view{flex:none}main{display:block}.catalog{padding:12px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}.tname{font-size:12px;min-height:34px;padding:6px 8px 0}.tfoot{padding:2px 8px 8px}.tfoot b{font-size:13px}
 .cart{position:fixed;left:0;right:0;bottom:0;height:88dvh;border-radius:20px 20px 0 0;border:0;z-index:70;transform:translateY(105%);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
 .cart.open{transform:none}#cartclose{display:inline-flex}
 .cartfab.show{display:flex;position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:45;align-items:center;gap:10px;padding:14px 18px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(234,88,12,.4)}
 .cartfab b{margin-left:auto}
 .mwrap{align-items:flex-end;padding:0}.modal,.modal.wide,.modal.full{max-width:none;border-radius:20px 20px 0 0;max-height:94dvh;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
 .pform{grid-template-columns:96px 1fr}.g3{grid-template-columns:1fr 1fr}
 .pline{grid-template-columns:1fr 1fr 1fr 34px;padding:10px 0}.pline .pn{grid-column:1/-1}.pline .amt{display:none}.phead{display:none}
 .hide-m{display:none}.g2.stack{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print-area"></div>
<script>
'use strict';
/* ========= helpers ========= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const peso=n=>'₱'+money(n);
const fmtQty=n=>{n=r2(n);return Number.isInteger(n)?String(n):n.toFixed(2).replace(/0$/,'')};
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const fmtD=ts=>{const d=new Date(ts);return d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})};
const fmtDT=ts=>{const d=new Date(ts);return d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})};
const ymd=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const isTouch=()=>matchMedia('(pointer:coarse)').matches;
const hue=s=>{let h=0;for(const c of String(s||'x'))h=(h*31+c.charCodeAt(0))%360;return h};

const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('tindero_pos',1);r.onupgradeneeded=()=>{const d=r.result;const s=d.createObjectStore('rec',{keyPath:'id'});s.createIndex('kind','kind');s.createIndex('dirty','dirty')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 st(m){return this.db.transaction('rec',m).objectStore('rec')},
 rq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 get(id){return this.rq(this.st('readonly').get(id))},
 put(rec){return this.rq(this.st('readwrite').put(rec))},
 putMany(recs){return new Promise((res,rej)=>{const t=this.db.transaction('rec','readwrite');const s=t.objectStore('rec');recs.forEach(r=>s.put(r));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
 boot(){return new Promise((res,rej)=>{const out=[];const c=this.st('readonly').openCursor();c.onsuccess=()=>{const k=c.result;if(!k)return res(out);if(k.value.kind!=='receipt')out.push(k.value);k.continue()};c.onerror=()=>rej(c.error)})},
 all(){return this.rq(this.st('readonly').getAll())},

const SKU_UNIT=u=>{u=u.replace(/\s/g,'');if(/^(mm²|mm2|sq\.?mm)$/.test(u)||/^(in|inch|inches|")$/.test(u))return '';if(/^kgs?$/.test(u))return 'KG';if(/^(l|ltrs?|liters?|litres?)$/.test(u))return 'L';if(/^gal/.test(u))return 'GAL';if(/^w(atts?)?$/.test(u))return 'W';return u.toUpperCase()};
function skuSizes(name,cc){let s=String(name).toLowerCase().replace(/×/g,'x').replace(/[”″]|''/g,'"');const out=[];
 const dm=s.match(/\b(\d+(?:\.\d+)?)\s*x\s*(\d+(?:\.\d+)?)(?![\d.])(?:\s*x\s*(\d+(?:\.\d+)?)(?![\d.]))?(?!\s*(?:mm|cm|m\b|kg|"|in|ft))/);if(dm){out.push(dm.slice(1).filter(Boolean).join('X'));s=s.replace(dm[0],' ')}
 const re=/(\d+(?:\.\d+)?(?:\/\d+)?)\s*(mm²|mm2|sq\.?\s?mm|mm|cm|kgs?|ml|cc|ltrs?|liters?|litres?|gallons?|gal|oz|watts?|inch(?:es)?|in|ft|"|kg|g|l|w|m|v|a)(?![a-z0-9²])/g;let m;
 while((m=re.exec(s))&&out.length<2){let v=m[1],u=m[2];if(/^kgs?$/.test(u)&&v.includes('/')){const [a,b]=v.split('/').map(Number);if(b){out.push(Math.round(a/b*1000)+'G');continue}}if(cc==='LP'&&(u==='"'||/^in/.test(u))&&PLY_MM[v]){out.push(PLY_MM[v]);continue}out.push(v+SKU_UNIT(u))}
 if(!out.length){const f=s.match(/\b(\d+\/\d+)\b/);if(f)out.push(cc==='LP'&&PLY_MM[f[1]]?PLY_MM[f[1]]:f[1])}
 if(out.length<2){const g=s.match(/#\s?(\d+)/);if(g)out.push('G'+g[1])}
 return out}
function brandCode(b){b=String(b||'').trim().toLowerCase();if(!b||b==='generic'||b==='no brand')return '';const k=b.split(/\s+/)[0];return SKU_BRANDS[k]||SKU_BRANDS[b.replace(/[^a-z]/g,'')]||(b.replace(/[^a-z0-9]/g,'').slice(0,3).toUpperCase())}
function guessBrand(name){const n=String(name||'').toLowerCase().split(/[^a-z]+/);const all=brandList();for(const w of n){const f=all.find(b=>b.toLowerCase()===w);if(f)return f}for(const w of n){if(SKU_BRANDS[w])return w[0].toUpperCase()+w.slice(1)}return ''}
const brandList=()=>[...new Set(activeProducts().map(p=>String(p.brand||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
function autoSku(p,exceptId,used){used=used||new Set(activeProducts().filter(x=>x.id!==exceptId).map(x=>(x.sku||'').toUpperCase()));const name=String(p.name||''),n=name.toLowerCase();let cc=catCode(p.cat);
 let t=(SKU_TYPES.find(([r])=>r.test(n))||[])[1];const words=n.split(/[^a-z]+/).filter(Boolean);
 if(noCat(p.cat)&&TYPE_CAT[t])cc=TYPE_CAT[t];if(!t){const w=words.filter(x=>x.length>2&&!SKU_BRANDS[x]&&!SKU_COLORS[x]);t=(w[0]||'ITM').slice(0,3).toUpperCase()}
 const parts=[cc,t,...skuSizes(name,cc)];words.forEach(w=>{if(SKU_COLORS[w]&&!parts.includes(SKU_COLORS[w]))parts.push(SKU_COLORS[w])});const bc=brandCode(p.brand);if(bc&&!parts.includes(bc))parts.push(bc);else if(!bc)words.forEach(w=>{if(SKU_BRANDS[w]&&!parts.includes(SKU_BRANDS[w]))parts.push(SKU_BRANDS[w])});
 const base=parts.filter(Boolean).join('-').toUpperCase().slice(0,26).replace(/-+$/,'');let sku=base,i=2;while(used.has(sku))sku=base+'-'+(i++);return sku}

function filterProducts(q,cat){const t=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);return activeProducts().filter(p=>(!cat||cat==='All'||(p.cat||'Uncategorized')===cat)&&t.every(w=>(p.name+' '+(p.brand||'')+' '+(p.sku||'')+' '+(p.barcode||'')+' '+(p.cat||'')).toLowerCase().includes(w)))}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9.\/ ]/g,' ').split(/\s+/).filter(w=>w.length>0);

function photoURL(id){if(!id||!PHOTO.has(id))return null;if(PURL.has(id))return PURL.get(id);try{const d=PHOTO.get(id);const [h,b]=d.split(',');const bin=atob(b);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);const u=URL.createObjectURL(new Blob([u8],{type:(h.match(/:(.*?);/)||[])[1]||'image/jpeg'}));PURL.set(id,u);return u}catch(e){return PHOTO.get(id)}}

async function scanCode(title='Scan barcode / QR'){const m=modal(`<h3>${esc(title)}</h3><div id="reader" style="width:100%;min-height:240px;border-radius:12px;overflow:hidden;background:#000"></div><p class="mute small c">Point the camera at the barcode or QR code. USB/Bluetooth scanners work without this — just scan.</p><div class="row end"><button class="btn" data-close>Cancel</button></div>`);
 try{await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js')}catch(e){toast(e.message,'bad');closeModal(m);return null}
 return new Promise(res=>{let done=false;let q;const fin=v=>{if(done)return;done=true;const s=q&&q.isScanning?q.stop().catch(()=>{}):Promise.resolve();s.finally(()=>{closeModal(m);res(v)})};m.onclose=()=>{if(!done){done=true;if(q&&q.isScanning)q.stop().catch(()=>{});res(null)}};
  try{q=new Html5Qrcode('reader');q.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.min(w*.85,320),height:Math.min(h*.6,180)})},t=>{beep();fin(t)},()=>{}).catch(e=>{toast('Camera unavailable: '+e,'bad');fin(null)})}catch(e){toast('Camera error','bad');fin(null)}})}

 if(S.view!=='sell'||$('.mwrap'))return;const tag=e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;const now=Date.now();if(now-wedgeT>80)wedge='';wedgeT=now;
 if(e.key==='Enter'){if(wedge.length>=3){const p=findByCode(wedge);p?addToCart(p.id):toast('Code not found: '+wedge,'bad')}wedge='';return}if(e.key.length===1)wedge+=e.key});

const lineDisc=l=>{const g=lineGross(l),v=+l.dv||0;return r2(Math.max(0,Math.min(g,l.dt==='pct'?g*v/100:l.dt==='unit'?v*l.qty:v)))};

 <div class="row total"><span>Total</span><span>${peso(t.total)}</span></div><div class="pays">${PAYS.map(p=>`<button class="btn pay" ${c.length?'':'disabled'} onclick="checkout('${p}')">${p==='Cash'?'Cash · '+peso(t.total):p}</button>`).join('')}</div>${c.length?'<div class="c"><button class="link danger" onclick="clearCart()">Clear sale</button></div>':''}</div>`;

 if(p.reserveOnly&&!curBranch().isMain){from=mainBranch().id;toast('Reserve-only item — stock will be deducted from '+mainBranch().name,'warn')}
 const ex=S.cart.find(l=>l.pid===pid&&l.from===from&&!l.bulk);const used=S.cart.filter(l=>l.pid===pid&&l.from===from).reduce((a,l)=>a+l.qty*(l.mult||1),0);const want=used+1;const st=stockOf(pid,from);

/* ========= PHOTO CLEAN (quick + AI) ========= */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Image could not be read'));i.src=src})}
async function toImg(f){if(typeof f==='string')return loadImg(f);const u=URL.createObjectURL(f);try{return await loadImg(u)}finally{setTimeout(()=>URL.revokeObjectURL(u),2000)}}
function squareFit(c,box,out=500){const[x0,y0,x1,y1]=box,w=x1-x0+1,h=y1-y0+1,side=Math.max(w,h)*1.12,o=document.createElement('canvas');o.width=o.height=out;const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,out,out);const k=out/side;x.imageSmoothingQuality='high';x.drawImage(c,x0,y0,w,h,(out-w*k)/2,(out-h*k)/2,w*k,h*k);return o}
function quickClean(c){const x=c.getContext('2d'),W=c.width,H=c.height,d=x.getImageData(0,0,W,H),p=d.data,N=W*H;
 const bs=[];const sm=(i,j)=>{const k=(j*W+i)*4;bs.push([p[k],p[k+1],p[k+2]])};for(let i=0;i<W;i+=2){sm(i,0);sm(i,H-1)}for(let j=0;j<H;j+=2){sm(0,j);sm(W-1,j)}
 const med=n=>{const a=bs.map(b=>b[n]).sort((a,b)=>a-b);return a[a.length>>1]},bg=[med(0),med(1),med(2)],TOL=40;
 const near=(r,g,b)=>Math.abs(r-bg[0])<TOL&&Math.abs(g-bg[1])<TOL&&Math.abs(b-bg[2])<TOL;
 if(bs.filter(b=>near(b[0],b[1],b[2])).length/bs.length<.8)return null;
 const seen=new Uint8Array(N);let st=new Int32Array(N+8),sp=0;const add=i=>{if(!seen[i]){const k=i*4;if(near(p[k],p[k+1],p[k+2])){seen[i]=1;if(sp>=st.length){const n2=new Int32Array(st.length*2);n2.set(st);st=n2}st[sp++]=i}}};
 for(let i=0;i<W;i++){add(i);add((H-1)*W+i)}for(let j=0;j<H;j++){add(j*W);add(j*W+W-1)}
 while(sp){const i=st[--sp],cx=i%W;if(cx>0)add(i-1);if(cx<W-1)add(i+1);if(i>=W)add(i-W);if(i<N-W)add(i+W)}
 let x0=W,y0=H,x1=-1,y1=-1;for(let i=0;i<N;i++){if(seen[i]){const k=i*4;p[k]=p[k+1]=p[k+2]=255}else{const cx=i%W,cy=(i/W)|0;if(cx<x0)x0=cx;if(cx>x1)x1=cx;if(cy<y0)y0=cy;if(cy>y1)y1=cy}}
 if(x1<0||(x1-x0+1)*(y1-y0+1)<N*.01)return null;x.putImageData(d,0,0);return[x0,y0,x1,y1]}
async function processPhoto(f,clean){const im=await toImg(f);let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,700/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
 const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
 if(clean){const box=quickClean(c);if(box)return{url:squareFit(c,box).toDataURL('image/jpeg',.84),cleaned:true}}
 return{url:squareFit(c,[0,0,w-1,h-1]).toDataURL('image/jpeg',.82),cleaned:false}}
let bgLib=null;
async function aiRemoveBg(src,onProg){if(!navigator.onLine)throw new Error('AI needs internet');
 if(!bgLib)bgLib=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');
 const blob=typeof src==='string'?await (await fetch(src)).blob():src;const prog={};
 const out=await bgLib.removeBackground(blob,{model:'isnet_quint8',output:{format:'image/png'},progress:(key,cur,tot)=>{if(tot){prog[key]=[cur,tot];const a=Object.values(prog).reduce((s,v)=>[s[0]+v[0],s[1]+v[1]],[0,0]);onProg&&onProg(Math.round(a[0]/a[1]*100))}}});
 const im=await toImg(out),W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0);
 const d=x.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=-1,y1=-1;for(let j=0;j<H;j++)for(let i=0;i<W;i++)if(d[(j*W+i)*4+3]>24){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
 if(x1<0)throw new Error('No product found in photo');return squareFit(c,[x0,y0,x1,y1]).toDataURL('image/jpeg',.86)}
const cleanOn=()=>CFG.photoClean!==false;

let pasteTarget=null,lastClipSig='';
const isImgUrl=t=>/^(https?:\/\/\S+|data:image\/)/i.test(t||'');
async function blobFromUrl(u){u=String(u||'').trim();try{if(/^data:image\//i.test(u))return await (await fetch(u)).blob()}catch(e){}
 if(!/^https?:\/\//i.test(u))return null;for(const t of [u,'https://wsrv.nl/?url='+encodeURIComponent(u)+'&w=700&output=jpg']){try{const r=await fetch(t,{mode:'cors'});if(r.ok){const b=await r.blob();if(b.type.startsWith('image/'))return b}}catch(e){}}
 toast('Could not load that link — use "Copy image" instead','warn');return null}
document.addEventListener('paste',e=>{if(!pasteTarget)return;const items=[...(e.clipboardData?.items||[])];const it=items.find(x=>x.type.startsWith('image/'));
 if(it){e.preventDefault();const f=it.getAsFile();lastClipSig='b'+f.size;pasteTarget(f);return}
 const tx=(e.clipboardData?.getData('text')||'').trim();if(isImgUrl(tx)&&!e.target.closest?.('input,textarea')){e.preventDefault();lastClipSig='u'+tx.slice(0,300);blobFromUrl(tx).then(b=>b&&pasteTarget(b))}});
let imgWin=null;
function webSearch(name){const q=encodeURIComponent(String(name||'').replace(/["”]/g,' inch ')+' product');const url='https://www.google.com/search?tbm=isch&q='+q;let feat='';
 if(!isTouch()){const W=screen.availWidth||1280,H=screen.availHeight||800,w=Math.round(Math.min(1000,Math.max(560,W*.5))),h=Math.round(H*.9),L=(screen.availLeft||0)+W-w,T=(screen.availTop||0)+Math.round(H*.05);feat=`popup,width=${w},height=${h},left=${L},top=${T}`}
 imgWin=window.open(url,'tpos_img',feat);try{imgWin&&imgWin.focus()}catch(e){}}
function closeImgWin(){try{if(imgWin&&!imgWin.closed)imgWin.close()}catch(e){}imgWin=null}
async function readClip(silent){try{if(!navigator.clipboard?.read)throw 0;const items=await navigator.clipboard.read();
  for(const it of items){const t=it.types.find(x=>x.startsWith('image/'));if(t){const bl=await it.getType(t);return{blob:bl,sig:'b'+bl.size}}}
  for(const it of items){if(it.types.includes('text/plain')){const tx=(await (await it.getType('text/plain')).text()).trim();if(isImgUrl(tx))return{url:tx,sig:'u'+tx.slice(0,300)}}}
  if(!silent)toast('No image copied — long-press / right-click an image → Copy image','warn')}
 catch(e){if(!silent)toast(isTouch()?'Copy an image first (long-press → Copy), then tap Paste':'Copy an image, then press Cmd/Ctrl+V here','warn')}return null}
async function clipImage(){const c=await readClip(false);if(!c)return null;lastClipSig=c.sig;return c.blob||await blobFromUrl(c.url)}
async function clipGranted(){try{return (await navigator.permissions.query({name:'clipboard-read'})).state==='granted'}catch(e){return false}}
function dropZone(el,cb){el.addEventListener('dragover',e=>{e.preventDefault()});el.addEventListener('drop',e=>{e.preventDefault();const f=[...(e.dataTransfer?.files||[])].find(x=>x.type.startsWith('image/'));if(f)return cb(f);const u=e.dataTransfer?.getData('text/uri-list')||e.dataTransfer?.getData('text/plain');if(isImgUrl(u))blobFromUrl(u).then(b=>b&&cb(b));else toast('Drop an image (or copy + paste it)','warn')})}
function photoQueue(){const all=activeProducts();if(!all.length)return toast('No products yet','warn');const miss=all.filter(p=>!p.photoId);const list=miss.length?miss:all;let i=0,img=null,busy=false;
 if(CFG.pqAuto===undefined){CFG.pqAuto=true;saveCfg()}
 const m=modal(`<h3>Product photos</h3><div id="pq_b"></div>`,'wide',{lock:true});
 const onFocus=()=>{if(!CFG.pqAuto||busy)return;setTimeout(async()=>{if(!(await clipGranted()))return;const c=await readClip(true);if(!c||c.sig===lastClipSig)return;lastClipSig=c.sig;const bl=c.blob||await blobFromUrl(c.url);if(bl)set(bl)},300)};
 window.addEventListener('focus',onFocus);
 m.onclose=()=>{pasteTarget=null;closeImgWin();window.removeEventListener('focus',onFocus);if(S.view==='products')renderPList()};
 clipGranted().then(async g=>{if(g){const c=await readClip(true);if(c)lastClipSig=c.sig}});
 const saveCur=async()=>{const p=list[i];if(!img||!p||busy)return;busy=true;const id='ph_'+uid();const fresh=S.products.get(p.id)||p;await saveMany([{kind:'photo',data:{id,img}},{kind:'product',data:{...fresh,photoId:id}}]);list[i]={...fresh,photoId:id};closeImgWin();toast('Saved: '+p.name,'ok');i++;busy=false;draw()};
 const msg=(t,c='')=>{const e=m.querySelector('#pq_msg');if(e){e.textContent=t;e.style.color=c}};
 const show=u=>{img=u;const pv=m.querySelector('#pq_pv');if(!pv)return false;pv.innerHTML=`<img src="${img}">`;m.querySelector('#pq_ok').disabled=false;m.querySelector('#pq_ai').disabled=false;return true};
 const set=async f=>{if(!f||busy)return;let r;try{r=await processPhoto(f,cleanOn())}catch(e){return toast(e.message,'bad')}if(!show(r.url))return;
  if(cleanOn()&&!r.cleaned){msg('Busy background — tap AI remove background, or Save & next to keep as is.','var(--warn)');return}
  msg(r.cleaned?'Background cleaned ✓':'','var(--ok)');if(CFG.pqAuto)setTimeout(saveCur,500)};
 const runAI=async()=>{const src=img||photoURL(list[i]?.photoId);if(!src)return toast('Paste a photo first','warn');const b=m.querySelector('#pq_ai');b.disabled=true;busy=true;const t0=Date.now();
  try{msg(bgLib?'AI removing background…':'Loading AI (first time only, ~40 MB)…');const u=await aiRemoveBg(src,pc=>msg('Loading AI model… '+pc+'%'));busy=false;show(u);msg('AI background removed ✓ ('+((Date.now()-t0)/1000).toFixed(1)+' s)','var(--ok)');if(CFG.pqAuto)setTimeout(saveCur,700)}
  catch(e){busy=false;b.disabled=false;msg('AI failed: '+e.message,'var(--bad)')}};
 const draw=()=>{const p=list[i];if(!p){closeModal(m);toast('All done','ok');return}img=null;const cur=photoURL(p.photoId);
  m.querySelector('#pq_b').innerHTML=`<p class="small mute">${i+1} of ${list.length}${miss.length?' without photo':''}</p>
  <div class="pform"><label class="photo" id="pq_ph"><span id="pq_pv" style="display:contents">${cur?`<img src="${cur}">`:ic('camera',28)+'<span class="small">Camera / file</span>'}</span><input type="file" accept="image/*" id="pq_f" hidden></label>
  <div><b style="font-size:17px">${esc(p.name)}</b><p class="skuprev" style="margin:4px 0 12px">${esc(p.sku||'')} · ${esc(p.cat||'')}</p><div class="row" style="flex-wrap:wrap"><button class="btn primary" id="pq_web">${ic('search',16)} Search web</button><button class="btn" id="pq_paste">Paste image</button><button class="btn" id="pq_ai" ${cur?'':'disabled'}>${ic('spark',16)} AI remove background</button></div><p class="small b" id="pq_msg" style="min-height:18px;margin:8px 0 0"></p>
  <p class="small mute" style="margin-top:10px">${isTouch()?'Search web → long-press a photo → <b>Copy</b> → come back → <b>Paste image</b>.':'Search web → right-click a photo → <b>Copy Image</b> → click this window (or press Cmd/Ctrl+V). It saves, Google closes, next item shows.<br><small>Chrome/Edge: click Paste image once and Allow — then just clicking back is enough.</small>'}</p>
  <label class="chk"><input type="checkbox" id="pq_auto" ${CFG.pqAuto?'checked':''}> Save &amp; go to next item automatically</label><label class="chk"><input type="checkbox" id="pq_clean" ${cleanOn()?'checked':''}> Clean background to white automatically</label></div></div>
  <div class="row end"><button class="btn" data-close>Close</button><button class="btn" id="pq_prev" ${i?'':'disabled'}>Back</button><button class="btn" id="pq_skip">Skip</button><button class="btn primary" id="pq_ok" disabled>Save &amp; next</button></div>`;
  const q=s=>m.querySelector(s);q('#pq_f').onchange=e=>set(e.target.files[0]);dropZone(q('#pq_ph'),set);pasteTarget=set;
  q('#pq_web').onclick=()=>webSearch(p.name);q('#pq_paste').onclick=async()=>set(await clipImage());
  q('#pq_auto').onchange=e=>{CFG.pqAuto=e.target.checked;saveCfg()};q('#pq_clean').onchange=e=>{CFG.photoClean=e.target.checked;saveCfg()};q('#pq_ai').onclick=runAI;
  q('#pq_skip').onclick=()=>{i++;draw()};q('#pq_prev').onclick=()=>{i--;draw()};q('#pq_ok').onclick=saveCur};
 draw()}

/* ========= COSTING & PRICING ========= */
const r4=n=>Math.round((+n||0)*1e4)/1e4;
const PACK=p=>Math.max(1,+(p&&p.pack)||1);
const hasPrice=p=>+p.price>0;
function niceRound(v){v=+v||0;if(v<=0)return 0;if(v<20)return Math.ceil(v*4-1e-9)/4;if(v<100)return Math.ceil(v-1e-9);if(v<1000)return Math.ceil(v/5-1e-9)*5;return Math.ceil(v/10-1e-9)*10}
const suggestPrice=c=>niceRound((+c||0)*(1+(+S.settings.margin||0)/100));
function sugFor(p,costNow){const c=costNow??Math.max(+p.cost||0,+p.lastCost||0);if(hasPrice(p)&&p.review&&+p.reviewFrom>0){const lc=+p.lastCost||c;if(lc<=p.reviewFrom)return +p.price;return Math.max(+p.price,niceRound(p.price*lc/p.reviewFrom))}return suggestPrice(c)}
const markupPct=(price,cost)=>cost>0?Math.round((price-cost)/cost*100):0;
const needsReview=p=>p.active!==false&&(!hasPrice(p)||!!p.review);
const reviewCount=()=>activeProducts().filter(needsReview).length;
function priceLogRec(p,np,nsat,reason){return{kind:'pricelog',data:{id:'pl_'+uid(),ts:Date.now(),pid:p.id,name:p.name,old:+p.price||0,nw:+np||0,oldSat:p.satPrice??'',nwSat:nsat??'',cost:+p.cost||0,user:S.user?.name||'',reason:reason||''}}}
function matchLine(raw){const r=String(raw||'').trim().toLowerCase();if(!r)return null;return activeProducts().find(p=>p.name.toLowerCase()===r||(p.aliases||[]).includes(r)||(p.sku||'').toLowerCase()===r||(p.barcode||'').toLowerCase()===r)||matchProduct(raw)}
const UNITS=['pc','box','case','bag','pack','bundle','roll','kg','m','ft','sheet','length','set','pair','gal','L','can','tube','cu.m','dozen'];

 ${list.length?`<div class="list">${list.slice(0,300).map(p=>{const nNew=p.lines.filter(l=>l.isNew).length,nUp=p.lines.filter(l=>l.prevCost&&l.costPc>l.prevCost*1.005).length,nDn=p.lines.filter(l=>l.prevCost&&l.costPc<l.prevCost*.995).length;return `<div class="li" onclick="viewPurchase('${p.id}')"><div class="ph ini" style="--h:${hue(p.supplier)}">${esc(initials(p.supplier||'?'))}</div><div class="grow"><b>${esc(p.supplier||'Unknown supplier')}</b><small class="mute">${fmtD(p.date||p.ts)} · ${esc(brName(p.branch))}${p.invNo?' · Inv '+esc(p.invNo):''} · ${p.lines.length} items${p.receiptId?' · 📎':''}</small><small>${nNew?`<span class="pill acc">${nNew} new</span> `:''}${nUp?`<span class="pill bad">${nUp} cost ▲</span> `:''}${nDn?`<span class="pill ok">${nDn} cost ▼</span>`:''}</small></div><div class="r"><b>${peso(p.total)}</b><small class="mute">${esc(p.user)}</small></div></div>`}).join('')}</div>`:emptyBox('No deliveries yet','Tap Receive delivery and take a photo of the supplier receipt / DR.')}</div>`};

 const m=modal(`<h3>Receive delivery</h3>

 <div id="pu_lines"></div>
 <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn sm" id="pu_add">${ic('plus',16)} Add line</button><button class="btn sm" id="pu_scan">${ic('scan',16)} Scan item</button><button class="btn sm" id="pu_sug">Fill suggested prices</button><span class="grow"></span><b id="pu_tot">₱0.00</b></div>

 <div class="row end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="pu_ok">Receive &amp; add to stock</button></div>`,'full',{lock:true});
 const g=s=>m.querySelector(s);

 const lineHTML=(l,i)=>{const p=l.pid&&S.products.get(l.pid);const pack=Math.max(1,+l.pack||1),pcs=r2((+l.qty||0)*pack),cpc=(+l.cost||0)/pack;const last=p?(+p.lastCost||+p.cost||0):0;const chg=last&&cpc?((cpc-last)/last*100):null;const su=p?(p.unit||'pc'):(l.sellUnit||'pc');const pr=+l.price||0;
  return `<div class="rl" data-i="${i}"><div class="row"><input class="grow" list="pu_pl" value="${esc(l.name)}" data-k="name" placeholder="Item name"><button class="btn icon sm" data-rm="${i}" title="Remove line">${ic('x',16)}</button></div>
  <div class="tagl">${p?`<span class="pill ok">✓ ${esc(p.sku||'matched')}</span><button class="link small" data-new="${i}">not this item?</button>`:'<span class="pill acc">NEW product</span>'}${l.raw&&l.raw.toLowerCase()!==String(l.name).toLowerCase()?`<small class="mute">receipt: ${esc(l.raw)}</small>`:''}</div>

  <div class="rinfo"><span>= <b>${fmtQty(pcs)} ${esc(su)}</b> in stock</span><span>· ₱${money(cpc)}/${esc(su)}</span>${chg!=null&&Math.abs(chg)>=.5?`<span style="color:${chg>0?'var(--bad)':'var(--ok)'};font-weight:700">· cost ${chg>0?'▲':'▼'} ${Math.abs(chg).toFixed(1)}% vs last ₱${money(last)}</span>`:(p&&last&&cpc?'<span class="mute">· same cost as last</span>':'')}${pr?`<span>· ${l.priceAuto?'<span class="pill acc">suggested</span> ':''}markup <b>${markupPct(pr,cpc)}%</b></span>`:'<span style="color:var(--warn);font-weight:600">· price later</span>'}<span class="grow"></span><b>${peso((+l.qty||0)*(+l.cost||0))}</b></div></div>`};
 const fillAuto=l=>{const p=l.pid&&S.products.get(l.pid);const nm=String(l.name||'').trim();
  if(!p&&nm){if(!l.catTouched){const ai=catList().find(c=>c[1].toLowerCase()===String(l.aiCat||'').toLowerCase());l.cat=(ai&&ai[1])||guessCat(nm)||l.cat||'Uncategorized'}if(!l.brandTouched&&!l.brand)l.brand=guessBrand(nm)||''}
  if(!l.priceTouched){const cpc=(+l.cost||0)/Math.max(1,+l.pack||1);if(p&&hasPrice(p)){l.price=p.price;l.priceAuto=false}else if(cpc>0){l.price=suggestPrice(Math.max(cpc,p?(+p.lastCost||0):0));l.priceAuto=true}else{l.price='';l.priceAuto=false}}};
 const draw=()=>{P.lines.forEach(fillAuto);g('#pu_lines').innerHTML=P.lines.length?P.lines.map(lineHTML).join(''):'<p class="mute small c" style="padding:14px">No lines yet — take a photo of the receipt, add lines, or scan items.</p>';tot()};
 const applyProd=(l,p)=>{l.pid=p.id;l.name=p.name;const u=String(l.unit||'').toLowerCase().trim();
  if(l.aiPack>1)l.pack=l.aiPack;else if(p.buyUnit&&u===p.buyUnit.toLowerCase())l.pack=PACK(p);else if(u&&u===String(p.unit||'').toLowerCase())l.pack=1;else if(!u){l.unit=p.buyUnit||p.unit;l.pack=p.buyUnit?PACK(p):1}else l.pack=PACK(p);
  if(!(+l.cost>0)&&(+p.lastCost||+p.cost))l.cost=r2((+p.lastCost||+p.cost)*Math.max(1,+l.pack||1));if(!l.priceTouched)l.price=hasPrice(p)?p.price:''};
 const setMatch=(l,name)=>{l.name=name;const ex=activeProducts().find(x=>x.name.toLowerCase()===name.toLowerCase());if(ex){l.forceNew=false;return applyProd(l,ex)}if(!l.forceNew){const p=matchLine(name);if(p)return applyProd(l,p)}l.pid=null;if(!l.sellUnit)l.sellUnit=(+l.pack>1)?'pc':(l.unit||'pc');if(!l.priceTouched)l.price=''};
 g('#pu_lines').addEventListener('change',e=>{const row=e.target.closest('.rl');if(!row)return;const l=P.lines[+row.dataset.i],k=e.target.dataset.k;if(!k)return;const v=e.target.value.trim();
  if(k==='name')setMatch(l,v);else if(k==='unit'||k==='sellUnit'||k==='brand'||k==='cat'){l[k]=v;if(k==='cat')l.catTouched=true;if(k==='brand')l.brandTouched=true}else{l[k]=num(v);if(k==='pack')l.pack=Math.max(1,l.pack||1);if(k==='price'){l.priceTouched=true;l.priceAuto=false}}draw()});
 g('#pu_lines').addEventListener('input',e=>{const row=e.target.closest('.rl');if(!row)return;const k=e.target.dataset.k;if(k==='qty'||k==='cost'){P.lines[+row.dataset.i][k]=num(e.target.value);tot()}});
 g('#pu_lines').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){P.lines.splice(+b.dataset.rm,1);return draw()}const n=e.target.closest('[data-new]');if(n){const l=P.lines[+n.dataset.new];l.forceNew=true;l.pid=null;if(l.raw)l.name=l.raw;l.sellUnit=(+l.pack>1)?'pc':(l.unit||'pc');draw()}});
 g('#pu_add').onclick=()=>{P.lines.push({pid:null,name:'',qty:1,unit:'',pack:1,sellUnit:'pc',cost:'',price:''});draw();const ins=g('#pu_lines').querySelectorAll('input[data-k=name]');ins[ins.length-1]?.focus()};
 g('#pu_scan').onclick=async()=>{const c=await scanCode('Scan item received');if(!c)return;const p=findByCode(c);if(!p)return toast('Not in catalog: '+c+' — add the line by name','warn');const ex=P.lines.find(l=>l.pid===p.id);if(ex)ex.qty=(+ex.qty||0)+1;else{const l={name:p.name,qty:1,unit:'',cost:''};applyProd(l,p);P.lines.push(l)}draw()};
 g('#pu_sug').onclick=()=>{let n=0;P.lines.forEach(l=>{if(!(+l.price>0)&&+l.cost>0){const p=l.pid&&S.products.get(l.pid);const cpc=l.cost/Math.max(1,+l.pack||1);l.price=suggestPrice(Math.max(cpc,p?(+p.lastCost||0):0));l.priceTouched=true;n++}});draw();toast(n?n+' prices filled — check them':'No blank prices with a cost',n?'ok':'warn')};
 const onPhoto=async f=>{if(!f)return;P.receipt=await compressImage(f,1600,.72);g('#pu_img').innerHTML=`<img class="rthumb" src="${P.receipt}">`;g('#pu_up').style.display='none';g('#pu_alt').style.display='none';g('#pu_ai').style.display=aiKey()?'':'none';if(!aiKey())g('#pu_img').insertAdjacentHTML('beforeend','<p class="small mute">Receipt attached. Add an AI key in Settings to auto-read lines.</p>');else g('#pu_ai').click()};
 g('#pu_f').onchange=e=>onPhoto(e.target.files[0]);g('#pu_f2').onchange=e=>onPhoto(e.target.files[0]);
 g('#pu_ai').onclick=async()=>{const b=g('#pu_ai');b.disabled=true;b.innerHTML='Reading receipt…';try{const r=await aiReadReceipt(P.receipt);if(r.supplier&&!g('#pu_s').value){const nz=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'').replace(/(inc|corp|corporation|trading|enterprises?|hardware|co)$/,'');const k=nz(r.supplier);g('#pu_s').value=sups.find(x=>{const a=nz(x);return a&&(a===k||a.includes(k)||k.includes(a))})||r.supplier}if(r.invoice_no&&!g('#pu_i').value)g('#pu_i').value=r.invoice_no;if(/^\d{4}-\d{2}-\d{2}$/.test(r.date||''))g('#pu_d').value=r.date;
   const sup=g('#pu_s').value.trim().toLowerCase();(r.lines||[]).forEach(x=>{const qty=num(x.qty)||1;const cost=r2(num(x.unit_cost)||(num(x.amount)/qty));const pk=Math.max(1,num(x.pack_qty)||1);const nm=String(x.name||'').trim();const code=String(x.item_code||'').trim(),bc=String(x.barcode||'').replace(/\D/g,'');const l={raw:nm,name:nm,qty,unit:String(x.unit||'').trim(),cost,aiPack:pk>1?pk:0,pack:pk,price:'',sellUnit:String(x.piece_unit||'').trim()||(pk>1?'pc':String(x.unit||'').trim()||'pc'),brand:String(x.brand||'').trim(),aiCat:String(x.category||'').trim(),code,barcode:bc.length>=8?bc:''};
   const byCode=(code&&activeProducts().find(p=>(p.aliases||[]).includes('#'+code.toLowerCase())))||(l.barcode&&activeProducts().find(p=>p.barcode===l.barcode));if(byCode)applyProd(l,byCode);else setMatch(l,nm);P.lines.push(l)});
   draw();const matched=P.lines.filter(l=>l.pid).length;toast(`Read ${r.lines?.length||0} lines · ${matched} matched · ${P.lines.length-matched} new`,'ok');if(r.total&&Math.abs(num(r.total)-tot())>1)toast(`Check: receipt total ₱${money(r.total)} vs lines ₱${money(tot())}`,'warn')}catch(err){toast('AI read failed: '+err.message,'bad')}b.disabled=false;b.innerHTML=ic('spark',18)+' Read again'};
 g('#pu_ok').onclick=async()=>{const lines=P.lines.filter(l=>String(l.name||'').trim()&&+l.qty>0);if(!lines.length)return toast('Add at least one line','bad');
  const noCost=lines.filter(l=>!(+l.cost>0));if(noCost.length)return toast('Enter the cost for: '+noCost.slice(0,3).map(l=>l.name).join(', '),'bad');
  const supplier=g('#pu_s').value.trim(),invNo=g('#pu_i').value.trim(),branch=g('#pu_b').value;const nNew=lines.filter(l=>!l.pid).length,nLater=lines.filter(l=>!(+l.price>0)).length;
  if(!await confirmBox(`Receive ${lines.length} item${lines.length>1?'s':''} into ${brName(branch)}?${nNew?` ${nNew} new product${nNew>1?'s':''}.`:''}${nLater?` ${nLater} without sell price (set later).`:''}`,'Receive'))return;
  const ts=Date.now(),list=[],pl=[],usedS=skuSet(),work=new Map(),added={};
  lines.forEach((l,i)=>{const pack=Math.max(1,+l.pack||1),pcs=r4(l.qty*pack),cpc=r4(l.cost/pack),pr=+l.price||0;let p=l.pid&&(work.get(l.pid)||S.products.get(l.pid));let isNew=false;
   if(!p){isNew=true;const nm=String(l.name).trim();const gc=String(l.cat||'').trim()||guessCat(nm)||'Uncategorized';const br=String(l.brand??guessBrand(nm)).trim();const sku=autoSku({name:nm,cat:gc,brand:br},null,usedS);usedS.add(sku);p={id:'p_'+uid()+i,name:nm,brand:br,cat:gc,unit:l.sellUnit||(pack>1?'pc':l.unit)||'pc',sku,barcode:(l.barcode&&!activeProducts().some(x=>x.barcode===l.barcode))?l.barcode:genBarcode()+String(i%10),cost:0,price:0,satPrice:'',reorder:0,reserveOnly:false,photoId:null,active:true,aliases:[]}}else p={...p};if(l.code){const ck='#'+l.code.toLowerCase();if(!(p.aliases||[]).includes(ck))p.aliases=[ck,...(p.aliases||[])].slice(0,15)}
   if(!isNew&&!p.brand&&String(l.brand||'').trim())p.brand=String(l.brand).trim();const onHand=Math.max(0,totalStock(p.id)+(added[p.id]||0)),old=+p.cost||0,prevLast=+p.lastCost||old;
   p.cost=(onHand>0&&old>0)?r4((onHand*old+pcs*cpc)/(onHand+pcs)):cpc;p.lastCost=cpc;p.lastSupplier=supplier;p.lastBuyTs=ts;if(l.unit)p.buyUnit=l.unit;p.pack=pack;added[p.id]=(added[p.id]||0)+pcs;
   const raw=String(l.raw||'').trim().toLowerCase();if(raw&&raw!==p.name.toLowerCase())p.aliases=[...new Set([raw,...(p.aliases||[])])].slice(0,15);
   if(pr>0&&(l.priceTouched||isNew||!hasPrice(p))){if(pr!==+p.price)list.push(priceLogRec(p,pr,p.satPrice,'Receiving '+(invNo||supplier)));p.price=pr;p.needsPrice=false;p.review=false;p.priceTs=ts}
   else if(!hasPrice(p))p.needsPrice=true;
   else if(!isNew&&prevLast>0&&Math.abs(cpc-prevLast)/prevLast>.005){p.review=true;p.reviewFrom=prevLast}
   work.set(p.id,p);
   list.push({kind:'move',data:{id:P.id+'_'+i,ts,branch,pid:p.id,qty:pcs,type:'purchase',ref:P.id,user:S.user.name,note:supplier,cost:cpc}});
   pl.push({pid:p.id,name:p.name,raw:l.raw||'',qty:+l.qty,unit:l.unit||'',pack,pcs,cost:+l.cost,costPc:cpc,prevCost:isNew?0:prevLast,price:pr,isNew})});
  work.forEach(p=>list.push({kind:'product',data:p}));
  let rid=null;if(P.receipt){rid='rc_'+P.id;list.push({kind:'receipt',data:{id:rid,img:P.receipt}})}
  list.push({kind:'purchase',data:{id:P.id,ts,date:g('#pu_d').value,supplier,invNo,branch,lines:pl,total:tot(),receiptId:rid,user:S.user.name}});
  await saveMany(list);closeModal(m);toast('Received into '+brName(branch),'ok');go('purchases');
  const rv=[...work.values()].filter(needsReview).map(p=>p.id);if(rv.length&&isOwner()&&await confirmBox(`${rv.length} item${rv.length>1?'s need':' needs'} a selling price or price check. Open Price review now?`,'Price review'))priceReview(rv)};
 draw()}
async function aiReadReceipt(dataUrl){const key=aiKey();if(!key)throw new Error('No AI key');let model=aiModel();
 const prompt='Read this Philippine supplier receipt / sales invoice / delivery receipt (DR) for a hardware store. Return ONLY JSON: {"supplier":string,"invoice_no":string,"date":"YYYY-MM-DD","lines":[{"name":string,"qty":number,"unit":string,"pack_qty":number,"piece_unit":string,"brand":string,"category":string,"item_code":string,"barcode":string,"unit_cost":number,"amount":number}],"total":number}. name = full item description incl. size/thickness/brand. unit = the unit the qty is counted in (pc, box, bag, roll, bundle, kg, m, sheet, gal...). pack_qty = how many pieces/units are inside ONE of that unit when the line says so (e.g. "1 box (100 pcs)" -> 100, "roll 150m" -> 150), otherwise 1. category = best fit from this list: '+catList().map(c=>c[1]).join(" | ")+'. item_code = the supplier item/product code for the line if printed, else "". barcode = the product barcode digits if printed, else "". brand = the manufacturer/brand name if shown (e.g. Boysen, Holcim, Republic, Pioneer, Omni), else "". piece_unit = the unit of those inner pieces (pc, m, kg, ft) — e.g. wire/rope/hose by the roll -> "m"; same as unit when pack_qty is 1. unit_cost = price per unit; if only the line amount is shown, unit_cost = amount/qty. Numbers only, no commas or currency symbols. Skip VAT, discount, subtotal and total rows as lines.';
 for(let attempt=0;attempt<2;attempt++){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:dataUrl.split(',')[1]}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})});
 const j=await r.json().catch(()=>({}));if(!r.ok){const msg=j.error?.message||('HTTP '+r.status);const all=[...msg.matchAll(/models\/([a-z0-9.\-]+)/gi)].map(x=>x[1]),um=msg.match(/use\s+(?:the\s+)?models\/([a-z0-9.\-]+)/i);const sug=(um&&um[1]!==model?um[1]:null)||[...all].reverse().find(x=>x!==model);if(attempt===0&&sug&&/no longer|not found|deprecat|update your code|not supported/i.test(msg)){model=sug;if(S.shared?.aiKey&&!CFG.aiKey)save('shared',{...S.shared,id:'shared_ai',aiModel:sug});else{CFG.aiModel=sug;saveCfg()}toast('AI model updated to '+sug,'ok');continue}throw new Error(msg)}const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');return JSON.parse(t.replace(/```json|```/g,'').trim())}throw new Error('AI model unavailable')}

function priceReview(ids){if(!isOwner())return toast('Owner only','bad');const base=ids?ids.map(id=>S.products.get(id)).filter(Boolean):activeProducts();const list=base.filter(needsReview);
 if(!list.length)return toast('Nothing to review — all prices are set','ok');
 const m=modal(`<h3>Price review <span class="pill warn">${list.length}</span></h3><p class="small mute">New items: suggested = cost + ${S.settings.margin}% target markup. Cost went up: suggested keeps your current markup. Cost went down: suggested keeps the current price. Leave blank to decide later.</p>
 <div class="tw" style="max-height:58vh;overflow:auto"><table><tr><th>Item</th><th class="n">Cost</th><th class="n">Now</th><th class="n">Suggested</th><th class="n">New price</th><th></th></tr>
 ${list.map(p=>{const c=+p.cost||0,lc=+p.lastCost||c,ch=p.review&&p.reviewFrom?((lc-p.reviewFrom)/p.reviewFrom*100):null,sug=sugFor(p);return `<tr data-id="${p.id}" data-c="${Math.max(c,lc)}"><td><b>${esc(p.name)}</b><br><small>${!hasPrice(p)?'<span class="pill warn">No price</span> ':''}${ch!=null?`<span class="pill ${ch>0?'bad':'ok'}">cost ${ch>0?'▲':'▼'} ${Math.abs(ch).toFixed(1)}%</span> `:''}<span class="mute">per ${esc(p.unit||'pc')}</span></small></td><td class="n">${money(c)}${Math.abs(lc-c)>.004?`<br><small class="mute">last ${money(lc)}</small>`:''}</td><td class="n">${hasPrice(p)?money(p.price)+`<br><small class="mute">${markupPct(p.price,Math.max(c,lc))}%</small>`:'—'}</td><td class="n"><button class="link" data-sug="${sug}">${money(sug)}</button></td><td class="n"><input class="np" inputmode="decimal" style="width:92px;text-align:right" placeholder="${hasPrice(p)?money(p.price):'later'}"><br><small class="mk mute"></small></td><td>${hasPrice(p)?'<button class="btn sm" data-keep>Keep</button>':''}</td></tr>`}).join('')}</table></div>
 <div class="row end"><button class="btn" id="pr_all">Use all suggested</button><span class="grow"></span><button class="btn" data-close>Close</button><button class="btn primary" id="pr_ok">Save prices</button></div>`,'full');
 const mk=tr=>{const v=num(tr.querySelector('.np').value),c=+tr.dataset.c;tr.querySelector('.mk').textContent=v?markupPct(v,c)+'% markup':''};
 m.querySelectorAll('tr[data-id]').forEach(tr=>{tr.querySelector('.np').oninput=()=>{delete tr.dataset.keep;mk(tr)};tr.querySelector('[data-sug]').onclick=e=>{tr.querySelector('.np').value=e.target.dataset.sug;delete tr.dataset.keep;mk(tr)};const k=tr.querySelector('[data-keep]');if(k)k.onclick=()=>{tr.dataset.keep='1';const p=S.products.get(tr.dataset.id);tr.querySelector('.np').value=p.price;tr.querySelector('.mk').textContent='keep current'}});
 m.querySelector('#pr_all').onclick=()=>m.querySelectorAll('tr[data-id]').forEach(tr=>{if(!tr.dataset.keep){tr.querySelector('.np').value=tr.querySelector('[data-sug]').dataset.sug;mk(tr)}});
 m.querySelector('#pr_ok').onclick=async()=>{const out=[];const ts=Date.now();m.querySelectorAll('tr[data-id]').forEach(tr=>{const p=S.products.get(tr.dataset.id);if(!p)return;const v=r2(num(tr.querySelector('.np').value));
   if(tr.dataset.keep){out.push({kind:'product',data:{...p,review:false,reviewFrom:null}});return}if(!(v>0))return;
   if(v!==+p.price)out.push(priceLogRec(p,v,p.satPrice,'Price review'));out.push({kind:'product',data:{...p,price:v,needsPrice:false,review:false,reviewFrom:null,priceTs:ts}})});
  if(!out.length)return toast('Nothing changed','warn');await saveMany(out);closeModal(m);toast('Prices saved','ok');go(S.view)}}
function quickPrice(pid,thenAdd){const p=S.products.get(pid);const c=Math.max(+p.cost||0,+p.lastCost||0),sug=suggestPrice(c);const m=modal(`<h3>Set price · ${esc(p.name)}</h3><p class="small mute">This item has no selling price yet. Cost ₱${money(c)} per ${esc(p.unit||'pc')}.</p><label>Price per ${esc(p.unit||'pc')}<input id="qp_v" inputmode="decimal" value="${sug||''}"></label><p class="small" id="qp_m"></p><div class="row end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="qp_ok">Save${thenAdd?' &amp; add':''}</button></div>`);
 const i=m.querySelector('#qp_v'),u=()=>{m.querySelector('#qp_m').textContent=num(i.value)?markupPct(num(i.value),c)+'% markup':''};i.oninput=u;u();setTimeout(()=>i.select(),50);

function itemHistory(pid){const p=S.products.get(pid);if(!p)return;const buys=[];[...S.purchases.values()].forEach(pu=>pu.lines.forEach(l=>{if(l.pid===pid){const pk=l.pack||1;buys.push({ts:pu.ts,date:pu.date||ymd(pu.ts),sup:pu.supplier||'—',inv:pu.invNo,qty:l.qty,unit:l.unit||p.unit,pk,cost:l.cost,cpc:l.costPc??(l.cost/pk)})}}));buys.sort((a,b)=>b.ts-a.ts);
 const prices=[...S.pricelogs.values()].filter(x=>x.pid===pid).sort((a,b)=>b.ts-a.ts);const bySup={};buys.forEach(b=>{if(!bySup[b.sup])bySup[b.sup]=b});const sups=Object.values(bySup).sort((a,b)=>a.cpc-b.cpc);
 const m=modal(`<h3>${esc(p.name)}</h3><div class="kpis"><div class="kpi"><small>Average cost</small><b>${peso(p.cost)}</b><small>per ${esc(p.unit||'pc')}</small></div><div class="kpi"><small>Last cost</small><b>${peso(p.lastCost||p.cost)}</b><small>${esc(p.lastSupplier||'')}</small></div><div class="kpi"><small>Price</small><b>${hasPrice(p)?peso(p.price):'—'}</b><small>${hasPrice(p)?markupPct(p.price,Math.max(+p.cost||0,+p.lastCost||0))+'% markup':'not set'}</small></div><div class="kpi"><small>On hand</small><b>${fmtQty(totalStock(pid))}</b><small>${esc(p.unit||'')}${p.buyUnit&&PACK(p)>1?` · ${PACK(p)}/${esc(p.buyUnit)}`:''}</small></div></div>
 ${sups.length>1?`<div class="card"><h4>Latest cost by supplier</h4>${sups.map((b,i)=>`<div class="row" style="justify-content:space-between"><span>${i===0?'⭐ ':''}${esc(b.sup)} <small class="mute">${fmtD(b.ts)}</small></span><b>${peso(b.cpc)}/${esc(p.unit||'pc')}</b></div>`).join('')}</div>`:''}
 <div class="card"><h4>Cost history (deliveries)</h4>${buys.length?`<div class="tw" style="max-height:30vh;overflow:auto"><table><tr><th>Date</th><th>Supplier</th><th class="n">Qty</th><th class="n">Cost/unit</th><th class="n">Per ${esc(p.unit||'pc')}</th><th class="n">Change</th></tr>${buys.map((b,i)=>{const nx=buys[i+1],ch=nx?((b.cpc-nx.cpc)/nx.cpc*100):null;return `<tr><td><small>${fmtD(b.ts)}</small></td><td><small>${esc(b.sup)}${b.inv?' · '+esc(b.inv):''}</small></td><td class="n">${fmtQty(b.qty)} ${esc(b.unit||'')}</td><td class="n">${money(b.cost)}</td><td class="n">${money(b.cpc)}</td><td class="n">${ch!=null&&Math.abs(ch)>=.5?`<span class="pill ${ch>0?'bad':'ok'}">${ch>0?'▲':'▼'}${Math.abs(ch).toFixed(1)}%</span>`:'—'}</td></tr>`}).join('')}</table></div>`:'<p class="mute small">No deliveries recorded yet.</p>'}</div>
 <div class="card"><h4>Price history</h4>${prices.length?`<div class="tw" style="max-height:24vh;overflow:auto"><table><tr><th>Date</th><th class="n">Old</th><th class="n">New</th><th class="n">Cost then</th><th>By / reason</th></tr>${prices.map(x=>`<tr><td><small>${fmtDT(x.ts)}</small></td><td class="n">${x.old?money(x.old):'—'}</td><td class="n"><b>${money(x.nw)}</b></td><td class="n">${money(x.cost)}</td><td><small>${esc(x.user)} · ${esc(x.reason)}</small></td></tr>`).join('')}</table></div>`:'<p class="mute small">No price changes recorded yet.</p>'}</div>
 <div class="row end"><button class="btn" id="ih_mv">Stock movements</button><button class="btn primary" data-close>Close</button></div>`,'full');m.querySelector('#ih_mv').onclick=()=>moveLog(pid)}

VIEWS.inventory=function(){const br=S.invBr||S.branch;S.invBr=br;const flt=S.iflt||'all';
 const all=activeProducts();let val=0,ret=0,low=0,out=0;all.forEach(p=>{const st=stockOf(p.id,br);if(st>0){val+=st*(+p.cost||0);ret+=st*priceOf(p,br)}if(st<=0)out++;else if(st<=(+p.reorder||0))low++});
 $('#view').innerHTML=`<div class="page"><div class="ph-h"><h2>Inventory</h2><div class="acts">${brSelect(br,"S.invBr=this.value;go('inventory')")}<button class="btn ${S.countMode?'primary':''}" onclick="S.countMode=!S.countMode;go('inventory')">${S.countMode?'Exit count':'Stock count'}</button><button class="btn" onclick="moveLog()">Movements</button></div></div>
 <div class="kpis"><div class="kpi"><small>Items</small><b>${all.length}</b></div><div class="kpi"><small>Stock value (cost)</small><b>${peso(val)}</b></div><div class="kpi"><small>Retail value</small><b>${peso(ret)}</b></div><div class="kpi"><small>Low / Out</small><b><span style="color:var(--warn)">${low}</span> / <span style="color:var(--bad)">${out}</span></b></div><div class="kpi"><small>No price · No cost</small><b><span style="color:var(--warn)">${all.filter(p=>!hasPrice(p)).length}</span> · <span style="color:var(--bad)">${all.filter(p=>!(+p.cost>0)).length}</span></b>${isOwner()&&reviewCount()?'<small><button class="link" onclick="priceReview()">Price review →</button></small>':''}</div></div>
 ${S.countMode?`<div class="card small" style="margin-bottom:12px"><b>Stock count — ${esc(brName(br))}.</b> Enter the physical count for items you counted (leave blank to skip). Variance = Physical − Expected is recorded under your name. <button class="btn primary sm" onclick="saveCounts()" style="margin-left:6px">Save counts</button></div>`:''}
 <div class="tb"><div class="search">${ic('search')}<input id="iq" placeholder="Search" value="${esc(S.iq||'')}"></div><select style="width:auto" onchange="S.iflt=this.value;renderIList()"><option value="all">All</option><option value="low" ${flt==='low'?'selected':''}>Low stock</option><option value="out" ${flt==='out'?'selected':''}>Out of stock</option><option value="nocost" ${flt==='nocost'?'selected':''}>Missing cost</option><option value="noprice" ${flt==='noprice'?'selected':''}>No price</option></select></div><div id="ilist"></div></div>`;
 $('#iq').oninput=e=>{S.iq=e.target.value;renderIList()};renderIList()};
function renderIList(){const br=S.invBr,flt=S.iflt||'all';const rows=filterProducts(S.iq).filter(p=>{const st=stockOf(p.id,br);return flt==='low'?st>0&&st<=(+p.reorder||0):flt==='out'?st<=0:flt==='nocost'?!(+p.cost>0):flt==='noprice'?!hasPrice(p):true});
 $('#ilist').innerHTML=rows.length?`<div class="card tw" style="padding:6px 10px"><table><tr><th>Item</th><th class="n">${S.countMode?'Expected':'Stock'}</th>${S.countMode?'<th class="n">Physical</th><th class="n">Variance</th>':'<th class="n hide-m">Reorder</th><th class="n hide-m">Value</th><th></th>'}</tr>
 ${rows.slice(0,800).map(p=>{const st=stockOf(p.id,br);const cls=st<=0?'bad':st<=(+p.reorder||0)?'warn':'ok';return `<tr><td><a class="link" style="color:var(--ink)" onclick="moveLog('${p.id}')">${esc(p.name)}</a><br><small class="mute">${esc(p.cat||'')}</small></td><td class="n"><span class="pill ${cls}">${fmtQty(st)} ${esc(p.unit||'')}</span></td>${S.countMode?`<td class="n"><input class="cnt" data-pid="${p.id}" data-exp="${st}" inputmode="decimal" style="width:90px;text-align:right" oninput="this.closest('tr').querySelector('.var').textContent=this.value===''?'':fmtQty(num(this.value)-${st})"></td><td class="n var"></td>`:`<td class="n hide-m">${fmtQty(p.reorder||0)}</td><td class="n hide-m">${peso(Math.max(0,st)*(+p.cost||0))}</td><td class="n" style="white-space:nowrap">${isOwner()?`<button class="btn sm" onclick="adjustStock('${p.id}')">Adjust</button> <button class="btn sm" onclick="transferStock('${p.id}')">Transfer</button>`:''}</td>`}</tr>`}).join('')}</table></div>`:emptyBox('Nothing here','No items match this filter.')}
async function saveCounts(){const br=S.invBr;const list=[];let vv=0,n=0;$$('.cnt').forEach(i=>{if(i.value==='')return;const v=r2(num(i.value)-num(i.dataset.exp));n++;const p=S.products.get(i.dataset.pid);vv+=v*(+p.cost||0);if(v!==0)list.push({kind:'move',data:{id:uid()+n,ts:Date.now(),branch:br,pid:i.dataset.pid,qty:v,type:'count',note:`Count: physical ${fmtQty(num(i.value))} vs expected ${fmtQty(num(i.dataset.exp))}`,user:S.user.name}})});
 if(!n)return toast('Enter at least one count','warn');if(!await confirmBox(`${n} counted · ${list.length} with variance · value impact ${peso(vv)}. Save?`,'Save counts'))return;await saveMany(list);S.countMode=false;toast('Counts saved','ok');go('inventory')}
function adjustStock(pid){const p=S.products.get(pid),br=S.invBr||S.branch;const m=modal(`<h3>Adjust · ${esc(p.name)}</h3><p class="mute small">${esc(brName(br))} · on record: ${fmtQty(stockOf(pid,br))} ${esc(p.unit)}</p><div class="g2"><label>Change (+ add / − remove)<input id="aj_q" inputmode="decimal" placeholder="e.g. -2"></label><label>Reason<select id="aj_r"><option>Damaged</option><option>Correction</option><option>Owner use</option><option>Returned by customer</option><option>Found</option><option>Opening stock</option></select></label></div><label>Note<input id="aj_n"></label><div class="row end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="aj_ok">Save</button></div>`);
 m.querySelector('#aj_ok').onclick=async()=>{const q=num(m.querySelector('#aj_q').value);if(!q)return toast('Enter a quantity','bad');await save('move',{id:uid(),ts:Date.now(),branch:br,pid,qty:q,type:'adjust',note:m.querySelector('#aj_r').value+(m.querySelector('#aj_n').value?': '+m.querySelector('#aj_n').value:''),user:S.user.name});closeModal(m);toast('Adjusted','ok');go('inventory')}}
function transferStock(pid){const p=S.products.get(pid),from=S.invBr||S.branch;const others=branches().filter(b=>b.id!==from);const m=modal(`<h3>Transfer · ${esc(p.name)}</h3><p class="mute small">From ${esc(brName(from))} · available ${fmtQty(stockOf(pid,from))} ${esc(p.unit)}</p><div class="g2"><label>To<select id="tr_to">${others.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label><label>Quantity<input id="tr_q" inputmode="decimal"></label></div><div class="row end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="tr_ok">Transfer</button></div>`);
 m.querySelector('#tr_ok').onclick=async()=>{const q=num(m.querySelector('#tr_q').value),to=m.querySelector('#tr_to').value;if(q<=0)return toast('Enter quantity','bad');const id=uid(),ts=Date.now();await saveMany([{kind:'move',data:{id:id+'_o',ts,branch:from,pid,qty:-q,type:'transfer',ref:id,note:'To '+brName(to),user:S.user.name}},{kind:'move',data:{id:id+'_i',ts,branch:to,pid,qty:q,type:'transfer',ref:id,note:'From '+brName(from),user:S.user.name}}]);closeModal(m);toast(`Moved ${fmtQty(q)} to ${brName(to)}`,'ok');go('inventory')}}
function moveLog(pid){const br=pid?null:(S.invBr||S.branch);const list=[...S.moves.values()].filter(m=>pid?m.pid===pid:m.branch===br).sort((a,b)=>b.ts-a.ts).slice(0,400);const p=pid&&S.products.get(pid);
 modal(`<h3>${pid?'History · '+esc(p.name):'Movements · '+esc(brName(br))}</h3>${pid?`<p class="small mute">${branches().map(b=>esc(b.name)+': <b>'+fmtQty(stockOf(pid,b.id))+'</b>').join(' · ')}</p>`:''}<div class="tw" style="max-height:60vh;overflow:auto"><table><tr><th>When</th>${pid?'<th>Branch</th>':'<th>Item</th>'}<th>Type</th><th class="n">Qty</th><th class="hide-m">By / note</th></tr>${list.map(m=>`<tr><td><small>${fmtDT(m.ts)}</small></td><td><small>${pid?esc(brName(m.branch)):esc(S.products.get(m.pid)?.name||'?')}</small></td><td><span class="pill ${m.type==='sale'?'acc':m.type==='purchase'?'ok':m.type==='count'?'warn':''}">${m.type}</span></td><td class="n" style="color:${m.qty<0?'var(--bad)':'var(--ok)'}">${m.qty>0?'+':''}${fmtQty(m.qty)}</td><td class="hide-m"><small>${esc(m.user||'')} ${esc(m.note||'')}</small></td></tr>`).join('')||'<tr><td colspan="5" class="mute">No movements</td></tr>'}</table></div><div class="row end"><button class="btn primary" data-close>Close</button></div>`,'full')}

/* ========= CLOSE SHIFT / END OF DAY ========= */
const DENOMS=[1000,500,200,100,50,20,10,5,1,0.25];
function lastClose(br){let t=0;for(const c of S.closes.values())if(c.branch===br&&c.to>t)t=c.to;return t}
function salesSummary(br,from,to){const ss=[...S.sales.values()].filter(s=>(br==='all'||s.branch===br)&&s.ts>=from&&s.ts<to);const ok=ss.filter(s=>!s.void),vd=ss.filter(s=>s.void);
 const pay={Cash:0,GCash:0,Card:0,Charge:0};let gross=0,disc=0,net=0,cost=0;const items={},cash={};
 ok.forEach(s=>{pay[s.pay]=r2((pay[s.pay]||0)+s.total);gross+=s.sub;disc+=s.disc||0;net+=s.total;cash[s.cashier]=r2((cash[s.cashier]||0)+s.total);s.lines.forEach(l=>{cost+=l.qty*(l.cost||0);const k=l.pid+(l.bulk?'_b':'');const it=items[k]||(items[k]={name:l.name,unit:l.unit,qty:0,amt:0});it.qty=r2(it.qty+l.qty);it.amt=r2(it.amt+l.qty*l.price-(l.disc||0))})});
 return{count:ok.length,voids:vd.length,voidAmt:r2(vd.reduce((a,s)=>a+s.total,0)),gross:r2(gross),disc:r2(disc),net:r2(net),profit:r2(net-cost),pay,cash,items:Object.values(items).sort((a,b)=>b.amt-a.amt)}}
VIEWS.close=function(){const br=S.branch,lc=lastClose(br),d0=new Date();d0.setHours(0,0,0,0);const from=lc||d0.getTime(),sm=salesSummary(br,from,Date.now());
 const hist=[...S.closes.values()].filter(c=>isOwner()||c.branch===br).sort((a,b)=>b.to-a.to).slice(0,40);
 $('#view').innerHTML=`<div class="page" style="max-width:960px"><div class="ph-h"><h2>Close shift · ${esc(brName(br))}</h2></div>
 <p class="small mute" style="margin-top:-8px">Sales from <b>${fmtDT(from)}</b> ${lc?'(last close)':'(start of today)'} until now · cashier: ${esc(S.user.name)}</p>
 <div class="kpis"><div class="kpi"><small>Net sales</small><b>${peso(sm.net)}</b><small>${sm.count} sales${sm.voids?` · ${sm.voids} voided`:''}</small></div><div class="kpi"><small>Cash</small><b>${peso(sm.pay.Cash)}</b></div><div class="kpi"><small>GCash · Card</small><b>${peso((sm.pay.GCash||0)+(sm.pay.Card||0))}</b></div><div class="kpi"><small>Charge (utang)</small><b>${peso(sm.pay.Charge||0)}</b></div></div>
 <div class="g2 stack" style="align-items:start"><div class="card"><h4>1. Count the cash drawer</h4><label>Starting cash (float / panukli)<input id="cl_f" inputmode="decimal" value="${CFG['float_'+br]??''}" placeholder="0"></label>
 <table class="den">${DENOMS.map(d=>`<tr><td><b>₱${d<1?'0.25':d.toLocaleString()}</b></td><td class="mute">×</td><td><input class="dn" data-d="${d}" inputmode="numeric" placeholder="0" style="width:84px;text-align:right"></td><td class="n" data-t="${d}">—</td></tr>`).join('')}</table>
 <div class="resrow tot"><span>Cash counted</span><span id="cl_c">₱0.00</span></div></div>

 const ex=[];const drawEx=()=>{$('#cl_ex').innerHTML=ex.map((e,i)=>`<div class="exrow"><input data-i="${i}" data-k="d" value="${esc(e.d)}" placeholder="e.g. Ice, delivery fee"><input data-i="${i}" data-k="a" inputmode="decimal" value="${e.a||''}" placeholder="₱"><button class="btn icon sm" data-x="${i}">${ic('x',14)}</button></div>`).join('')||'<p class="mute small">None</p>';calc()};

 if(o.drawer)L.push('',`Drawer: start ₱${money(o.float)} + cash ₱${money(sm.pay.Cash||0)} − paid out ₱${money(o.paidOut||0)} = expected ₱${money(o.expected)}`,`Counted ₱${money(o.counted)} → ${Math.abs(o.diff)<1?'BALANCED':(o.diff>0?'OVER ₱':'SHORT ₱')+money(Math.abs(o.diff))}`);

function range(k){const d=new Date();d.setHours(0,0,0,0);const t0=d.getTime(),day=864e5;if(k==='today')return[t0,t0+day];if(k==='yest')return[t0-day,t0];if(k==='7d')return[t0-6*day,t0+day];if(k==='30d')return[t0-29*day,t0+day];if(k==='month'){const m=new Date(d.getFullYear(),d.getMonth(),1).getTime();return[m,t0+day]}return[t0,t0+day]}

 let tot=0,prof=0,dsum=0;const items={},cash={},pays={},buck={},dby={};const single=(to-from)<=864e5;
 const brs={};ok.forEach(s=>{tot+=s.total;let c=0;s.lines.forEach(l=>{c+=l.qty*(l.cost||0);{const bn=S.products.get(l.pid)?.brand||'No brand';const bb=brs[bn]||(brs[bn]={amt:0,prof:0});bb.amt+=l.qty*l.price-(l.disc||0);bb.prof+=l.qty*(l.price-(l.cost||0))-(l.disc||0)}const it=items[l.pid]||(items[l.pid]={name:l.name,qty:0,amt:0,prof:0});it.qty+=l.qty*(l.mult||1);it.amt+=l.qty*l.price-(l.disc||0);it.prof+=l.qty*(l.price-(l.cost||0))-(l.disc||0)});prof+=s.total-c;if(s.disc){dsum+=s.disc;const k=s.cashier+(s.discBy&&s.discBy!==s.cashier?' (appr. '+s.discBy+')':'');dby[k]=(dby[k]||0)+s.disc}cash[s.cashier]=(cash[s.cashier]||0)+s.total;pays[s.pay]=(pays[s.pay]||0)+s.total;const d=new Date(s.ts);const k=single?d.getHours():ymd(s.ts);buck[k]=(buck[k]||0)+s.total});
 const keys=[];if(single){for(let h=6;h<=21;h++)keys.push(h)}else{for(let t=from;t<to;t+=864e5)keys.push(ymd(t))}const mx=Math.max(1,...keys.map(k=>buck[k]||0));
 const top=Object.values(items).sort((a,b)=>b.amt-a.amt).slice(0,10);const charge=ok.filter(s=>s.pay==='Charge');
 const lowBr=br==='all'?S.branch:br;const lows=activeProducts().filter(p=>stockOf(p.id,lowBr)<=(+p.reorder||0)&&(+p.reorder||0)>0);
 $('#view').innerHTML=`<div class="page"><div class="ph-h"><h2>Reports</h2><div class="acts">${brSelect(br,"S.rbr=this.value;go('reports')",'',true)}<button class="btn primary" onclick="dayReport()">${ic('print',18)} Day report</button><button class="btn" onclick="exportSales()">Export sales CSV</button></div></div>
 <div class="chips">${[['today','Today'],['yest','Yesterday'],['7d','7 days'],['30d','30 days'],['month','This month']].map(([k,l])=>`<button class="chip ${rk===k?'on':''}" onclick="S.rr='${k}';go('reports')">${l}</button>`).join('')}</div>
 <div class="kpis"><div class="kpi"><small>Sales</small><b>${peso(tot)}</b></div><div class="kpi"><small>Transactions</small><b>${ok.length}</b></div><div class="kpi"><small>Average sale</small><b>${peso(ok.length?tot/ok.length:0)}</b></div><div class="kpi"><small>Gross profit</small><b>${peso(prof)}</b><small>${tot?Math.round(prof/tot*100):0}% margin</small></div><div class="kpi"><small>Discounts given</small><b>${peso(dsum)}</b><small>${ok.filter(s=>s.disc).length} sales</small></div></div>
