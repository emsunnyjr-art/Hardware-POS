<body>
<div id="app"></div>
<div id="print-area"></div>
<script>
'use strict';
/* ========= helpers ========= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const peso=n=>'₱'+money(n);
const fmtQty=n=>{n=r2(n);return Number.isInteger(n)?String(n):n.toFixed(2).replace(/0$/,'')};
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const fmtD=ts=>{const d=new Date(ts);return d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})};
const fmtDT=ts=>{const d=new Date(ts);return d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'})};
const ymd=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const isTouch=()=>matchMedia('(pointer:coarse)').matches;
const hue=s=>{let h=0;for(const c of String(s||'x'))h=(h*31+c.charCodeAt(0))%360;return h};
const initials=s=>String(s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function toast(msg,cls=''){const t=document.createElement('div');t.className='toast '+cls;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
let AC;function beep(f=1200,d=.07){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function download(name,text,type='text/csv'){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\n');
function parseCSV(t){const rows=[];let row=[],cell='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src+' (offline?)'));document.head.appendChild(s)})}
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
async function compressImage(file,max=600,q=.72){const src=await readFile(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);return c.toDataURL('image/jpeg',q)}
async function hashPin(pin,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+pin}}
const ICONS={
sell:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
products:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
purchases:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
inventory:'<path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>',
reports:'<path d="M12 20V10M18 20V4M6 20v-4"/>',
settings:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
scan:'<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M11 8v8M15 8v8M18 8v8"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',
logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
sync:'<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',
trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
spark:'<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/>',
close:'<path d="M9 2h6v4H9z"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/>'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;

/* ========= modal ========= */
function modal(html,cls='',opt={}){const w=document.createElement('div');w.className='mwrap';w.innerHTML=`<div class="modal ${cls}">${html}</div>`;w.addEventListener('click',e=>{if((!opt.lock&&e.target===w)||e.target.closest('[data-close]'))closeModal(w)});document.body.appendChild(w);return w}
function closeModal(w){if(!w||w._closed)return;w._closed=1;try{w.onclose&&w.onclose()}catch(e){}w.remove()}
function confirmBox(msg,ok='Confirm',danger=false,no='Cancel'){return new Promise(res=>{const m=modal(`<h3>${esc(msg)}</h3><div class="row end"><button class="btn" data-close>${esc(no)}</button><button class="btn ${danger?'danger':'primary'}" id="cb_ok">${esc(ok)}</button></div>`);m.onclose=()=>res(false);m.querySelector('#cb_ok').onclick=()=>{m.onclose=null;closeModal(m);res(true)}})}

/* ========= storage (IndexedDB) ========= */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('tindero_pos',1);r.onupgradeneeded=()=>{const d=r.result;const s=d.createObjectStore('rec',{keyPath:'id'});s.createIndex('kind','kind');s.createIndex('dirty','dirty')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 st(m){return this.db.transaction('rec',m).objectStore('rec')},
 rq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 get(id){return this.rq(this.st('readonly').get(id))},
 put(rec){return this.rq(this.st('readwrite').put(rec))},
 putMany(recs){return new Promise((res,rej)=>{const t=this.db.transaction('rec','readwrite');const s=t.objectStore('rec');recs.forEach(r=>s.put(r));t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
 boot(){return new Promise((res,rej)=>{const out=[];const c=this.st('readonly').openCursor();c.onsuccess=()=>{const k=c.result;if(!k)return res(out);if(k.value.kind!=='receipt')out.push(k.value);k.continue()};c.onerror=()=>rej(c.error)})},
 all(){return this.rq(this.st('readonly').getAll())},
 dirty(){return this.rq(this.st('readonly').index('dirty').getAll(1))},
 clear(){return this.rq(this.st('readwrite').clear())}};

const CFG=(()=>{try{return JSON.parse(localStorage.getItem('tpos_cfg')||'{}')}catch(e){return{}}})();
const aiKey=()=>CFG.aiKey||'';const APP_VER='70';const AI_DEFAULT='gemini-3.8-flash';const aiModel=()=>{const m=CFG.aiModel||S.shared?.aiModel||AI_DEFAULT;return /^gemini-(1|2)\./.test(m)?AI_DEFAULT:m};
function saveCfg(){try{localStorage.setItem('tpos_cfg',JSON.stringify(CFG))}catch(e){}}
if(!CFG.dev){CFG.dev=Math.random().toString(36).slice(2,4).toUpperCase();saveCfg()}

const DEF_SETTINGS={id:'settings',storeName:'My Hardware Store',address:'',tin:'',footer:'Thank you! Salamat po!',markup:15,margin:30,allowNeg:true,paper:'r58',maxDisc:10,crTerms:30,crRate:0};
const S={customers:new Map(),slists:new Map(),products:new Map(),sales:new Map(),purchases:new Map(),pricelogs:new Map(),closes:new Map(),moves:new Map(),users:new Map(),branches:new Map(),settings:{...DEF_SETTINGS},stock:{},cart:[],disc:0,discPct:false,user:null,branch:null,view:'sell',cat:'All',q:''};
const PHOTO=new Map(), PURL=new Map();
const KMAP={slist:'slists',product:'products',sale:'sales',purchase:'purchases',pricelog:'pricelogs',close:'closes',move:'moves',user:'users',branch:'branches'};
function applyRec(r){if(r.kind==='slist'&&r.data&&r.data.deleted){S.slists.delete(r.id);return}if(r.kind==='settings'){S.settings={...DEF_SETTINGS,...r.data};return}if(r.kind==='shared'&&String(r.id).startsWith('cust_')){S.customers.set(r.id,r.data);return}if(r.kind==='shared'){S.shared={...(S.shared||{}),...r.data};return}if(r.kind==='photo'){PHOTO.set(r.id,r.data.img);const u=PURL.get(r.id);if(u){URL.revokeObjectURL(u);PURL.delete(r.id)}return}const m=KMAP[r.kind];if(m)S[m].set(r.id,r.data)}
function addStock(m){const b=S.stock[m.branch]||(S.stock[m.branch]={});b[m.pid]=r2((b[m.pid]||0)+(+m.qty||0))}
function recomputeStock(){S.stock={};for(const m of S.moves.values())addStock(m)}
async function saveMany(list,ts){const now=ts??Date.now();const recs=list.map(x=>({id:x.data.id,kind:x.kind,data:x.data,ts:now,dirty:1}));await DB.putMany(recs);recs.forEach(r=>{const isNewMove=r.kind==='move'&&!S.moves.has(r.id);applyRec(r);if(isNewMove)addStock(r.data)});queueSync();}
const save=(kind,data)=>saveMany([{kind,data}]);

/* ========= domain ========= */
const activeProducts=()=>[...S.products.values()].filter(p=>p.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
const branches=()=>[...S.branches.values()].sort((a,b)=>(b.isMain?1:0)-(a.isMain?1:0)||a.name.localeCompare(b.name));
const mainBranch=()=>branches().find(b=>b.isMain)||branches()[0];
const curBranch=()=>S.branches.get(S.branch)||mainBranch();
const brName=id=>S.branches.get(id)?.name||'—';
const stockOf=(pid,br=S.branch)=>+(S.stock[br]?.[pid]||0);
const totalStock=pid=>r2(Object.values(S.stock).reduce((a,b)=>a+(+b[pid]||0),0));
const hasBulk=p=>+p.bulkPrice>0&&Math.max(1,+p.pack||1)>1;
const szOK=z=>!!(z&&String(z.unit||'').trim()&&+z.qty>0);

  for(let i=1;i<=Math.min(doc.numPages,40);i++){const pg=await doc.getPage(i);const v0=pg.getViewport({scale:1});const v=pg.getViewport({scale:Math.min(3,2200/Math.max(v0.width,v0.height))});const c=document.createElement('canvas');c.width=v.width;c.height=v.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:v}).promise;parts.push({label:'page '+i,image:c.toDataURL('image/jpeg',.85)})}}
 else if(/\.(xlsx|xlsm|xls|ods)$/.test(n)){msg('Opening Excel…');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');const wb=XLSX.read(await f.arrayBuffer());wb.SheetNames.forEach(sn=>{chunkCsv(XLSX.utils.sheet_to_csv(wb.Sheets[sn],{blankrows:false})).forEach((t,k)=>parts.push({label:sn+' part '+(k+1),text:t,sheet:sn}))})}
 else if(/\.(csv|tsv|txt)$/.test(n)||ty.startsWith('text/'))chunkCsv(await f.text()).forEach((t,k)=>parts.push({label:'part '+(k+1),text:t}));
 else if(ty.startsWith('image/')||/\.(jpe?g|png|webp|heic)$/.test(n))parts.push({label:'photo '+(parts.length+1),image:await compressImage(f,2200,.85)})}
 return parts}

VIEWS.supprices=function(){const own=isOwner();const lists=[...S.slists.values()].sort((a,b)=>a.supplier.localeCompare(b.supplier));
 $('#view').innerHTML=`<div class="page"><div class="ph-h"><h2>Supplier prices</h2><div class="acts"><button class="btn" onclick="go('purchases')">← Stock In</button>${own?`<button class="btn primary" onclick="slUpload()">${ic('camera',18)} Upload price list</button>`:''}</div></div>
 <div class="tb" style="margin-bottom:12px"><div class="search">${ic('search')}<input id="slq" placeholder="Search every supplier list — e.g. angle bar 1/4" value="${esc(S.slq||'')}" autocomplete="off"></div>${lists.length>1?`<select id="slsup" style="max-width:40%"><option value="">All suppliers</option>${lists.map(l=>`<option value="${l.id}" ${S.slSup===l.id?'selected':''}>${esc(l.supplier)}</option>`).join('')}</select>`:''}</div>

function slRender(){const el=$('#slres');if(!el)return;const own=isOwner(),q=(S.slq||'').trim(),sup=S.slSup||'';
 if(!q&&!sup){const lists=[...S.slists.values()].sort((a,b)=>a.supplier.localeCompare(b.supplier));

   :emptyBox('No supplier price lists yet',own?'Tap “Upload price list” and take photos of the list (or choose the PDF / Excel file the supplier sent).':'Ask the owner to upload supplier price lists.');return}
 const rows=slSearch(q,300,sup);const best={};rows.forEach(l=>{const k=norm(l.name).join(' ')+'|'+String(l.unit).toLowerCase();if(!best[k]||l.cost<best[k])best[k]=l.cost});const L=sup&&S.slists.get(sup);
 el.innerHTML=(L?`<div class="row" style="margin-bottom:8px;flex-wrap:wrap"><b class="grow">${esc(L.supplier)} · ${(L.lines||[]).length} items · list of ${fmtD(L.listTs||L.ts)}</b><button class="btn sm" onclick="S.slSup='';go('supprices')">All suppliers</button>${own?`<button class="btn sm" onclick="slCsv('${L.id}')">Download CSV</button><button class="btn sm" onclick="slUpload(S.slists.get('${L.id}').supplier)">Update list</button><button class="btn sm danger" onclick="slDelete('${L.id}')">Delete</button>`:''}</div>`:'')+
 (rows.length?`<div class="list">${rows.map(l=>{const p=slProd(l),k=norm(l.name).join(' ')+'|'+String(l.unit).toLowerCase(),st=p?stockOf(p.id):0;return `<div class="li" onclick="slQuote('${l.slid}','${encodeURIComponent(l.k)}')"><div class="grow"><b>${esc(l.name)}${colorChip(l)}</b><small class="mute">${esc(l.supplier)} · per ${esc(l.unit||'pc')}${l.code?' · '+esc(l.code):''} · ${fmtD(l.ts)}${ageDays(l.ts)>SL_STALE?' <span class="pill warn">old</span>':''}</small><small>${p?`<span class="pill ${st>0?'ok':'bad'}">${st>0?'In stock '+fmtQty(st):'Out of stock'}</span>`:'<span class="pill">Not stocked</span>'} ${own&&best[k]===l.cost&&rows.filter(x=>norm(x.name).join(' ')+'|'+String(x.unit).toLowerCase()===k).length>1?'⭐ cheapest':''}</small></div><div class="r">${own?`<b>${peso(l.cost)}</b> ${slChg(l)}<small>sell ${peso(p&&hasPrice(p)?priceOf(p):suggestPrice(l.cost))}</small>`:`<b>${peso(p&&hasPrice(p)?priceOf(p):suggestPrice(l.cost))}</b><small>per ${esc(l.unit||'pc')}</small>`}</div></div>`}).join('')}</div>${rows.length>=300?'<p class="small mute">First 300 shown — type more to narrow.</p>':''}`:'<div class="empty">No match in supplier lists</div>')}
function slQuote(slid,kEnc){const L=S.slists.get(slid);const k=decodeURIComponent(kEnc);const l=L&&(L.lines||[]).find(x=>x.k===k);if(!l)return;const own=isOwner();const p=slProd(l);const st=p?stockOf(p.id):0;const sug=suggestPrice(l.cost);const def=p&&hasPrice(p)?priceOf(p):sug;
 const others=slAll().filter(x=>x.slid!==slid&&norm(x.name).join(' ')===norm(l.name).join(' ')).sort((a,b)=>a.cost-b.cost);

 <div class="kpis">${own?`<div class="kpi"><small>Supplier price</small><b>${peso(l.cost)}</b><small>per ${esc(l.unit||'pc')} ${l.prev?'· was '+peso(l.prev)+' '+slChg(l):''}</small></div>`:''}<div class="kpi"><small>Suggested selling</small><b>${peso(sug)}</b><small>${own?S.settings.margin+'% markup':'per '+esc(l.unit||'pc')}</small></div>${p?`<div class="kpi"><small>Our price</small><b>${hasPrice(p)?peso(priceOf(p)):'—'}</b><small>${st>0?'in stock '+fmtQty(st)+' '+esc(p.unit||''):'out of stock'}${own&&hasPrice(p)&&String(p.unit||'').toLowerCase()===String(l.unit||'').toLowerCase()?' · '+markupPct(p.price,l.cost)+'% at this cost':''}</small></div>`:''}</div>
 ${own&&others.length?`<div class="card small"><b>Other suppliers</b>${others.map(o=>`<div class="row" style="justify-content:space-between"><span>${esc(o.supplier)} <small class="mute">${fmtD(o.ts)}</small></span><b>${peso(o.cost)}/${esc(o.unit||'pc')}</b></div>`).join('')}</div>`:''}
 <div class="g2"><label>Qty<input id="sq_q" inputmode="decimal" value="1"></label><label>Selling price / ${esc(l.unit||'pc')}<input id="sq_p" inputmode="decimal" value="${def}" ${own?'':'disabled'}></label></div>
 <p class="small mute">${p&&st>0?'In stock — sell normally, or as an order if it will come from the supplier.':'Sell as order: customer pays now, item is fetched from the supplier / main branch. Stock is not deducted.'}</p>
 <div class="row end" style="flex-wrap:wrap"><button class="btn" data-close>Close</button>${own&&!p?'<button class="btn" id="sq_add">Add as product</button>':''}${own&&p?'<button class="btn" id="sq_edit">Open product</button>':''}${p&&st>0&&hasPrice(p)?'<button class="btn" id="sq_stock">Add to cart (stock)</button>':''}<button class="btn primary" id="sq_ord">Sell as order</button></div>`);
 const g=s=>m.querySelector(s);
 g('#sq_ord').onclick=()=>{const qty=num(g('#sq_q').value)||1,pr=num(g('#sq_p').value);if(!(pr>0))return toast('Enter a price','warn');S.cart.push({pid:p?p.id:'sl:'+slid+':'+l.k,name:l.name+(l.color&&!COLOR_RX.test(l.name)?' ('+l.color+')':''),unit:l.unit||'pc',qty:r2(qty),price:r2(pr),cost:r2(l.cost),from:S.branch,mult:1,order:true,sup:L.supplier});closeModal(m);if(S.view!=='sell')go('sell');else renderCart();toggleCart(true);toast('Added as order','ok')};
 const sk=g('#sq_stock');if(sk)sk.onclick=()=>{closeModal(m);if(S.view!=='sell')go('sell');addToCart(p.id)};
 const ed=g('#sq_edit');if(ed)ed.onclick=()=>{closeModal(m);editProduct(p.id)};
 const ad=g('#sq_add');if(ad)ad.onclick=async()=>{const nid=uid();const LL=S.slists.get(slid);await save('slist',{...LL,lines:LL.lines.map(x=>x.k===l.k?{...x,pid:nid}:x)});closeModal(m);editProduct(null,{id:nid,name:l.name,color:l.color||colorOf(l),unit:l.unit||'pc',cost:r2(l.cost),lastCost:r2(l.cost),lastSupplier:L.supplier,price:sug,brand:l.brand||guessBrand(l.name)||'',cat:l.cat||guessCat(l.name)||''})}}
function slCsv(id){const L=S.slists.get(id);if(!L)return;const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Item','Color/grade','Unit','Price','Previous','Price date','Code','Brand','Category','Our product'].map(q).join(',')].concat((L.lines||[]).map(l=>[l.name,colorOf(l),l.unit,l.cost,l.prev||'',ymd(l.ts),l.code,l.brand,l.cat,slProd(l)?.name||''].map(q).join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));a.download=L.supplier.replace(/[^a-z0-9]+/gi,'_')+'_prices_'+ymd(Date.now())+'.csv';a.click()}
async function slDelete(id){const L=S.slists.get(id);if(!await dangerGate({title:'Delete supplier price list',btn:'Delete',lines:[`Deletes <b>${esc(L.supplier)}</b> price list: ${(L.lines||[]).length} items, list of ${fmtD(L.listTs||L.ts)}, on every synced device.`,'Products and their costs are not changed.']}))return;await save('slist',{...L,lines:[],uploads:[],deleted:true});S.slists.delete(id);S.slSup='';toast('Deleted','ok');go('supprices')}
function slUpload(sup=''){if(!isOwner())return toast('Owner only','bad');if(!(CFG.sbUrl&&CFG.sbKey))return toast('Set up Cloud sync first (Settings) — the AI reader runs there','warn');
 let rows=[],stop=null,busy=false;
 const m=modal(`<h3>Upload supplier price list</h3><div class="g2"><label>Supplier<input id="sl_s" list="sl_sl" value="${esc(sup)}" placeholder="e.g. STSC (AI fills it if blank)" autocomplete="off"></label><label>Price list date<input type="date" id="sl_d" value="${ymd(Date.now())}"></label></div><datalist id="sl_cl">${Object.keys(COLORS).map(c=>`<option value="${capW(c)}">`).join('')}</datalist><datalist id="sl_sl">${knownSuppliers().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
 <label class="upl" id="sl_up" style="padding:14px">${ic('camera',26)}<br><b>Photos, PDF or Excel of the price list</b><br><small>Several pages at once is fine. Add more anytime.</small><input type="file" multiple accept="image/*,application/pdf,.pdf,.xlsx,.xls,.xlsm,.csv" id="sl_f" hidden></label>
 <p class="small b" id="sl_st" style="margin:8px 0"></p><div id="sl_sum" class="small"></div><div id="sl_rows" style="max-height:52vh;overflow:auto"></div>
 <label class="chk"><input type="checkbox" id="sl_rep"> This is the COMPLETE list — remove old items not in it</label>
 <div class="row end"><button class="btn" data-close>Cancel</button><button class="btn" id="sl_stop" style="display:none">Stop</button><button class="btn primary" id="sl_ok" disabled>Save price list</button></div>`,'full',{lock:true});
 m.onclose=()=>{if(stop)stop.abort()};const g=s=>m.querySelector(s);
 const prevOf=()=>{const L=S.slists.get(slId(slSupName(g('#sl_s').value.trim())));return new Map(((L&&L.lines)||[]).map(x=>[slKey(x),x]))};
 const draw=()=>{const pm=prevOf();let up=0,dn=0,nw=0;rows.forEach(r=>{r.k=slKey(r);const o=pm.get(r.k);r._o=o;if(!o)nw++;else if(r.cost>o.cost+.004)up++;else if(r.cost<o.cost-.004)dn++;if(r.pid===undefined)r.pid=(o&&o.pid&&S.products.has(o.pid))?o.pid:(slMatch(r.name+(r.color?' '+r.color:''),r.brand,r.unit)?.id||null)});
  g('#sl_sum').innerHTML=rows.length?`<b>${rows.length} items</b> · <span style="color:var(--bad)">${up} ▲</span> · <span style="color:var(--ok)">${dn} ▼</span> · ${nw} new · ${rows.filter(r=>r.pid).length} linked to products. Fix anything wrong, then Save.`:'';g('#sl_ok').disabled=!rows.length||busy;
  g('#sl_rows').innerHTML=rows.map((r,i)=>{const o=r._o,c=o?(r.cost-o.cost)/o.cost*100:null,p=r.pid&&S.products.get(r.pid);return `<div class="slr" data-i="${i}"><div class="row"><input class="grow" data-k="name" value="${esc(r.name)}"><button class="btn icon sm" data-rm="${i}" title="Remove">${ic('x',14)}</button></div><div class="row"><label class="sm">Per<input data-k="unit" value="${esc(r.unit||'')}"></label><label class="sm">Price<input data-k="cost" inputmode="decimal" value="${r.cost}"></label><label class="sm">Color / grade<input data-k="color" list="sl_cl" value="${esc(r.color||'')}" placeholder="${esc(colorOf({name:r.name})||'—')}"></label><span class="grow small">${!o?'<span class="pill acc">new</span>':Math.abs(c)<.1?'<span class="mute">same as before</span>':`<b style="color:${c>0?'var(--bad)':'var(--ok)'}">${c>0?'▲':'▼'} ${Math.abs(c).toFixed(1)}%</b> <span class="mute">was ${money(o.cost)}</span>`}${p?`<br><span style="color:var(--ok)">✓ ${esc(p.name)}</span> <button class="link small" data-unl="${i}">unlink</button>`:''}</span></div></div>`}).join('')};
 g('#sl_rows').addEventListener('change',e=>{const tr=e.target.closest('.slr[data-i]');if(!tr)return;const r=rows[+tr.dataset.i],k=e.target.dataset.k;if(!k)return;r[k]=k==='cost'?num(e.target.value):e.target.value.trim();if(k==='name'||k==='color')r.pid=undefined;if(k==='color')r.color=capW(r.color.toLowerCase());draw()});
 g('#sl_rows').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){rows.splice(+b.dataset.rm,1);return draw()}const u=e.target.closest('[data-unl]');if(u){rows[+u.dataset.unl].pid=null;draw()}});
 g('#sl_s').onchange=()=>{rows.forEach(r=>{if(!r.pidSet)r.pid=undefined});draw()};
 const add=list=>{const byK=new Map(rows.map(r=>[slKey(r),r]));list.forEach(x=>{const r={name:String(x.name||'').trim(),color:capW(String(x.color||'').trim().toLowerCase()),unit:String(x.unit||'pc').trim().toLowerCase(),cost:r2(+x.cost||0),code:String(x.code||'').trim(),brand:String(x.brand||'').trim(),cat:x.category||'',pid:undefined};if(!r.name||!(r.cost>0))return;const k=slKey(r);if(byK.has(k))Object.assign(byK.get(k),{cost:r.cost});else{rows.push(r);byK.set(k,r)}});draw()};
 g('#sl_f').onchange=async e=>{const files=[...e.target.files];e.target.value='';if(!files.length||busy)return;busy=true;stop=new AbortController();g('#sl_stop').style.display='';const st=t=>g('#sl_st').textContent=t;
  try{const parts=await plParts(files,st);if(!parts.length)throw new Error('No readable pages');let done=0,fail=[],idx=0,t0=Date.now();const tick=()=>st(`Reading ${parts.length} page${parts.length>1?'s':''} with AI… ${done}/${parts.length} done · ${Math.round((Date.now()-t0)/1000)}s`);const tm=setInterval(tick,1000);tick();
   const worker=async()=>{while(idx<parts.length){const pt=parts[idx++];try{const res=await aiJob(pt.image?{image:pt.image.split(',')[1],cats:{task:'pricelist',cats:catList().map(c=>c[1])}}:{cats:{task:'pricelist',text:pt.text,sheet:pt.sheet||'',cats:catList().map(c=>c[1])}},200000,stop.signal);
     if(res.supplier&&!g('#sl_s').value.trim()){g('#sl_s').value=slSupName(res.supplier)}if(/^\d{4}-\d\d-\d\d$/.test(res.date||'')&&!g('#sl_d').dataset.ai){g('#sl_d').value=res.date;g('#sl_d').dataset.ai=1}add(res.lines||[]);if(res.truncated)fail.push(pt.label+' (too long — split it)')}catch(err){if(stop.signal.aborted)break;fail.push(pt.label+': '+err.message)}done++;tick()}};
   await Promise.all([worker(),worker(),worker()]);clearInterval(tm);
   st(stop.signal.aborted?'Stopped.':`✓ Read ${parts.length-fail.length} of ${parts.length} page${parts.length>1?'s':''} in ${Math.round((Date.now()-t0)/1000)}s${fail.length?' · not read: '+fail.join('; '):''}`)}
  catch(err){st('Could not read: '+err.message)}finally{busy=false;stop=null;g('#sl_stop').style.display='none';draw()}};
 g('#sl_stop').onclick=()=>stop&&stop.abort();
 g('#sl_ok').onclick=async()=>{const sp=g('#sl_s').value.trim();if(!sp)return toast('Enter the supplier name','warn');if(!rows.length)return;const supN=slSupName(sp),id=slId(supN),old=S.slists.get(id)||{id,supplier:supN,lines:[],uploads:[]};const dt=g('#sl_d').value||ymd(Date.now()),ts=new Date(dt+'T12:00').getTime();
  const oldMap=new Map((old.lines||[]).map(x=>[slKey(x),x])),map=new Map(g('#sl_rep').checked?[]:(old.lines||[]).map(x=>[slKey(x),x]));let up=0,dn=0,nw=0;
  rows.forEach(r=>{const k=slKey(r),o=oldMap.get(k);const nl={k:o?o.k:k,name:r.name,color:r.color||'',unit:r.unit||'pc',cost:r2(r.cost),code:r.code||'',brand:r.brand||'',cat:r.cat||'',pid:r.pid||null,ts};if(!o)nw++;else if(Math.abs(o.cost-nl.cost)>.004){nl.prev=o.cost;nl.prevTs=o.ts;nl.cost>o.cost?up++:dn++}else{if(o.prev){nl.prev=o.prev;nl.prevTs=o.prevTs}}map.set(k,nl)});
  const rec={...old,deleted:false,supplier:supN,ts:Date.now(),listTs:ts,by:S.user.name,lines:[...map.values()],uploads:[{ts:Date.now(),listTs:ts,by:S.user.name,n:rows.length,up,dn,nw},...(old.uploads||[])].slice(0,30)};
  await save('slist',rec);m.onclose=null;closeModal(m);const fc=await fillCostsFromLists(true);toast(`Saved ${supN}: ${rows.length} prices (${up} ▲ · ${dn} ▼ · ${nw} new)${fc?` · cost filled for ${fc} product${fc>1?'s':''}`:''}`,'ok');S.slSup=id;S.slq='';go('supprices')}}

function cntVar(p,r){if(!r)return'';const out=[];const f=(v,u)=>{const val=r2(v);return `<b style="color:${val>0?'var(--ok)':val<0?'var(--bad)':'var(--mute)'}">${val>0?'+':''}${fmtQty(val)}</b>${u?' '+esc(u):''}`};let pv=0;if(r.c!=null){out.push(f(r.c-r.e,''));pv+=(r.c-r.e)*(+p.cost||0)}if(r.lc!=null){out.push(f(r.lc-r.le,p.looseUnit||''));pv+=(r.lc-r.le)*looseCostOf(p)}return out.join('<br>')+(Math.abs(pv)>=.5?`<br><small class="mute">${pv>0?'+':'−'}${peso(Math.abs(pv))}</small>`:'')}

const CUST_TYPES=['Walk-in','Regular','Contractor','Business / Company','Government','Employee / Staff'];
const TERMS=[7,15,30,45,60,90];
const PAY_LBL={Cash:'Cash',GCash:'GCash / Maya',Bank:'Bank transfer',Card:'Card',Charge:'Credit (utang)'};const payLbl=p=>PAY_LBL[p]||p;
const nkey=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const custList=()=>[...S.customers.values()].filter(c=>!c.deleted).sort((a,b)=>String(a.name).localeCompare(b.name));
const custFind=name=>{const k=nkey(name);return k?custList().find(c=>nkey(c.name)===k)||null:null};
const custOf=s=>(s.custId&&S.customers.get(s.custId))||custFind(s.cust)||null;
const custTypeOf=s=>{const c=custOf(s);return c?(c.type||'Regular'):(s.custType||(s.cust?'Regular':'Walk-in'))};
const crTotal=s=>s.credit?+s.credit.toCollect:r2((+s.total||0)-(+s.down||0));
const crPaid=s=>r2((s.payments||[]).reduce((a,p)=>a+(+p.amt||0),0));
const crBal=s=>{if(!s||s.void||s.pay!=='Charge')return 0;if(s.paid&&!s.credit&&!(s.payments||[]).length)return 0;return Math.max(0,r2(crTotal(s)-crPaid(s)))};
const crDue=s=>s.credit?.due||(s.ts+30*864e5);
const crNextDue=s=>{const sc=s.credit?.sched;if(!sc||!sc.length)return crDue(s);let acc=0;const pd=crPaid(s);for(const x of sc){acc+=+x.amt;if(pd<acc-.5)return x.due}return crDue(s)};
const crOver=s=>crBal(s)>.5&&crNextDue(s)<Date.now();
const crPct=s=>{const t=crTotal(s);return t>0?Math.min(100,Math.floor(crPaid(s)/t*100)):100};
const daysTo=t=>Math.round((t-Date.now())/864e5);
const crPill=s=>{const b=crBal(s);if(b<=.5)return '<span class="pill ok">Paid</span>';const d=daysTo(crNextDue(s));return d<0?`<span class="pill bad">Overdue ${-d}d</span>`:`<span class="pill warn">Due ${d===0?'today':'in '+d+'d'}</span>`};
const creditSales=()=>[...S.sales.values()].filter(s=>s.pay==='Charge'&&!s.void);
const pctBar=(p,col)=>`<span class="pbar"><i style="width:${Math.max(0,Math.min(100,p))}%;${col?'background:'+col:''}"></i></span>`;
function custStats(c){const k=c?nkey(c.name):'';const ss=[...S.sales.values()].filter(s=>!s.void&&((c&&c.id&&s.custId===c.id)||(k&&nkey(s.cust)===k)));const cr=ss.filter(s=>s.pay==='Charge');const open=cr.filter(s=>crBal(s)>.5).sort((a,b)=>crNextDue(a)-crNextDue(b));
 return{ss,cr,open,bal:r2(open.reduce((a,s)=>a+crBal(s),0)),over:r2(open.filter(crOver).reduce((a,s)=>a+crBal(s),0)),bought:r2(ss.reduce((a,s)=>a+s.total,0)),last:ss.reduce((a,s)=>Math.max(a,s.ts),0)}}
function creditCalc(principal,days,rate,n){principal=Math.max(0,r2(principal));days=Math.max(1,+days||30);const months=r4(days/30),interest=r2(principal*(+rate||0)/100*months),toCollect=r2(principal+interest);n=Math.max(1,Math.min(12,Math.round(+n||1)));const now=Date.now(),sched=[];let left=toCollect;
 for(let i=1;i<=n;i++){const amt=i===n?r2(left):r2(toCollect/n);left=r2(left-amt);sched.push({due:now+Math.round(days/n*i)*864e5,amt})}return{principal,days,rate:+rate||0,months,interest,toCollect,n,due:now+days*864e5,sched}}

/* ========= OPERATING COSTS (OPEX): salaries, rent, utilities — owner only ========= */
const OPEX_TYPES={salary:'Salary',rent:'Rent',util:'Utilities',other:'Other'};
const opexCfg=()=>S.shared?.opex||{lines:[],days:26};
const opexLineM=(l,days)=>r2(l.per==='day'?(+l.amt||0)*(+l.days||days||26):l.per==='week'?(+l.amt||0)*52/12:(+l.amt||0));
function opexMonthly(br='all'){const c=opexCfg(),by={};let t=0;(c.lines||[]).forEach(l=>{if(br!=='all'&&l.branch&&l.branch!==br)return;const v=opexLineM(l,c.days);t+=v;by[l.type||'other']=(by[l.type||'other']||0)+v});return{total:r2(t),by,days:+c.days||26}}
// markup needed to cover M per month when selling S per month: gross S*m/(1+m)=M → m=M/(S−M)
const needMarkup=(M,S)=>S>M&&M>0?Math.ceil(M/(S-M)*100):null;
const breakEven=(M,mk)=>mk>0?r2(M*(1+mk/100)/(mk/100)):null;
function opexCard(tot,prof,from,to,br){if(!isOwner())return'';const o=opexMonthly(br);const mk=+S.settings.margin||0;
 if(!o.total)return `<div class="card"><h4>Profit after costs</h4><p class="small mute">Add your monthly salaries, rent and bills to see net profit, break-even sales and whether your markup is enough.</p><div class="row end"><button class="btn" onclick="opexEdit()">＋ Add monthly costs</button></div></div>`;
 const first=Math.min(...[...S.sales.values()].map(s=>s.ts).filter(Boolean),to);const f0=Math.max(from,new Date(new Date(first).setHours(0,0,0,0)).getTime());const days=Math.max(1,Math.round((Math.min(to,Date.now())-f0)/864e5));
 const pOpex=r2(o.total*days/30.4),net=r2(prof-pOpex),pace=r2(tot/days*30.4),need=needMarkup(o.total,pace),be=breakEven(o.total,mk),beDay=be&&r2(be/o.days),act=tot-prof>0?Math.round(prof/(tot-prof)*100):0;
 const ok=need!==null&&mk>=need;
 return `<div class="card"><div class="row" style="justify-content:space-between"><h4 style="margin:0">Profit after costs <span class="small mute">(${days} day${days>1?'s':''})</span></h4><button class="btn sm" onclick="opexEdit()">Edit costs</button></div>
 <div class="kpis" style="margin:10px 0"><div class="kpi"><small>Gross profit</small><b>${peso(prof)}</b><small>actual markup ${act}%</small></div><div class="kpi"><small>Operating costs</small><b>${peso(pOpex)}</b><small>${peso(o.total)}/month · ${Object.entries(o.by).map(([k,v])=>OPEX_TYPES[k]+' '+peso(v)).join(' · ')}</small></div><div class="kpi"><small>Net profit</small><b style="color:var(--${net>=0?'ok':'bad'})">${peso(net)}</b><small>${tot?Math.round(net/tot*100):0}% of sales</small></div></div>
 <table><tr><td>To cover ${peso(o.total)}/month at your <b>${mk}%</b> suggested markup, sell at least</td><td class="n"><b>${be?peso(be):'—'}</b>/month<br><small>${beDay?peso(beDay)+'/day ('+o.days+' days open)':''}</small></td></tr>
 <tr><td>Your sales pace now</td><td class="n"><b>${peso(pace)}</b>/month</td></tr>
 <tr><td>Markup needed at this pace just to break even</td><td class="n">${need===null?'<span class="pill bad">sales below costs</span>':`<b>${need}%</b>`}</td></tr></table>
 <p class="small" style="margin:8px 0 0">${need===null?`⚠ Sales are lower than monthly costs — no markup can cover it. Grow sales to at least ${peso(be||0)}/month or cut costs.`:ok?`✓ ${mk}% suggested markup covers costs at this pace (needs ${need}%). Every extra ₱100 sold adds about ${peso(100*mk/(100+mk))} profit.`:`⚠ ${mk}% suggested markup is <b>not enough</b> at this pace — needs ${need}%. Raise the target markup in Settings, or sell ${peso(be)}/month.`}${days<14?' <span class="mute">Few days of data — pace is a rough guess.</span>':''}</p></div>`}
function opexEdit(){if(!isOwner())return toast('Owner only','warn');const c=JSON.parse(JSON.stringify(opexCfg()));c.lines=c.lines||[];c.days=+c.days||26;
 const m=modal(`<h3>Monthly costs (OPEX)</h3><p class="small mute">Salaries, rent, electricity, water, internet… Used in Reports for net profit and to check if your markup covers costs. Per day × days open, per week × 4.33 = monthly.</p>
 <label style="max-width:220px">Days open per month<input id="ox_d" inputmode="numeric" value="${c.days}"></label><div id="ox_l"></div>
 <div class="row"><button class="btn sm" id="ox_add">＋ Add cost</button></div><p id="ox_sum" class="small" style="margin:10px 0"></p>
 <div class="row end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ox_ok">Save</button></div>`,'wide');const g=s=>m.querySelector(s);
 const sum=()=>{let t=0,by={};c.lines.forEach(l=>{const v=opexLineM(l,c.days);t+=v;by[l.type]=(by[l.type]||0)+v});const mk=+S.settings.margin||0,be=breakEven(t,mk);
  g('#ox_sum').innerHTML=t?`Total <b>${peso(t)}</b>/month (${Object.entries(by).map(([k,v])=>OPEX_TYPES[k]+' '+peso(v)).join(' · ')}) → at ${mk}% markup you must sell <b>${peso(be)}</b>/month ≈ <b>${peso(be/c.days)}</b>/day to break even.`:'No costs yet.';
  m.querySelectorAll('[data-m]').forEach(e=>{const l=c.lines[+e.dataset.m];e.textContent=peso(opexLineM(l,c.days))+'/mo'})};
 const draw=()=>{const G='display:grid;gap:6px;grid-template-columns:1fr 1fr';g('#ox_l').innerHTML=c.lines.length?c.lines.map((l,i)=>`<div data-i="${i}" style="border:1px solid var(--line,#e5e5e5);border-radius:12px;padding:10px;margin:8px 0"><div class="row" style="gap:6px"><input class="grow" data-k="name" value="${esc(l.name||'')}" placeholder="e.g. Cashier, Store rent"><button class="btn icon sm" data-rm="${i}" title="Remove">${ic('x',14)}</button></div>
  <div style="${G};margin-top:6px"><select data-k="type">${Object.entries(OPEX_TYPES).map(([k,v])=>`<option value="${k}" ${l.type===k?'selected':''}>${v}</option>`).join('')}</select><select data-k="branch"><option value="">All branches</option>${branches().map(b=>`<option value="${b.id}" ${l.branch===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
  <input data-k="amt" inputmode="decimal" value="${l.amt||''}" placeholder="Amount ₱"><select data-k="per"><option value="month">per month</option><option value="day" ${l.per==='day'?'selected':''}>per day</option><option value="week" ${l.per==='week'?'selected':''}>per week</option></select>
  ${l.per==='day'?`<input data-k="days" inputmode="numeric" value="${l.days||''}" placeholder="days/mo (${c.days})" title="Days worked per month">`:''}</div><small class="mute" data-m="${i}"></small></div>`).join(''):'<p class="small mute">No costs yet — tap ＋ Add cost.</p>';sum()};
 g('#ox_l').addEventListener('input',e=>{const tr=e.target.closest('[data-i]');if(!tr)return;const l=c.lines[+tr.dataset.i],k=e.target.dataset.k;if(!k)return;l[k]=['amt','days'].includes(k)?num(e.target.value):e.target.value;if(k==='per')draw();else sum()});
 g('#ox_l').addEventListener('change',e=>{const tr=e.target.closest('[data-i]');if(!tr||e.target.tagName!=='SELECT')return;c.lines[+tr.dataset.i][e.target.dataset.k]=e.target.value;if(e.target.dataset.k==='per')draw();else sum()});
 g('#ox_l').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){c.lines.splice(+b.dataset.rm,1);draw()}});
 g('#ox_d').oninput=e=>{c.days=num(e.target.value)||26;sum()};
 g('#ox_add').onclick=()=>{c.lines.push({id:'ox_'+uid(),name:'',type:'salary',branch:'',amt:0,per:'month'});draw();setTimeout(()=>{const i=m.querySelectorAll('[data-k="name"]');i[i.length-1]?.focus()})};
 g('#ox_ok').onclick=async()=>{c.lines=c.lines.filter(l=>String(l.name||'').trim()||+l.amt>0);await saveMany([{kind:'shared',data:{id:'shared_opex',opex:c}}]);closeModal(m);toast('Monthly costs saved — '+peso(opexMonthly().total)+'/month','ok');if(S.view==='reports'||S.view==='settings')go(S.view)};
 draw()}

function range(k){const d=new Date();d.setHours(0,0,0,0);const t0=d.getTime(),day=864e5;if(k==='custom'){const a=new Date((S.rf||ymd(t0))+'T00:00:00').getTime(),b=new Date((S.rt||ymd(t0))+'T00:00:00').getTime()+day;return[Math.min(a,b-day),Math.max(b,a+day)]}if(k==='all')return[0,t0+day];if(k==='today')return[t0,t0+day];if(k==='yest')return[t0-day,t0];if(k==='7d')return[t0-6*day,t0+day];if(k==='30d')return[t0-29*day,t0+day];if(k==='month'){const m=new Date(d.getFullYear(),d.getMonth(),1).getTime();return[m,t0+day]}if(k==='week'){const w=(d.getDay()+6)%7;return[t0-w*day,t0+day]}if(k==='lmonth'){const a=new Date(d.getFullYear(),d.getMonth()-1,1).getTime(),b=new Date(d.getFullYear(),d.getMonth(),1).getTime();return[a,b]}if(k==='year'){return[new Date(d.getFullYear(),0,1).getTime(),t0+day]}return[t0,t0+day]}
function txFilter(sales){const q=String(S.txq||'').toLowerCase().trim();if(!q)return sales;const n=num(q);return sales.filter(s=>(s.no+' '+(s.cust||'')+' '+(s.company||'')+' '+(s.ref||'')+' '+(s.cashier||'')+' '+payLbl(s.pay)+' '+(s.drNo||'')+' '+s.lines.map(l=>l.name).join(' ')).toLowerCase().includes(q)||(n>0&&Math.abs(s.total-n)<.01))}

 let tot=0,prof=0,dsum=0;const items={},cash={},pays={},buck={},dby={};const single=(to-from)<=864e5,mon=(to-from)>62*864e5;
 const brs={};ok.forEach(s=>{tot+=s.total;let c=0;s.lines.forEach(l=>{c+=l.qty*(l.cost||0);{const bn=S.products.get(l.pid)?.brand||'No brand';const bb=brs[bn]||(brs[bn]={amt:0,prof:0});bb.amt+=l.qty*l.price-(l.disc||0);bb.prof+=l.qty*(l.price-(l.cost||0))-(l.disc||0)}const ik=l.loose?LKEY(l.pid):l.pid;const it=items[ik]||(items[ik]={name:l.loose?l.name+' (loose, '+l.unit+')':l.name,qty:0,amt:0,prof:0});it.qty+=l.qty*(l.mult||1);it.amt+=l.qty*l.price-(l.disc||0);it.prof+=l.qty*(l.price-(l.cost||0))-(l.disc||0)});prof+=s.total-c;if(s.disc){dsum+=s.disc;const k=s.cashier+(s.discBy&&s.discBy!==s.cashier?' (appr. '+s.discBy+')':'');dby[k]=(dby[k]||0)+s.disc}cash[s.cashier]=(cash[s.cashier]||0)+s.total;pays[s.pay]=(pays[s.pay]||0)+s.total;const d=new Date(s.ts);const k=single?d.getHours():mon?ymd(s.ts).slice(0,7):ymd(s.ts);buck[k]=(buck[k]||0)+s.total});
 const keys=[];if(single){for(let h=6;h<=21;h++)keys.push(h)}else if(mon){const a=new Date(from);for(let y=a.getFullYear(),mo=a.getMonth();new Date(y,mo,1).getTime()<to;mo++){const dt=new Date(y,mo,1);keys.push(ymd(dt.getTime()).slice(0,7))}}else{for(let t=from;t<to;t+=864e5)keys.push(ymd(t))}const mx=Math.max(1,...keys.map(k=>buck[k]||0));
 const top=Object.values(items).sort((a,b)=>b.amt-a.amt).slice(0,10);const charge=ok.filter(s=>s.pay==='Charge');const sm=salesSummary(br,from,to);const recv=creditSales().filter(x=>br==='all'||x.branch===br).reduce((a,x)=>{const b=crBal(x);a.bal=r2(a.bal+b);if(crOver(x))a.over=r2(a.over+b);return a},{bal:0,over:0});
 const lowBr=br==='all'?S.branch:br;const lows=activeProducts().filter(p=>stockOf(p.id,lowBr)<=(+p.reorder||0)&&(+p.reorder||0)>0);
 $('#view').innerHTML=`<div class="page"><div class="ph-h"><h2>Reports</h2><div class="acts">${brSelect(br,"S.rbr=this.value;go('reports')",'',true)}<button class="btn primary" onclick="dayReport()">${ic('print',18)} Day report</button><button class="btn" onclick="exportSales()">Export sales CSV</button></div></div>
 <div class="chips">${[['today','Today'],['yest','Yesterday'],['week','This week'],['7d','7 days'],['month','This month'],['lmonth','Last month'],['30d','30 days'],['year','This year'],['all','All time'],['custom','Pick dates']].map(([k,l])=>`<button class="chip ${rk===k?'on':''}" onclick="S.rr='${k}';go('reports')">${l}</button>`).join('')}</div>

 ${opexCard(tot,prof,from,to,br)}<div class="card"><h4>${single?'Sales by hour':mon?'Monthly sales':'Daily sales'}</h4><div class="bars">${keys.map(k=>`<div style="height:${(buck[k]||0)/mx*100}%" title="${k}: ${peso(buck[k]||0)}"></div>`).join('')}</div><div class="blbl">${keys.map((k,i)=>`<span>${single?(k%3===0?k+'h':''):mon?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+String(k).slice(5)-1]:(keys.length<=8||i%Math.ceil(keys.length/8)===0?String(k).slice(5):'')}</span>`).join('')}</div></div>
 <div class="g2 stack" style="margin-top:14px;align-items:start"><div><div class="card"><h4>Top brands</h4>${Object.keys(brs).length?`<table>${Object.entries(brs).sort((a,b)=>b[1].amt-a[1].amt).slice(0,8).map(([k,v])=>`<tr><td>${esc(k)}<br><small class="mute">profit ${peso(v.prof)}</small></td><td class="n">${peso(v.amt)}</td></tr>`).join('')}</table>`:'<p class="mute small">No sales</p>'}</div><div class="card"><h4>Top items</h4>${top.length?`<table>${top.map(t=>`<tr><td>${esc(t.name)}<br><small class="mute">${fmtQty(t.qty)} sold · profit ${peso(t.prof)}</small></td><td class="n">${peso(t.amt)}</td></tr>`).join('')}</table>`:'<p class="mute small">No sales</p>'}</div></div>
 <div><div class="card"><h4>By cashier</h4>${Object.entries(cash).map(([k,v])=>`<div class="row" style="justify-content:space-between"><span>${esc(k)}</span><b>${peso(v)}</b></div>`).join('')||'<p class="mute small">—</p>'}</div>${dsum?`<div class="card"><h4>Discounts by cashier</h4>${Object.entries(dby).map(([k,v])=>`<div class="row" style="justify-content:space-between"><span>${esc(k)}</span><b>${peso(v)}</b></div>`).join('')}</div>`:''}<div class="card"><h4>By payment</h4>${tot?shareRows(['Cash','GCash','Bank','Card','Charge'].map(k=>[payLbl(k)+(k==='Cash'&&sm.credit.down?' (incl. down pay)':''),sm.pay[k]||0]).filter(x=>x[1]),tot):'<p class="mute small">—</p>'}</div>

 <div class="card"><h4>By category</h4>${tot?shareRows(Object.entries(sm.byCat).sort((a,b)=>b[1]-a[1]).slice(0,12),tot):'<p class="mute small">—</p>'}</div>
 <div class="card"><h4>Reorder now · ${esc(brName(lowBr))}</h4>${lows.slice(0,15).map(p=>`<div class="row" style="justify-content:space-between"><span>${esc(p.name)}</span><span class="pill ${stockOf(p.id,lowBr)<=0?'bad':'warn'}">${fmtQty(stockOf(p.id,lowBr))} / ${fmtQty(p.reorder)}</span></div>`).join('')||'<p class="mute small">All stocked</p>'}</div></div></div>

async function sbReq(path,opt={}){const r=await fetch(CFG.sbUrl+'/rest/v1/'+path,{...opt,headers:sbHeaders(opt.headers||{})});let t='';try{t=await r.text()}catch(e){}return{status:r.status,ok:r.ok,text:t}}
const denied=r=>r.status===401||r.status===403||/42501|permission denied|row-level security/i.test(r.text);
const missingTbl=r=>r.status===404||/PGRST205|does not exist|Could not find the table/i.test(r.text);
/* database rules: returns [{ok, warn, title, detail, fix}] */
async function checkDbRules(full=true){const out=[];const add=(ok,title,detail,fix,warn)=>out.push({ok,warn:!!warn,title,detail,fix});
 if(!(CFG.sbUrl&&CFG.sbKey)){add(false,'Cloud sync connected','Not connected on this device.','Settings → Cloud sync → paste the Project URL and publishable key.');return out}
 let r;try{r=await sbReq('pos_records?select=id&limit=1')}catch(e){add(false,'Cloud reachable','Cannot reach the server: '+e.message,'Check internet. Free Supabase projects pause after 7 days without use — open the project in supabase.com to wake it.');return out}
 if(missingTbl(r)){add(false,'Database tables created','Table pos_records is missing.','Run setup.sql in the Supabase SQL Editor.');return out}
 add(r.ok,'Cloud reachable','Records table answers ('+r.status+').',r.ok?'':'Check the Project URL and publishable key in Cloud sync.');
 r=await sbReq('pos_records?id=eq.__setup_probe__',{method:'DELETE',headers:{Prefer:'return=minimal'}});
 add(denied(r),'Sync key cannot delete records',denied(r)?'Delete was refused — correct.':'DELETE was allowed ('+r.status+'). OLD database rules: anyone with the key can wipe data.','Run the newest setup.sql in the SQL Editor.');
 r=await sbReq('pos_records_history?select=hid&limit=1');
 add(denied(r),'History of changes kept (recovery)',denied(r)?'History table exists and is locked — correct.':missingTbl(r)?'History table is MISSING (old rules).':'History table can be read with the sync key ('+r.status+').','Run the newest setup.sql in the SQL Editor.');
 r=await sbReq('pos_secrets?select=id&limit=1');
 add(denied(r),'Server secrets locked',denied(r)?'Secrets table exists and is locked — correct.':missingTbl(r)?'Secrets table is MISSING (old rules).':'Secrets can be read with the sync key!','Run the newest setup.sql in the SQL Editor.');
 if(full){r=await sbReq('pos_records',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({id:'__setup_probe__',kind:'zz_probe',data:{probe:1},client_ts:0,deleted:false})});
  const kindOk=denied(r)||r.status===400;add(kindOk,'Only known record types accepted',kindOk?'Unknown record type was refused — correct.':'Unknown record type was accepted (old rules).','Run the newest setup.sql in the SQL Editor.');
  if(!kindOk)await sbReq('pos_records?id=eq.__setup_probe__',{method:'DELETE'});
  r=await sbReq('pos_ai_jobs?select=id&limit=1');
  if(missingTbl(r))add(false,'AI reader queue','Table pos_ai_jobs is missing — receipts and price lists cannot be read by AI.','Run the newest setup.sql, then deploy the read-receipt function (README section 3).');
  else{add(r.ok,'AI reader queue','AI job table answers ('+r.status+').','Run the newest setup.sql.');
   r=await sbReq('pos_ai_jobs',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({id:'chk_'+CFG.dev+'_'+uid(),status:'queued',cats:'x'.repeat(310000)})});
   const lim=/AI limit/.test(r.text);add(lim,'AI spending limit',lim?'Oversized AI request was refused — limit is active.':'No AI limit on this database (old rules) — a leaked key could run up the AI bill.','Run the newest setup.sql in the SQL Editor.')}}
 return out}

async function saveCats(){const cats=$('#st_cats').value.split('\n').map(x=>x.split('=')).filter(x=>x.length>=2).map(([c,...n])=>[c.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3),n.join('=').trim()]).filter(c=>c[0]&&c[1]);if(!cats.length)return toast('Enter at least one line like CM = Cement & Masonry','bad');const codes=cats.map(c=>c[0]);const dup=codes.find((c,i)=>codes.indexOf(c)!==i);if(dup)return toast('Duplicate code '+dup,'bad');await save('settings',{...S.settings,cats});toast(cats.length+' categories saved','ok');go('settings')}
async function saveBranch(id,k,v){const b={...S.branches.get(id),[k]:k==='code'?v.trim().toUpperCase():v.trim()};await save('branch',b);toast('Branch saved','ok')}
async function sizeEdit(i,k,v){const cur=[...(S.settings.sizes||[])];if(k==='add')cur.push({unit:'New size',qty:1,of:'cu.m'});else if(k==='del'){if(!await confirmBox('Remove "'+cur[i].unit+'" from saved sizes? Items that already use it keep it.','Remove',true))return;cur.splice(i,1)}else cur[i]={...cur[i],[k]:k==='qty'?Math.max(0,num(v)):String(v).trim()};await save('settings',{...S.settings,sizes:cur});if(k==='add'||k==='del')go('settings');else toast('Saved','ok')}
async function addBranch(){const n=S.branches.size;await save('branch',{id:'br_'+uid(),name:'Branch '+(n+1),code:'B'+(n+1)});go('settings')}
function editUser(id){const u=id?{...S.users.get(id)}:{id:'u_'+uid(),name:'',role:'cashier',active:true};const m=modal(`<h3>${id?'Edit user':'Add cashier'}</h3><label>Name<input id="us_n" value="${esc(u.name)}"></label><div class="g2"><label>Role<select id="us_r"><option value="cashier">Cashier</option><option value="owner" ${u.role==='owner'?'selected':''}>Owner / manager</option></select></label><label>${id?'New PIN (blank = keep)':'4-digit PIN'}<input id="us_p" inputmode="numeric" maxlength="4"></label></div>${id?`<label class="chk"><input type="checkbox" id="us_a" ${u.active!==false?'checked':''}> Active</label>`:''}<p class="small mute">Cashiers can sell, receive stock and do stock counts. Only owners can edit products/prices, adjust or transfer stock, void sales, and see reports.</p><div class="row end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="us_ok">Save</button></div>`);
 m.querySelector('#us_ok').onclick=async()=>{u.name=m.querySelector('#us_n').value.trim();if(!u.name)return toast('Name required','bad');u.role=m.querySelector('#us_r').value;const p=m.querySelector('#us_p').value.trim();if(p){if(!/^\d{4}$/.test(p))return toast('PIN must be 4 digits','bad');u.pin=await hashPin(p,u.id)}else if(!id)return toast('PIN required','bad');if(id)u.active=m.querySelector('#us_a').checked;
  if(u.id===S.user.id&&u.role!=='owner')return toast("Can't remove your own owner role",'bad');if([...S.users.values()].filter(x=>x.role==='owner'&&x.active!==false&&x.id!==u.id).length===0&&(u.role!=='owner'||u.active===false))return toast('Keep at least one active owner','bad');
  await save('user',u);if(u.id===S.user.id)S.user=u;closeModal(m);toast('Saved','ok');go('settings')}}
async function saveSync(on){if(!on){delete CFG.sbUrl;delete CFG.sbKey;saveCfg();renderSyncBadge();go('settings');return}const u=$('#sy_u').value.trim().replace(/\/+$/,''),k=$('#sy_k').value.trim();if(!/^https:\/\//.test(u)||!k)return toast('Enter URL and key','bad');if(CFG.sbUrl!==u){CFG.lastPull=null}CFG.sbUrl=u;CFG.sbKey=k;saveCfg();const ok=await sync(true);if(ok)go('settings')}
async function backup(){const all=await DB.all();download(`tindero_backup_${ymd(Date.now())}.json`,JSON.stringify({app:'tindero-pos',v:1,at:Date.now(),records:all.map(r=>({id:r.id,kind:r.kind,data:r.data,ts:r.ts}))}),'application/json');CFG.lastBackup=Date.now();saveCfg()}
async function restoreBackup(f){if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.records))throw new Error('Not a Tindero backup');const byK={};j.records.forEach(r=>{byK[r.kind]=(byK[r.kind]||0)+1});if(!await dangerGate({title:'Restore backup',btn:'Restore',lines:[`Backup from ${j.at?fmtDT(j.at):'unknown date'}: ${Object.entries(byK).map(([k,n])=>n+' '+k).join(', ')}.`,'Records with the same ID on this device are REPLACED by the backup version and uploaded to the cloud (the cloud keeps the old versions in its history).']}))return;const now=Date.now();await DB.putMany(j.records.map((r,i)=>({id:r.id,kind:r.kind,data:r.data,ts:now+i,dirty:1})));toast('Restored — reloading','ok');setTimeout(()=>location.reload(),800)}catch(e){toast('Restore failed: '+e.message,'bad')}}
async function resetDevice(){const dirty=(await DB.dirty()).length;const cnt=k=>S[k]?S[k].size:0;
 if(!await dangerGate({title:'Erase this device',word:'DELETE',btn:'Erase this device',lines:[`Deletes from <b>this device</b>: ${cnt('products')} products, ${cnt('sales')} sales, ${cnt('purchases')} deliveries, ${cnt('moves')} stock movements, ${cnt('users')} users, settings and photos.`,dirty?`<b style="color:var(--bad)">${dirty} change${dirty>1?'s':''} on this device are NOT uploaded yet and will be lost.</b>`:(CFG.sbUrl?'Everything on this device is already uploaded; the cloud copy is NOT deleted.':'<b style="color:var(--bad)">Cloud sync is not set up — this is the only copy. Download a backup first.</b>'),'Cloud sync settings on this device are also removed.']}))return;await DB.clear();localStorage.removeItem('tpos_cfg');location.reload()}

/* ========= SYNC (Supabase REST) ========= */
let syncing=false,syncTimer=null,syncErr='';
function queueSync(){renderSyncBadge();if(!CFG.sbUrl)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),3000)}
function sbHeaders(extra={}){const h={apikey:CFG.sbKey,'Content-Type':'application/json',...extra};if(/^eyJ/.test(CFG.sbKey))h.Authorization='Bearer '+CFG.sbKey;return h}
async function renderSyncBadge(){const el=$('#syncb');if(!el)return;let n=0;try{n=(await DB.dirty()).length}catch(e){}const cls=!CFG.sbUrl?'':syncErr?'err':n?'pend':'ok';const txt=!CFG.sbUrl?'Local only':syncing?'Syncing…':syncErr?'Sync error':n?n+' to sync':'Synced';el.innerHTML=`<span class="dot ${cls}"></span><span>${txt}</span>`;el.title=syncErr||'';const mb=$('#syncm');if(mb)mb.style.color=cls==='err'?'#ef4444':cls==='pend'?'#f59e0b':cls==='ok'?'#22c55e':''}
async function sync(manual){if(!CFG.sbUrl||!CFG.sbKey){if(manual)toast('Cloud sync not set up — see Settings','warn');return false}if(syncing)return false;if(!navigator.onLine){if(manual)toast('Offline — will sync later','warn');return false}
 syncing=true;syncErr='';renderSyncBadge();const base=CFG.sbUrl+'/rest/v1/pos_records';let pulled=0,pushed=0;
 const refused=[];try{const dirty=await DB.dirty();const up=ch=>fetch(base+'?on_conflict=id',{method:'POST',headers:sbHeaders({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(ch.map(x=>({id:x.id,kind:x.kind,data:x.data,client_ts:x.ts||0,deleted:false})))});
  for(let i=0;i<dirty.length;i+=150){let ch=dirty.slice(i,i+150);const r=await up(ch);
   if(!r.ok){const t=(await r.text()).slice(0,160);if(r.status<400||r.status>=500||r.status===401&&!/42501|row-level|violates/i.test(t))throw new Error(r.status+' '+t);
    // a 4xx for the batch: send one by one and set aside only the records the server refuses
    const okOnes=[];for(const x of ch){const r1=await up([x]);if(r1.ok)okOnes.push(x);else{const t1=(await r1.text()).slice(0,120);refused.push(x.kind+' '+x.id+': '+t1);const cur=await DB.get(x.id);if(cur&&cur.ts===x.ts)await DB.putMany([{...cur,dirty:2,refused:t1}])}}ch=okOnes}
   const fresh=[];for(const x of ch){const cur=await DB.get(x.id);if(cur&&cur.ts===x.ts&&cur.dirty)fresh.push({...cur,dirty:0})}await DB.putMany(fresh);pushed+=ch.length}
  let since=CFG.lastPull?new Date(Date.parse(CFG.lastPull)-120000).toISOString():'1970-01-01T00:00:00Z';let moved=false;
  for(let guard=0;guard<200;guard++){const r=await fetch(`${base}?select=id,kind,data,client_ts,updated_at&updated_at=gt.${encodeURIComponent(since)}&order=updated_at.asc&limit=500`,{headers:sbHeaders()});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));const rows=await r.json();if(!rows.length)break;
   const put=[];for(const x of rows){const cur=await DB.get(x.id);if(!cur||(!cur.dirty&&cur.ts!==+x.client_ts)||(cur.dirty&&+x.client_ts>cur.ts)){put.push({id:x.id,kind:x.kind,data:x.data,ts:+x.client_ts,dirty:0});if(x.kind==='move')moved=true}}
   if(put.length){await DB.putMany(put);put.forEach(applyRec);pulled+=put.length}since=rows[rows.length-1].updated_at;CFG.lastPull=since;saveCfg();if(rows.length<500)break}
  if(moved)recomputeStock();CFG.lastSyncAt=Date.now();saveCfg();if(refused.length){syncErr=refused.length+' record(s) refused by the server and set aside: '+refused.slice(0,3).join(' · ');toast('Sync: '+refused.length+' record(s) refused by the server — the rest synced. See the sync status for details.','warn')}if(manual)toast(`Synced · ↑${pushed} ↓${pulled}`,'ok');if(pulled&&S.user&&!$('.mwrap')&&['sell','inventory','reports','products'].includes(S.view)){if(S.view==='sell'){renderGrid()}else go(S.view)}return true}
 catch(e){syncErr=e.message;if(manual)toast('Sync failed: '+e.message,'bad');return false}
 finally{syncing=false;renderSyncBadge()}}
setInterval(()=>{if(CFG.sbUrl&&S.user)sync(false)},60000);window.addEventListener('online',()=>sync(false));

function receiptFinder(){const own=isOwner();let q='',days=30;const m=modal(`<div class="row pu_top"><h3 style="margin:0">🧾 Find receipt</h3><span class="grow"></span><button class="btn sm" data-close>✕ Close</button></div>
 <div class="search" style="margin-bottom:6px">${ic('search')}<input id="rf_q" placeholder="Receipt no., customer, item, ref no., amount" autocomplete="off"></div>
 <div class="chips" id="rf_d" style="margin:0 0 6px">${[[1,'Today'],[2,'Since yesterday'],[7,'7 days'],[30,'30 days'],[365,'1 year'],[0,'All']].map(([d,l])=>`<button class="chip ${d===days?'on':''}" data-d="${d}">${l}</button>`).join('')}</div>
 <div id="rf_n" class="small mute"></div><div id="rf_l"></div>`,'full');const g=x=>m.querySelector(x);
 const draw=()=>{const d0=new Date();d0.setHours(0,0,0,0);const from=days?d0.getTime()-(days-1)*864e5:0;const L=[...S.sales.values()].filter(s=>s.ts>=from&&(own||s.branch===S.branch)).sort((a,b)=>b.ts-a.ts);const keep=S.txq;S.txq=q;const R=q?txFilter(L):L;S.txq=keep;
  g('#rf_n').textContent=`${R.length} receipt${R.length===1?'':'s'}${R.length>150?' · showing newest 150 — type to narrow':''}`;
  g('#rf_l').innerHTML=`<table>${R.slice(0,150).map(s=>`<tr style="cursor:pointer;${s.void?'opacity:.5;text-decoration:line-through':''}" data-id="${s.id}"><td><b>${esc(s.no)}</b><br><small class="mute">${fmtDT(s.ts)} · ${esc(s.cashier||'')}</small></td><td><small>${esc(s.cust||'Walk-in')}${s.company?'<br>'+esc(s.company):''}<br>${esc(payLbl(s.pay))}${s.ref?' #'+esc(s.ref):''}</small></td><td class="n"><b>${peso(s.total)}</b><br><small class="mute">${s.lines.length} item${s.lines.length>1?'s':''}</small></td></tr>`).join('')}</table>`};
 g('#rf_q').oninput=()=>{q=g('#rf_q').value.trim();draw()};g('#rf_d').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;days=+b.dataset.d;g('#rf_d').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));draw()};

/* ========= TAP-TO-RETYPE: tapping a filled box clears it for new input; old value shows faintly and comes back if nothing is typed ========= */
(function(){const SKIP=/^(checkbox|radio|file|date|datetime-local|month|time|color|range|button|submit|hidden|password)$/;
 const ok=el=>el&&el.tagName==='INPUT'&&!SKIP.test(el.type)&&!el.readOnly&&!el.disabled&&!el.closest('[data-keep]')&&!el.hasAttribute('data-keep');
 const back=el=>{if(el._rt&&!el._rt.ed&&el.value==='')el.value=el._rt.v;if(el._rt)el.placeholder=el._rt.ph;el._rt=null};
 document.addEventListener('focusin',e=>{const el=e.target;if(!ok(el)||el.value==='')return;el._rt={v:el.value,ph:el.placeholder,ed:false};el.placeholder=el.value;el.value=''},true);
 document.addEventListener('input',e=>{const el=e.target;if(el._rt)el._rt.ed=true},true);
 document.addEventListener('keydown',e=>{const el=e.target;if(!el._rt||el._rt.ed)return;if(e.key==='Backspace'||e.key==='Delete'){el._rt.ed=true;return}if(e.key==='Enter'||e.key==='Tab'){el.value=el._rt.v;el._rt.ed=true}},true);
 document.addEventListener('blur',e=>{if(e.target._rt)back(e.target)},true);})();

/* tap a box showing 0 -> empty it for typing; leave it empty -> 0 comes back */
document.addEventListener('focusin',e=>{const t=e.target;if(!(t instanceof HTMLInputElement)||t.readOnly||t.disabled)return;if(!(t.type==='number'||/decimal|numeric/.test(t.inputMode||'')))return;if(/^\s*0+(\.0+)?\s*$/.test(t.value)){t.dataset.z=t.value;t.value=''}});
document.addEventListener('focusout',e=>{const t=e.target;if(t instanceof HTMLInputElement&&t.dataset.z!==undefined){if(t.value.trim()===''){t.value=t.dataset.z}delete t.dataset.z}});
